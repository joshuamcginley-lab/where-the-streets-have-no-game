<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MacPhisto Host Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Tinos:ital,wght@0,400;1,400&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  header.cover { height: 5rem; }
  header.cover .title { font-size: clamp(1.2rem, 3.4vw, 2.2rem); }
  main { max-width: 1100px; margin: 0 auto; padding: 1.2rem 16px 3rem; }
  .bar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: space-between; margin-bottom: .8rem; }
  .bar p { margin: 0; color: var(--muted); font-size: .95rem; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: .35rem; overflow: hidden; }
  .seg button { background: none; border: 0; padding: .45rem .8rem; font: 600 .75rem var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--fg); color: #000; }

  /* the stage: full width here, or the size of the TV corner in the game */
  .stage-wrap { display: grid; place-items: center; background: #050404; border: 1px solid var(--line); border-radius: .4rem; padding: 1rem; }
  .stage { width: 100%; }
  .stage.small { width: min(36%, 380px); justify-self: end; }
  .stage .mp-svg { display: block; width: 100%; height: auto; }

  /* subtitles under the stage, in the album-title serif */
  .mp-sub { min-height: 2.8em; margin-top: .5rem; text-align: center; font-family: var(--font-serif); font-size: clamp(1rem, 2.4vw, 1.6rem);
    line-height: 1.3; color: #fff; opacity: 0; transition: opacity .2s; }
  .mp-sub.on { opacity: 1; }
  .mp-sub em { font-style: italic; }
  .stage.small .mp-sub { font-size: .95rem; }

  #groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.4rem 1rem; margin-top: 1.6rem; align-items: start; }
  h2 { font: 600 .8rem var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }
  .lines { display: grid; gap: .5rem; }
  .line { text-align: left; background: var(--raise); border: 1px solid var(--line); border-radius: .35rem; padding: .6rem .75rem; cursor: pointer; }
  .line:hover { border-color: var(--muted); }
  .line[aria-pressed="true"] { border-color: var(--red); background: #2a1612; }
  .line b { display: block; font: 600 .7rem var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--red); margin-bottom: .25rem; }
  .line span { font-size: .9rem; color: var(--fg); }
</style>
</head>
<body>
<header class="cover"><span class="title">MacPhisto</span></header>
<main>
  <div class="bar">
    <p>Click a line to hear it. The video walls show his face while he talks.</p>
    <div class="seg" role="group" aria-label="Stage size">
      <button type="button" data-size="big" aria-pressed="true">Big</button>
      <button type="button" data-size="small" aria-pressed="false">TV corner</button>
    </div>
  </div>
  <div class="stage-wrap"><div class="stage" id="stage"></div></div>
  <div id="groups"></div>
</main>
<script src="members.js"></script>
<script src="host-lines.js"></script>
<script src="macphisto.js"></script>
<script>
  const host = MacPhisto.mount(document.getElementById("stage"));
  const stage = document.getElementById("stage");

  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    stage.classList.toggle("small", b.dataset.size === "small");
  }));

  // one group of buttons per game moment, in the order the README lists them
  const groups = {};
  for (const [id, line] of Object.entries(HOST_LINES)) (groups[line.moment] ||= []).push([id, line]);
  const order = ["Game start", "New game", "A player joins", "All four characters taken", "Round start (first round)", "Round start",
    "Round 2 start (before the count-in)", "Round start (later rounds)",
    "Song clip question", "Album cover question", "Everyone got it right", "Nobody got it right", "Time running out",
    "Four in a row (anyone)", "Larry on a streak", "Bono on a streak", "Adam on a streak", "The Edge on a streak", "Streak broken", "Lead change",
    "Close race", "Last place", "Phone gag (a lull)", "Who said it?", "Last question", "Double points", "Final wager", "Bet everything and won",
    "Bet everything and lost", "Between rounds", "Tournament: between rounds", "Final winner", "Tournament champion", "Final: a tie", "Goodnight"];
  const names = Object.keys(groups).sort((a, b) => ((order.indexOf(a) + 1) || 99) - ((order.indexOf(b) + 1) || 99));
  const box = document.getElementById("groups");
  let playing = null;
  for (const name of names) {
    const sec = document.createElement("section"); box.appendChild(sec);
    const h = document.createElement("h2"); h.textContent = name; sec.appendChild(h);
    const list = document.createElement("div"); list.className = "lines"; sec.appendChild(list);
    for (const [id, line] of groups[name]) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "line"; b.setAttribute("aria-pressed", "false");
      b.innerHTML = `<b>${id}</b><span></span>`;
      // CAPS were stress marks for the voice; show them as italics, like the subtitles
      b.querySelector("span").innerHTML = line.phrases.map(p => p.text).join(" ").replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/\b([A-Z]{2,}[A-Z']*)\b/g, (w, _m, i, all) => {
          if (w === "TV") return w;
          const start = i === 0 || /[!?]\s+$|[^.]\.\s+$/.test(all.slice(0, i)), low = w.toLowerCase();
          return `<em>${start ? w[0] + low.slice(1) : low}</em>`;
        });
      b.addEventListener("click", () => {
        if (playing === b) { host.stop(); return; }
        if (playing) playing.setAttribute("aria-pressed", "false");
        playing = b; b.setAttribute("aria-pressed", "true");
        host.say(id).finally(() => { if (playing === b) { b.setAttribute("aria-pressed", "false"); playing = null; } });
      });
      list.appendChild(b);
    }
  }
</script>
</body>
</html>
