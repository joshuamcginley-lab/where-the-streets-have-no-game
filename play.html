<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0c0f">
<title>Where the Streets Have No Game · Controller</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Big+Shoulders+Stencil+Display:wght@800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Tinos:wght@400;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  /* Phone controller: one column, thumb-sized targets, the TV does the talking.
     A red LED band across the top echoes the TV's header. */
  body {
    font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent;
    padding-block: max(14px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header.cover { height: 64px; font-size: 9px; margin: calc(-1 * max(14px, env(safe-area-inset-top, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 16px calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-top: env(safe-area-inset-top, 0px); }
  header.cover .title { font-size: 17px; }
  .app { max-width: 480px; margin: 0 auto; display: grid; grid-template-rows: auto 1fr; gap: 18px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); padding-bottom: 14px; position: relative; }
  .top b { color: var(--red); font-family: var(--font-stencil); font-weight: 900; font-size: 22px; letter-spacing: .06em; }
  .me { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .me span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .screen { display: grid; gap: 16px; align-content: start; }

  h1 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 44px; line-height: .9; margin: 0; text-wrap: balance; }
  h2 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 34px; line-height: .95; margin: 0; text-wrap: balance; }
  /* the final wager's category, in the album-cover style */
  h2.cat { font-family: var(--font-serif); font-weight: 400; font-size: 26px; line-height: 1.15; color: #fff; padding: 12px 16px; border-radius: 3px;
    background: repeating-linear-gradient(-58deg, #000 0 16px, var(--red) 16px 29px); text-shadow: 0 0 10px rgba(0,0,0,.6); }
  p { margin: 0; }
  /* the wager screen must fit a small phone without scrolling */
  .wagerv { display: grid; gap: 12px; }
  .wagerv .hero { gap: 8px; padding-block: 0; }
  .wagerv h2.cat { font-size: 21px; padding: 8px 12px; }
  .wagerv .pad { gap: 8px; }
  .wagerv .key { min-height: 56px; padding: 10px 14px; }
  .wagerv .key .ch { font-size: 26px; }
  .wagerv p { font-size: 14px; }
  .muted { color: var(--muted); }
  .label { font: 600 12px var(--font-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

  form { display: grid; gap: 14px; }
  label { display: grid; gap: 6px; }
  input {
    font: 500 18px var(--font-body); color: var(--fg); background: var(--screen);
    border: 1px solid var(--line); border-radius: 10px; padding: 14px; width: 100%;
  }
  input:focus { outline: 2px solid var(--signal); outline-offset: 1px; }
  #room { font-family: var(--font-stencil); font-weight: 900; font-size: 40px; letter-spacing: .3em; text-transform: uppercase; padding: 6px 14px; color: var(--red); }
  .btn { font-size: 18px; padding: 16px 24px; width: 100%; }
  .err { color: var(--bad); }

  .av { --mc: var(--muted); display: inline-grid; place-items: center; aspect-ratio: 1; width: 40px; border-radius: 50%; background: var(--mc); color: var(--ink-on-ch); overflow: hidden; flex: none; }
  .av svg { width: 64%; height: 64%; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .top .av { width: 30px; }

  .chars { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .char {
    --mc: var(--muted);
    background: var(--screen); border: 2px solid var(--line); border-radius: 12px; cursor: pointer;
    padding: 14px 10px; display: grid; justify-items: center; gap: 6px; text-align: center;
  }
  .char .av { width: 60px; }
  .char b { font-family: var(--font-display); font-size: 22px; text-transform: uppercase; line-height: 1; }
  .char small { font: 500 11px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .char[aria-pressed="true"] .av { animation: pop .45s cubic-bezier(.2,.9,.3,1.4); }
  .char[aria-pressed="true"] { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 14%, var(--screen)); }
  .char:disabled { opacity: .3; cursor: default; }

  .hero { display: grid; justify-items: center; text-align: center; gap: 12px; padding-block: 10px; }
  .hero .av { width: 120px; }

  .vipbox { --fw: 5px; --sw: 6px; border: var(--fw) solid transparent; background: linear-gradient(var(--bg), var(--bg)) padding-box, var(--stripes) border-box; padding: 12px; display: grid; gap: 12px; }
  .vipbox .label { color: var(--fg); }
  .seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .seg button { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px; cursor: pointer; font-weight: 600; font-size: 14px; line-height: 1.2; }
  .seg button[aria-pressed="true"] { border-color: var(--red); background: color-mix(in srgb, var(--red) 18%, transparent); }

  .qhead { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .meter { height: 12px; background: var(--line); overflow: hidden; transform: skewX(-20deg); }
  .meter i { --sw: 5px; display: block; height: 100%; width: 100%; background: var(--stripes); transform-origin: left; }
  .meter.low i { animation: stripe-run .35s linear infinite; }
  .pad { display: grid; gap: 10px; }
  .key {
    --c: var(--ch1);
    background: var(--screen); border: 2px solid var(--line); border-radius: 14px; cursor: pointer;
    display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; text-align: left;
    padding: 16px; min-height: 76px; font-size: 18px; font-weight: 500; line-height: 1.25;
    transition: opacity .2s, border-color .2s, background .2s, transform .08s;
  }
  .key.ch2 { --c: var(--ch2); }
  .key.ch3 { --c: var(--ch3); }
  .key.ch4 { --c: var(--ch4); }
  .key .ch { font-size: 32px; }
  .enter .key { animation: rise .4s cubic-bezier(.2,.9,.3,1.1) both; }
  .enter .key.ch2 { animation-delay: .06s; }
  .enter .key.ch3 { animation-delay: .12s; }
  .enter .key.ch4 { animation-delay: .18s; }
  .key:active:not(:disabled) { transform: scale(.98); }
  .key.picked { border-color: var(--fg); background: color-mix(in srgb, var(--fg) 12%, var(--screen)); }
  .key.picked.thump { animation: thump .35s ease-out; }
  .key.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 16%, var(--screen)); }
  .key.off { opacity: .3; }
  .pad.order .key.off { opacity: .75; }
  .key .yr { font: 500 14px var(--font-mono); letter-spacing: .06em; color: var(--good); margin-left: 6px; }
  .key .ch:empty::before { content: "·"; opacity: .4; }
  .key:disabled { cursor: default; }

  .qfin { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 26px; line-height: 1; color: var(--good); margin: 0; }
  .enter .qfin { animation: slam .5s cubic-bezier(.2,.9,.3,1.1) both; }
  .verdict { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 64px; line-height: .9; animation: slam .5s cubic-bezier(.2,.9,.3,1.1) both; }
  .verdict.ok { color: var(--good); }
  .verdict.no { color: var(--bad); }
  .big { font-family: var(--font-stencil); font-weight: 900; font-size: 64px; line-height: 1; color: var(--fg); animation: pop .5s .15s cubic-bezier(.2,.9,.3,1.4) both; }
  .stats { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; font: 500 13px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .stats b { color: var(--fg); }
  .hero .av { animation: pop .5s cubic-bezier(.2,.9,.3,1.4) both; }
  .calm .hero .av, .calm .char .av { animation: none; }
  h1 em { font-style: normal; font-family: var(--font-stencil); color: var(--ink-on-signal); background: var(--red); padding: 0 .14em; display: inline-block; transform: skewX(-10deg); }
  /* one column exactly the screen's width, so a word can never widen the grid and push itself off-centre */
  .countin { position: fixed; inset: 0; z-index: 3; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; --sw: 22px; --stripe-speed: .45s; background: var(--stripes); animation: stripe-run var(--stripe-speed) linear infinite; }
  .countin .w { grid-area: 1 / 1; font-family: var(--font-stencil); font-weight: 900; font-size: min(96px, 22vw); line-height: .9; background: var(--bg); padding: 4px 18px 0; white-space: nowrap; max-width: 94vw; justify-self: center; opacity: 0; animation: word .62s cubic-bezier(.2,.9,.3,1.1) both; }
  .countin .w:last-child { background: var(--fg); color: var(--red); font-size: min(64px, 15vw); opacity: 1; animation: pop .5s cubic-bezier(.2,.9,.3,1.4) both; }
  .countin.hold { animation-play-state: paused; }
  .row { display: grid; gap: 10px; }
  /* Small phones (iPhone SE and the like): a slimmer header and keys, so all four answers fit without scrolling */
  @media (orientation: portrait) and (max-height: 640px) {
    header.cover { height: 44px; margin-bottom: 10px; }
    header.cover .title { font-size: 14px; }
    .app { gap: 10px; } .top { padding-bottom: 8px; } .screen { gap: 10px; }
    .pad { gap: 8px; }
    .key { min-height: 56px; padding: 9px 14px; font-size: 16px; }
    .key .ch { font-size: 26px; }
    .qfin { font-size: 20px; }
    .verdict { font-size: 50px; } .big { font-size: 52px; }
  }
  /* A phone turned on its side: answers in two columns, everything a size down */
  @media (orientation: landscape) and (max-height: 500px) {
    header.cover { height: 34px; margin-bottom: 8px; }
    header.cover .title { font-size: 13px; }
    .app { max-width: 860px; gap: 8px; } .top { padding-bottom: 4px; } .screen { gap: 8px; }
    .pad { grid-template-columns: 1fr 1fr; gap: 8px; }
    .key { min-height: 50px; padding: 7px 12px; font-size: 15px; gap: 10px; }
    .key .ch { font-size: 22px; }
    .qfin { font-size: 18px; }
    .hero { gap: 6px; padding-block: 0; }
    .verdict { font-size: 36px; } .big { font-size: 40px; } h1 { font-size: 30px; } h2 { font-size: 24px; }
    .wagerv h2.cat { font-size: 18px; padding: 6px 10px; }
  }
</style>
</head>
<body>
<div class="ver" aria-hidden="true">v84 · Oct 17</div>
<header class="cover"><span class="title">Everything You Know Is Wrong</span></header>
<div class="app">
  <div class="top mono" id="top"></div>
  <main class="screen" id="screen"></main>
</div>

<script src="vendor/peerjs.min.js"></script>
<script src="questions.js"></script>
<script src="members.js"></script>
<script src="net.js"></script>
<script>
(() => {
  const { MODES } = U2;
  const { MEMBERS, byId, avatar, loadPhotos } = U2M;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = (k, v) => { try { v === undefined ? null : localStorage.setItem(k, v); return localStorage.getItem(k); } catch { return null; } };
  const ordinal = n => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");

  // pid lives in sessionStorage so a reload in the same tab gets your seat back. On a real
  // phone it's also kept in localStorage, so reopening the link (a new tab) gets it back too;
  // in local test mode each tab stays its own player.
  let pid;
  try {
    pid = sessionStorage.getItem("wtshng-pid") || (!Net.LOCAL && localStorage.getItem("wtshng-pid")) || Math.random().toString(36).slice(2, 12);
    sessionStorage.setItem("wtshng-pid", pid);
    if (!Net.LOCAL) localStorage.setItem("wtshng-pid", pid);
  } catch { pid = Math.random().toString(36).slice(2, 12); }

  const params = new URLSearchParams(location.search);
  const C = {
    seq: [],   // a put-them-in-order answer in progress
    status: "form",            // form | connecting | live | lost | error
    code: (params.get("room") || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4),
    name: store("wtshng-name") || "",
    error: "", v: null, deadline: 0, revealDeadline: 0,
    conn: null, handle: null, lastPong: 0, retries: 0, everJoined: false,
  };

  // ---------- connection
  let retryTimer = 0;
  function connect() {
    clearTimeout(retryTimer);
    // Forget the old connection before closing it, so its close isn't taken for a new loss
    const h = C.handle; C.handle = null; C.conn = null;
    if (h) h.close();
    C.status = C.everJoined ? "lost" : "connecting";
    render();
    C.handle = Net.join(C.code, {
      onOpen(conn) {
        C.conn = conn; C.lastPong = Date.now(); C.retries = 0;
        conn.on("data", onMsg);
        conn.on("close", () => { if (C.conn === conn) lost(); });
        conn.send({ t: "join", pid, name: C.name });
      },
      onError(type) {
        // Coming back to a room we were in: the TV may just be reconnecting itself, so keep trying for a while
        if (type === "no-room" && C.everJoined && C.retries < 20) retry();   // about a minute and a half
        else if (type === "no-room") {
          C.status = "error";
          C.error = C.everJoined ? `Room ${C.code} has closed. If the TV started a new room, enter its code.` : `There's no room called ${C.code}. Check the code on the TV.`;
          C.everJoined = false; render();
        } else if (C.everJoined) retry();
        else { C.status = "error"; C.error = "Couldn't reach the TV. Check the room code and try again."; C.handle?.close(); C.handle = null; render(); }
      },
    });
  }
  function lost() { C.conn = null; if (C.status === "live" || C.status === "lost") retry(); }
  function retry() {
    C.status = "lost"; render();
    C.retries++;
    clearTimeout(retryTimer);
    retryTimer = setTimeout(connect, Math.min(8000, 1000 * C.retries));
  }
  function send(m) { if (C.conn) C.conn.send(m); }

  setInterval(() => {
    if (!C.conn) return;
    send({ t: "ping" });
    if (Date.now() - C.lastPong > 10000) { const c = C.conn; C.conn = null; C.handle?.close(); lost(); }
  }, 3000);
  document.addEventListener("visibilitychange", () => {
    // Phones often drop the connection when the screen locks. Come straight back.
    if (document.visibilityState === "visible" && C.everJoined && !C.conn && C.status !== "error") { C.retries = 0; connect(); }
    if (document.visibilityState === "visible" && C.status === "live") { lock = null; wake(); }   // the lock is dropped while hidden
  });

  function onMsg(m) {
    C.lastPong = Date.now();
    if (m.t === "pong") return;
    if (m.t === "reject") { C.status = "error"; C.error = m.reason; C.handle?.close(); C.conn = null; return render(); }
    if (m.t !== "state") return;
    const prev = C.v;
    C.v = m; C.status = "live"; C.everJoined = true;
    if (m.q) C.deadline = Date.now() + m.q.left;
    if (m.phase !== "question" || prev?.phase !== "question" || prev.q.n !== m.q.n) C.seq = [];   // a sort in progress belongs to one question
    if (m.wager) C.wagerDeadline = Date.now() + m.wager.left;
    if (m.rv) C.revealDeadline = Date.now() + m.rv.left;
    wake();   // in every phase: a phone that locks in the lobby loses its seat
    if (m.rv && prev?.phase !== "reveal") buzz(m.rv.ok ? buzzFor("right", [40, 60, 40]) : [160]);
    render();
  }

  let lock = null;
  function wake() { if (!lock && navigator.wakeLock) navigator.wakeLock.request("screen").then(l => { lock = l; l.addEventListener("release", () => lock = null); }).catch(() => {}); }
  function buzz(p) { try { navigator.vibrate?.(p); } catch {} }
  // Each character's own buzz when they lock in and when they get one right
  const BUZZ = {
    bono:       { lock: [20, 40, 70], right: [45, 45, 90, 160, 45, 45, 90] },                       // "hello, hello"
    edge:       { lock: [50, 110, 32, 110, 18, 110, 10], right: [80, 110, 50, 110, 30, 110, 16] },   // a fading echo
    adam:       { lock: [90], right: [90, 90, 45, 70, 25] },                                         // a bass thump; the hat bouncing
    larry:      { lock: [16, 22, 16, 22, 16, 22, 16, 22, 60], right: [16, 22, 16, 22, 16, 22, 16, 22, 16, 22, 50, 60, 90] },   // drum roll
  };
  const buzzFor = (kind, fallback) => BUZZ[C.v?.me?.member]?.[kind] || fallback;

  // ---------- views
  function render() {
    const v = C.v, m = v?.me?.member && byId(v.me.member);
    $("top").innerHTML = C.status === "live" && v
      ? `<span class="me">${m ? avatar(m.id) : ""}<span>${esc(v.me.name || m?.name || "You")}</span></span><span>ROOM <b>${v.code}</b></span>`
      : `<span>U2 TRIVIA</span><span>${C.code ? `ROOM <b>${esc(C.code)}</b>` : ""}</span>`;
    const s = $("screen");
    const focusId = document.activeElement?.id;
    // Screens with entrance animations are only rebuilt when they change, so another
    // player's update doesn't replay them.
    const key = C.status !== "live" ? C.status : v.phase === "question" ? `question:${v.q.n}:${v.my}` : v.phase === "reveal" ? `reveal:${v.q.n}:${v.vip}`
      : v.phase === "final" ? `final:${v.fin.round}:${v.vip ? v.mode : ""}:${v.vip}` : v.phase === "host" ? `host:${v.host.key}:${v.vip}`
      : v.phase === "wager" ? `wager:${v.wager.mine}` : v.phase === "awards" ? `awards:${v.aw.i}:${v.vip}` : v.phase;
    const fresh = key !== C.shownKey;
    C.shownKey = key;
    if (fresh) C.shownAt = Date.now();
    if (!fresh && (key.startsWith("question") || key.startsWith("reveal") || key.startsWith("final") || key.startsWith("host") || key.startsWith("wager") || key.startsWith("awards") || key === "countin")) return;
    s.classList.toggle("enter", fresh);
    s.classList.remove("calm");
    if (C.status === "form" || C.status === "error") s.innerHTML = formView();
    else if (C.status === "connecting") s.innerHTML = msgView("Connecting", `Finding room ${esc(C.code)}…`);
    else if (C.status === "lost") s.innerHTML = msgView("Reconnecting", "Lost the TV for a moment. Hang on, your seat is saved.");
    else if (v.phase === "lobby") s.innerHTML = lobbyView(v);
    else if (v.phase === "host") s.innerHTML = hostView(v);
    else if (v.phase === "wager") s.innerHTML = wagerView(v);
    else if (v.phase === "awards") s.innerHTML = awardsView(v);
    else if (v.phase === "countin") s.innerHTML = countinView(v);
    else if (v.phase === "question") s.innerHTML = questionView(v);
    else if (v.phase === "reveal") s.innerHTML = revealView(v);
    else if (v.phase === "final") s.innerHTML = finalView(v);
    if (focusId && $(focusId) && $(focusId).tagName === "INPUT") $(focusId).focus();
  }

  function formView() {
    return `<h1>Where the Streets Have No <em>Game</em></h1>
      <p class="muted">Enter the room code shown on the TV.</p>
      <form id="join-form" autocomplete="off">
        <label><span class="label">ROOM CODE</span><input id="room" name="room" maxlength="4" inputmode="text" autocapitalize="characters" spellcheck="false" value="${esc(C.code)}" required></label>
        <label><span class="label">YOUR NAME</span><input id="name" name="name" maxlength="14" placeholder="Optional" value="${esc(C.name)}"></label>
        ${C.status === "error" ? `<p class="err">${esc(C.error)}</p>` : ""}
        <button class="btn" type="submit">Join the game</button>
      </form>`;
  }

  function msgView(title, text) { return `<div class="hero"><h2>${title}</h2><p class="muted">${text}</p></div>`; }

  function lobbyView(v) {
    const mine = v.me.member;
    const justPicked = mine && mine !== C.lastMine;
    C.lastMine = mine;
    $("screen").classList.toggle("calm", !justPicked);
    const chars = MEMBERS.map(m => {
      const taken = v.taken[m.id];
      return `<button type="button" class="char" id="char-${m.id}" data-member="${m.id}" style="--mc:${m.color}" aria-pressed="${mine === m.id}" ${taken ? "disabled" : ""}>
        ${avatar(m.id)}<b>${m.name}</b><small>${taken ? "TAKEN" : m.role.toUpperCase()}</small></button>`;
    }).join("");
    const head = mine
      ? `<div class="hero" style="padding-block:0">${avatar(mine)}<h2>You're ${byId(mine).name}</h2><p class="muted">Watch the TV. Tap another character to switch.</p></div>`
      : `<h2>Pick your character</h2><p class="muted">Each character can only be taken once.</p>`;
    const vip = v.vip ? `<div class="vipbox">
        <span class="label">YOU'RE THE VIP · YOU RUN THE SHOW</span>
        <div class="seg">${MODES.map(m => `<button type="button" id="mode-${m.id}" data-mode="${m.id}" aria-pressed="${v.mode === m.id}">${m.name}</button>`).join("")}</div>
        <button type="button" class="btn" id="btn-start" ${v.canStart ? "" : "disabled"}>Start the show</button>
        ${v.waiting ? `<p class="muted">Waiting for ${v.waiting} player${v.waiting > 1 ? "s" : ""} to pick a character.</p>` : ""}
      </div>` : mine ? `<p class="muted" style="text-align:center">Mode: <b>${MODES.find(m => m.id === v.mode).name}</b>. The VIP starts the game.</p>` : "";
    return `${head}${mine ? vip : ""}<div class="chars">${chars}</div>${mine ? "" : vip}`;
  }

  // MacPhisto has the floor on the TV; the VIP can cut him short
  function hostView(v) {
    return `<div class="hero"><div class="label">${esc(v.host.label.toUpperCase())}</div><h2>MacPhisto has the floor</h2>
        <p class="muted">Eyes on the TV.</p></div>
      ${v.vip ? `<button type="button" class="btn ghost" id="btn-skip">Skip him</button>` : ""}`;
  }

  // The awards at the end of the night: what's being given now, and what this player has won
  function awardsView(v) {
    const a = v.aw.cur;
    return `<div class="hero"><div class="label">THE AWARDS${a ? ` · ${v.aw.i + 1} OF ${v.aw.total}` : ""}</div>
        ${a ? `<h2>${esc(a.title)}</h2><div class="verdict ${a.mine ? "ok" : ""}" style="font-size:40px">${a.mine ? "That's you!" : esc(a.name)}</div>
          <p class="muted">${esc(a.stat)}</p>` : `<h2>MacPhisto has the envelopes</h2><p class="muted">Eyes on the TV.</p>`}
        ${v.aw.mine.length ? `<div class="label" style="margin-top:8px">YOUR AWARDS TONIGHT</div>${v.aw.mine.map(t => `<p><b>${esc(t)}</b></p>`).join("")}` : ""}</div>
      ${v.vip ? `<button type="button" class="btn ghost" id="btn-skip">Next award</button>` : ""}`;
  }

  // The final wager: bet part of your score on the last question
  function wagerView(v) {
    const w = v.wager;
    const cat = `<div class="label">FINAL WAGER · THE CATEGORY</div><h2 class="cat">${esc(w.category)}</h2>`;
    if (w.mine !== null) return `<div class="hero">${cat}<p class="muted" style="margin:0">Bet placed</p>
        <div class="big">${w.mine}</div><p class="muted">Right and you win it. Wrong and you lose it. Eyes on the TV.</p></div>`;
    const names = ["Nothing", "A little", "Half", "Everything"];
    const keys = w.tiers.map((a, k) =>
      `<button type="button" class="key ch${k + 1}" data-wager="${k}"><span class="ch">${k + 1}</span><span>${names[k]}${k ? ` · ${a}` : ""}</span></button>`).join("");
    return `<div class="wagerv"><div class="hero">${cat}
        <p class="muted">You have <b>${w.score}</b> points. Bet on this category: right wins your bet, wrong loses it.${w.score < 200 ? " Under 200? You can still bet 200, and you can't drop below zero." : ""}</p></div>
      <div class="meter"><i id="wbar"></i></div>
      <div class="pad">${keys}</div></div>`;
  }

  function countinView(v) {
    // Same timing as the TV: quick UNOS-DOS-TRES, a beat, then CATORCE holds.
    const at = v.countAt || [0, .5, 1, 1.85], total = v.countMs || 4400, elapsed = (total - (v.countLeft ?? total)) / 1000;
    setTimeout(() => document.querySelector(".countin")?.classList.add("hold"), Math.max(0, at[3] - elapsed) * 1000);
    return `<div class="countin" aria-label="Unos, dos, tres, catorce">${["UNOS", "DOS", "TRES", "¡CATORCE!"].map((w, i) =>
      `<span class="w" style="animation-delay:${(at[i] - elapsed).toFixed(2)}s">${w}</span>`).join("")}</div>`;
  }

  // Put-them-in-order: tap the cards first to last. The phone keeps the picks until the last one goes in
  // (the fourth fills itself in), then sends them all. The cards update in place, so quick taps all count.
  function orderView(v) {
    const done = v.my !== null, seq = done ? v.my : C.seq;
    // Once it's in, the cards stand in the order this player chose
    const keys = (done ? seq : v.q.opts.map((_, k) => k)).map(k => {
      const pos = seq.indexOf(k);
      return `<button type="button" class="key ch${k + 1} ${pos >= 0 ? "picked" : ""} ${done ? "off" : ""}" data-o="${k}" ${done ? "disabled" : ""}><span class="ch">${pos >= 0 ? pos + 1 : ""}</span><span>${esc(v.q.opts[k])}</span></button>`;
    }).join("");
    return `<div class="qhead mono"><span>Q ${v.q.n}/${v.q.total}</span><span id="secs"></span></div>
      <div class="meter"><i id="bar"></i></div>
      <p class="muted">${done ? "Locked in. Waiting for the others." : "Tap them in order, earliest first."}</p>
      <div class="pad order">${keys}</div>
      ${done ? "" : `<button type="button" class="btn ghost" id="btn-undo" ${C.seq.length ? "" : "hidden"}>Undo</button>`}`;
  }
  function updateOrder() {
    document.querySelectorAll("[data-o]").forEach(b => {
      const pos = C.seq.indexOf(Number(b.dataset.o));
      b.classList.toggle("picked", pos >= 0);
      b.querySelector(".ch").textContent = pos >= 0 ? pos + 1 : "";
    });
    if ($("btn-undo")) $("btn-undo").hidden = !C.seq.length;
  }

  function questionView(v) {
    if (v.q.order) return orderView(v);
    const picked = v.my;
    const keys = v.q.opts.map((o, k) =>
      `<button type="button" class="key ch${k + 1} ${picked === k ? "picked thump" : picked !== null ? "off" : ""}" data-k="${k}" ${picked !== null ? "disabled" : ""}><span class="ch">${k + 1}</span><span>${esc(o)}</span></button>`).join("");
    return `<div class="qhead mono"><span>Q ${v.q.n}/${v.q.total}</span><span id="secs"></span></div>
      <div class="meter"><i id="bar"></i></div>
      ${v.q.finale ? `<p class="qfin">${v.q.finale === "wager" ? `Final wager: ${v.q.wager || 0} on the line` : "Double points!"}</p>` : ""}
      <p class="muted">${picked !== null ? "Locked in. Waiting for the others." : v.q.song ? "Listen to the TV. Which song is it?" : v.q.cover ? "Look at the TV. Which album is it? The sooner you know, the more it's worth." : "The question is on the TV. Pick your answer."}</p>
      <div class="pad">${keys}</div>`;
  }

  // The right order, oldest first, with years: green where this player had it in the right place
  function orderReveal(v) {
    const r = v.rv, mine = v.my || [];
    const rows = r.right.map((k, pos) =>
      `<button type="button" class="key ch${k + 1} ${mine[pos] === k ? "right" : ""}" disabled><span class="ch">${pos + 1}</span><span>${esc(v.q.opts[k])} <span class="yr">${r.years[k]}</span></span></button>`).join("");
    const head = r.ok ? `<div class="verdict ok">Correct</div><div class="big">+${r.gain}</div>`
      : r.gain > 0 ? `<div class="verdict ok">Close</div><div class="big">+${r.gain}</div><p class="muted">${r.placed} of 4 in the right place</p>`
      : `<div class="verdict no">${v.my === null ? "Too slow" : "Not quite"}</div>`;
    return `<div class="hero">${head}
        <div class="stats"><span>Score <b>${v.me.score}</b></span><span>Place <b>${ordinal(r.place)}</b> of ${r.of}</span>${r.streak > 1 ? `<span>Streak <b>${r.streak}</b></span>` : ""}</div></div>
      ${v.vip ? `<button type="button" class="btn" id="btn-next">${v.q.n < v.q.total ? "Next question" : "Final scores"}</button>` : ""}
      <div class="pad">${rows}</div>`;
  }

  function revealView(v) {
    if (v.q.order) return orderReveal(v);
    const r = v.rv;
    const keys = v.q.opts.map((o, k) =>
      `<button type="button" class="key ch${k + 1} ${k === r.right ? "right" : v.my === k ? "picked" : "off"}" disabled><span class="ch">${k + 1}</span><span>${esc(o)}</span></button>`).join("");
    const head = r.ok ? `<div class="verdict ok">Correct</div>${r.gain ? `<div class="big">+${r.gain}</div>` : ""}`
      : `<div class="verdict no">${v.my === null ? "Too slow" : "Not quite"}</div>${r.gain < 0 ? `<div class="big">−${-r.gain}</div>` : ""}`;
    return `<div class="hero">${head}
        <div class="stats"><span>Score <b>${v.me.score}</b></span><span>Place <b>${ordinal(r.place)}</b> of ${r.of}</span>${r.streak > 1 ? `<span>Streak <b>${r.streak}</b></span>` : ""}</div></div>
      ${v.vip ? `<button type="button" class="btn" id="btn-next">${v.q.n < v.q.total ? "Next question" : "Final scores"}</button>` : ""}
      <div class="pad">${keys}</div>`;
  }

  function finalView(v) {
    const f = v.fin, top = f.place === 1 && !f.tie && f.of > 1;
    const signed = n => (n < 0 ? "−" + -n : "+" + n);
    return `<div class="hero">${avatar(v.me.member)}
        <div class="label">${f.tour ? (f.tour.next ? `TOURNAMENT · AFTER ROUND ${f.tour.leg} OF 3` : top ? "TOURNAMENT CHAMPION" : f.place === 1 && f.tie ? "TOURNAMENT · TIE AT THE TOP" : "TOURNAMENT · FINAL STANDINGS")
          : `${f.round > 1 ? `AFTER ROUND ${f.round} · ` : ""}${top ? "TONIGHT'S HEADLINER" : f.place === 1 && f.tie ? "TIE AT THE TOP" : "STANDINGS"}`}</div>
        <div class="verdict ${f.place === 1 ? "ok" : ""}">${ordinal(f.place)} place</div>
        <div class="big">${f.score}</div>
        <div class="stats"><span>This round <b>${signed(f.gained)}</b></span><span>Right <b>${f.correct}/${f.total}</b></span></div></div>
      ${v.vip && f.tour?.next ? `<div class="vipbox"><span class="label">TOURNAMENT · NEXT UP: ${esc(f.tour.next.toUpperCase())}</span>
          <button type="button" class="btn" id="btn-again">Start round ${f.tour.leg + 1} of 3</button>
          <button type="button" class="btn ghost" id="btn-lobby">Awards &amp; new game</button></div>`
        : v.vip ? `<div class="vipbox"><span class="label">NEXT ROUND</span>
          <div class="seg">${MODES.map(m => `<button type="button" id="mode-${m.id}" data-mode="${m.id}" aria-pressed="${v.mode === m.id}">${m.name}</button>`).join("")}</div>
          <button type="button" class="btn" id="btn-again">${v.mode === "tournament" ? "New tournament" : `Start round ${f.round + 1}`}</button>
          <button type="button" class="btn ghost" id="btn-lobby">Awards &amp; new game</button></div>`
        : `<p class="muted" style="text-align:center">${f.tour?.next ? `Next up: ${esc(f.tour.next)}. The VIP starts it.` : "The VIP picks the next round."}</p>`}`;
  }

  // ---------- timers
  function frame() {
    if (C.v?.phase === "question" && $("bar")) {
      const full = (C.v.q.secs || 20) * 1000, left = Math.max(0, Math.min(full, C.deadline - Date.now()));   // full while MacPhisto reads
      $("bar").style.transform = `scaleX(${left / full})`;
      $("bar").parentElement.classList.toggle("low", left < 5000);
      $("secs").textContent = Math.ceil(left / 1000) + "s";
    }
    if (C.v?.phase === "wager" && $("wbar")) $("wbar").style.transform = `scaleX(${Math.max(0, C.wagerDeadline - Date.now()) / C.v.wager.ms})`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- input
  $("screen").addEventListener("submit", e => {
    e.preventDefault();
    C.code = $("room").value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
    C.name = $("name").value.replace(/\s+/g, " ").trim().slice(0, 14);
    store("wtshng-name", C.name);
    if (C.code.length !== 4) { C.status = "error"; C.error = "Room codes are four letters."; return render(); }
    C.retries = 0; C.everJoined = false;
    connect();
  });
  $("screen").addEventListener("input", e => {
    if (e.target.id === "room") e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, "");
  });
  $("screen").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    // A double tap mustn't land on whatever appeared under the finger: drop a tap that comes hard on
    // the heels of the last one if the screen changed in between. A first tap always counts.
    const now = Date.now(), quick = now - (C.lastTapAt || 0) < 450 && (C.shownAt || 0) > (C.lastTapAt || 0);
    C.lastTapAt = now;
    if (quick && (b.dataset.k !== undefined || b.dataset.o !== undefined || b.dataset.wager !== undefined || b.id === "btn-skip")) return;
    if (b.dataset.o !== undefined && C.v?.phase === "question" && C.v.my === null) {
      const k = Number(b.dataset.o);
      if (C.seq.includes(k)) return;
      C.seq.push(k); buzz(12);
      if (C.seq.length === 3) C.seq.push([0, 1, 2, 3].find(x => !C.seq.includes(x)));
      if (C.seq.length < 4) return updateOrder();
      C.v.my = C.seq.slice(); render(); buzz(buzzFor("lock", 25));   // show it right away; the TV confirms
      return send({ t: "order", seq: C.v.my });
    }
    if (b.id === "btn-undo") { C.seq.pop(); return updateOrder(); }
    if (b.dataset.member) { send({ t: "pick", member: b.dataset.member }); buzz(15); }
    else if (b.dataset.mode) send({ t: "mode", mode: b.dataset.mode });
    else if (b.dataset.k !== undefined && C.v?.phase === "question" && C.v.my === null) {
      const k = Number(b.dataset.k);
      C.v.my = k; render(); buzz(buzzFor("lock", 25));   // show it right away; the TV confirms
      send({ t: "answer", k });
    }
    else if (b.id === "btn-start") send({ t: "start" });
    else if (b.id === "btn-next") send({ t: "next" });
    else if (b.id === "btn-skip") send({ t: "skip" });
    else if (b.dataset.wager !== undefined && C.v?.phase === "wager" && C.v.wager.mine === null) {
      const k = Number(b.dataset.wager);
      C.v.wager.mine = C.v.wager.tiers[k]; render(); buzz(buzzFor("lock", 25));   // show it right away; the TV confirms
      send({ t: "wager", k });
    }
    else if (b.id === "btn-again") send({ t: "again" });
    else if (b.id === "btn-lobby") send({ t: "lobby" });
  });

  loadPhotos(() => render());
  // Arriving from the QR code with a name saved from last time: go straight in.
  if (C.code.length === 4 && params.get("room") && C.name) connect(); else render();
})();
</script>
</body>
</html>
