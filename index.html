    if (S.phase !== "question" || c.answer || couchSeq.includes(k)) return;
    couchSeq.push(k);
    if (couchSeq.length === 3) couchSeq.push([0, 1, 2, 3].find(x => !couchSeq.includes(x)));
    if (couchSeq.length === 4) submitOrder(c, couchSeq); else render();
  }

  function maybeAllAnswered() {
    if (S.phase === "wager") {
      const live = active();
      if (live.length && live.every(p => p.wager !== null)) { clearTimeout(qTimer); qTimer = setTimeout(endWager, 900); }
      return;
    }
    if (S.phase !== "question") return;
    const live = active();
    if (live.length && live.every(p => p.answer)) { clearTimeout(qTimer); qTimer = setTimeout(reveal, 700); }
  }

  // The current leader: the one player strictly ahead (with points), or null
  function leader() {
    const o = S.players.slice().sort((a, b) => b.score - a.score);
    return o.length && o[0].score > 0 && (o.length === 1 || o[0].score > o[1].score) ? o[0] : null;
  }

  // What MacPhisto says about this reveal, if anything. Four in a row always gets a line;
  // anything else only if he didn't speak on the last reveal, at most four a round, and
  // never the same line twice in a round.
  function revealLine(was) {
    const ps = S.players, multi = ps.length > 1, n = S.deck.length;
    if (S.i === n - 1) {   // the last reveal leads straight to the final scores and the winner line, unless someone bet everything
      const allIn = ps.filter(p => p.allIn);
      return allIn.some(p => !p.ok) ? Host.pick(LINES.betLost) : allIn.length ? Host.pick(LINES.betWon) : null;
    }
    const four = ps.find(p => p.ok && p.streak === 4);
    if (four) return Host.pick(LINES.streak(four.member));
    if (S.lastHostAt === S.i - 1 || S.revealLines >= 4) return null;
    const fresh = ids => ids.filter(id => !S.roundLines.has(id));
    const pick = (p, ids, tonight) => (Math.random() < p && fresh(ids).length ? Host.pick(fresh(ids), tonight) : null);
    const lead = leader(), by = ps.slice().sort((a, b) => b.score - a.score);
    if (multi && was.leader && lead && lead !== was.leader) return pick(1, LINES.lead);
    if (ps.some(p => !p.ok && (was.streak.get(p.pid) || 0) >= 3)) return pick(1, LINES.broken);
    if (multi && ps.every(p => p.ok)) return pick(.6, LINES.allRight);
    if (!ps.some(p => p.answer)) return pick(.8, LINES.hurry);
    const answered = ps.filter(p => p.answer);
    if (answered.length > 1 && !S.deck[S.i].order && !ps.some(p => p.ok) && answered.every(p => p.answer.k === answered[0].answer.k)) return pick(.8, LINES.sameWrong);
    if (!ps.some(p => p.ok)) return pick(.6, multi ? [...LINES.nobodyGroup, ...LINES.nobody] : LINES.nobody);
    if (multi && ps.filter(p => p.ok).length === 1) { const r = pick(ps.length > 2 ? .5 : .25, LINES.loneRight); if (r) return r; }
    if (ps.some(p => p.ok && S.endsAt - p.answer.at < 1500)) { const r = pick(.6, LINES.buzzer); if (r) return r; }
    if (multi && S.i >= 4 && by[0].score - by[1].score <= 75) return pick(.5, LINES.close);
    if (multi && S.i >= 5 && by[0].score - by[by.length - 1].score >= 450) return pick(.45, LINES.lastPlace);
    return pick(.15, LINES.aside, true);
  }

  // Enter while he's reading: stop him and start the clock now
  function skipReading() {
    if (S.phase !== "question" || Date.now() >= S.readingUntil) return;
    Host.stop();
    S.readingUntil = Date.now();
    S.endsAt = Date.now() + S.qSecs * 1000;
    clearTimeout(qTimer);
    qTimer = setTimeout(reveal, S.qSecs * 1000 + 200);
    sync();
  }

  function reveal() {
    if (S.phase !== "question") return;
    clearTimeout(qTimer);
    if (Host.speaking) Host.stop();   // everyone answered while he was still reading the question
    const q = S.deck[S.i], right = q.order ? -1 : q.opts.indexOf(q.a);
    const was = { leader: leader(), streak: new Map(S.players.map(p => [p.pid, p.streak])) };
    const fin = finaleNow();
    S.players.forEach(p => {
      p.allIn = fin === "wager" && p.wager > 0 && p.wager === wagerTiers(p)[3];   // before the score changes
      p.placed = q.order && p.answer ? p.answer.seq.filter((k, i) => k === q.right[i]).length : 0;
      p.ok = !!p.answer && (q.order ? p.placed === 4 : p.answer.k === right);
      if (p.ok) {
        p.streak++; p.correct++; p.best = Math.max(p.best, p.streak);
        const frac = Math.max(0, Math.min(1, (S.endsAt - p.answer.at) / (S.qSecs * 1000)));
        // A cover pays more for answering early, while it's still zoomed in
        p.gain = 100 + Math.round(frac * (q.cover ? COVER_BONUS : 100)) + Math.min(100, (p.streak - 1) * 25);
        if (fin === "double") p.gain *= 2;
        if (fin === "wager") p.gain = p.wager || 0;
      } else {
        p.streak = 0;
        p.gain = fin === "wager" ? -Math.min(p.wager || 0, p.score) : q.order && p.placed >= 2 ? 50 : 0;   // a lost bet, never below zero; half the order right gets something
      }
      p.score += p.gain;
    });
    // The night's stats, for the awards
    S.players.forEach(p => {
      const st = p.st || (p.st = blankStats());
      if (!p.answer) st.none++;
      else {
        st.answered++;
        const ms = p.answer.at - (S.qShownAt || p.answer.at);
        if (p.ok) { st.right++; st.rightMs += ms; if (S.endsAt - p.answer.at < 3000) st.lastSec++; }
        else if (!(q.order && p.placed >= 2)) { st.wrong++; if (ms < 5000 && !q.order) st.fastWrong++; }
      }
      if (q.song) { st.songs++; if (p.ok) st.songRight++; }
      st.bestRun = Math.max(st.bestRun, p.streak);
      if (S.players.length > 2 && (S.i >= 2 || S.round > 1)) st.worst = Math.max(st.worst, placeOf(p));
    });
    S.phase = "reveal";
    // MacPhisto comes in after the reveal sounds, and the reveal waits for him to finish.
    const line = Host.ready ? revealLine(was) : null, HOST_IN = 1300;
    S.hostLine = line;
    if (line) { S.revealLines++; S.lastHostAt = S.i; S.roundLines.add(line); }
    const ms = line ? Math.max(REVEAL_MS, HOST_IN + Host.dur(line) * 1000 + 1800) : REVEAL_MS;
    S.revealMs = ms;
    S.revealEndsAt = Date.now() + ms;
    // If his line started late (a slow mp3), give him the time to finish it.
    rTimer = setTimeout(function next() { if (Host.speaking && S.phase === "reveal") rTimer = setTimeout(next, 400); else nextQuestion(); }, ms);
    Sound.reveal();
    S.players.forEach(p => p.ok && Touches.right(p));
    // The song keeps going quietly under the reveal, unless MacPhisto is about to talk: then it fades out first
    if (line && q.song) { const g = S.game, i = S.i; Player.fade(0, 1000); setTimeout(() => { if (S.game === g && S.i === i) Player.stop(); }, 1150); }
    else Player.fade(.3);
    sync();
    if (line) { const at = `${S.game}:${S.i}`; setTimeout(() => { if (S.phase === "reveal" && `${S.game}:${S.i}` === at) Host.say(line, { duck: true }); }, HOST_IN); }
  }

  function nextQuestion() {
    if (S.phase !== "reveal") return;
    clearTimeout(rTimer);
    Host.stop();
    S.hostLine = null;
    S.i++;
    if (S.i < S.deck.length) {
      // A word from MacPhisto before the song, the album cover and the last question (each once a night)
      const q = S.deck[S.i], n = S.deck.length, of = `Question ${S.i + 1} of ${n}`;
      if (S.i === n - 1) {
        if (S.finale === "wager") hostBeat(LINES.wager, "Last question · Final wager", startWager);
        else hostBeat(S.inTour ? LINES.double : [...LINES.lastq, ...LINES.double], "Last question · Double points", beginQuestion, true);   // his "last question" lines would mislead mid-tournament
      }
      else if (q.order) hostBeat(LINES.order, `${of} · Put them in order`, beginQuestion, true);
      else if (q.c === "Who Said It?") hostBeat(LINES.whoSaid, `${of} · Who said it?`, beginQuestion, true);
      else if (q.song && !["songs", "deep-songs"].includes(roundMode())) hostBeat(LINES.song, `${of} · Name that song`, beginQuestion, true);
      else if (q.cover) hostBeat(LINES.cover, `${of} · Name the album`, beginQuestion, true);
      else beginQuestion();
    } else {
      S.phase = "final"; S.finalAt = Date.now(); Player.stop(); Sound.win();
      Hall.update();   // standings and records, saved now in case nobody presses anything
      sync();
      // MacPhisto crowns the winner once the fanfare's done (a tie gets "neck and neck")
      const o = S.players.slice().sort((a, b) => b.score - a.score), tie = o.length > 1 && o[0].score === o[1].score;
      // Mid-tournament nobody has won yet: he says what's next, and saves the crowning for the end
      const line = S.inTour && S.leg < 3 ? Host.pick(LINES.tourBreak(S.leg)) : Host.pick(tie ? LINES.tie : S.inTour ? LINES.tourWinner : LINES.winner), g = S.game;
      if (line) setTimeout(() => { if (S.phase === "final" && S.game === g) Host.say(line); }, 4800);   // after the winner's moment has landed
    }
  }

  // Mode can change in the lobby or between rounds; the results screen is rebuilt to show it.
  function setMode(id) {
    if (S.inTour && S.leg < 3 && S.phase === "final") return;   // the tournament's next round is fixed
    S.mode = id;
    if (S.phase === "final") builtKey = "";
    sync();
  }

  // ---------- the Hall of Fame: kept in this browser, saved at every round's final scores (so closing
  // the browser loses nothing). Champions, titles, the best streak and the highest score.
  const Hall = {
    key: "wtshng-hall",
    load() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch { return {}; } },
    save(h) { try { localStorage.setItem(this.key, JSON.stringify(h)); } catch {} },
    who: p => ({ name: shownName(p), member: p.member }),
    // This game's standings so far (each game keeps its best score and best streak), and any record
    // it has broken: beaten every earlier game on this TV
    update() {
      const h = this.load(), order = S.players.slice().sort((a, b) => b.score - a.score);
      if (!order.length || !S.gameId) return;
      const others = (h.games || []).filter(g => g.id !== S.gameId);
      const tie = order.length > 1 && order[0].score === order[1].score;
      const run = S.players.slice().sort((a, b) => (b.st?.bestRun || 0) - (a.st?.bestRun || 0))[0];
      const g = { id: S.gameId, at: Date.now(), tour: !!S.inTour, players: order.length,
                  winner: tie ? null : { ...this.who(order[0]), score: order[0].score },
                  top: { ...this.who(order[0]), score: order[0].score }, run: { ...this.who(run), n: run.st?.bestRun || 0 } };
      h.games = [...others, g].slice(-80);
      this.save(h);
      // Records: only against games before this one, and only once there are some
      const note = (kind, rec) => { S.records = (S.records || []).filter(r => r.kind !== kind); S.records.push({ kind, ...rec }); };
      const hi = Math.max(0, ...others.map(x => x.top?.score || 0)), st = Math.max(0, ...others.map(x => x.run?.n || 0));
      if (others.length && g.top.score > hi) note("high", { ...g.top, value: g.top.score });
      if (others.length && g.run.n >= 4 && g.run.n > st) note("streak", { ...g.run, value: g.run.n });
    },
    // For the lobby: the last game's winner, the most titles, and the two records
    summary() {
      const all = this.load().games || [], games = all.filter(g => g.id !== S.gameId);
      if (!games.length) return null;
      const won = games.filter(g => g.winner), titles = {};
      won.forEach(g => { const k = g.winner.name.toLowerCase(); titles[k] = titles[k] || { ...g.winner, n: 0 }; titles[k].n++; });
      const most = Object.values(titles).sort((a, b) => b.n - a.n)[0];
      const high = games.map(g => g.top).filter(Boolean).sort((a, b) => b.score - a.score)[0];
      const streak = games.map(g => g.run).filter(r => r && r.n >= 3).sort((a, b) => b.n - a.n)[0];
      return { champ: won[won.length - 1]?.winner || null, most: most && most.n > 1 ? most : null, streak: streak || null, high: high || null };
    },
    // Is this typed name the reigning champion's?
    isChamp(name) { const c = this.summary()?.champ; return !!(name && c && c.name.toLowerCase() === name.toLowerCase()); },
  };

  // ---------- the awards: when a night ends ("New game" from the final scores), MacPhisto hands out
  // three or four, picked from what actually happened, each to whoever earned it most.
  const AWARDS = [
    { id: "comeback", title: "The Comeback", lines: ["award-comeback-1", "award-comeback-2"],
      val: (p, ps) => (ps.length > 2 && p.st.worst === ps.length && placeOf(p) <= 2 ? ps.length - placeOf(p) : 0), min: 1, stat: p => `From last place to ${ordinal(placeOf(p))}` },
    { id: "confident", title: "Most Confidently Wrong", lines: ["award-confident-1", "award-confident-2"],
      val: p => p.st.fastWrong, min: 2, stat: p => `${p.st.fastWrong} wrong answers in under 5 seconds` },
    { id: "fastest", title: "Fastest Finger", lines: ["award-fastest-1", "award-fastest-2"],
      val: p => (p.st.right >= 3 ? 100000 - p.st.rightMs / p.st.right : 0), min: 1, stat: p => `${(p.st.rightMs / p.st.right / 1000).toFixed(1)} seconds per right answer` },
    { id: "bass", title: "The Bass Player Award", lines: ["award-bass-1", "award-bass-2"],
      val: (p, ps, winner) => (ps.length > 1 && p !== winner && p.st.answered >= 5 ? p.st.right / p.st.answered : 0), min: .5,
      stat: p => `${Math.round(100 * p.st.right / p.st.answered)}% right, and quietly holding it together` },
    { id: "buzzer", title: "Last-Second Larry", lines: ["award-buzzer-1", "award-buzzer-2"],
      val: p => p.st.lastSec, min: 2, stat: p => `${p.st.lastSec} right in the last 3 seconds` },
    { id: "streak", title: "Longest Streak", lines: ["award-streak-1", "award-streak-2"],
      val: p => p.st.bestRun, min: 4, stat: p => `${p.st.bestRun} right in a row` },
    { id: "ears", title: "Golden Ears", lines: ["award-ears-1", "award-ears-2"],
      val: p => p.st.songRight, min: 3, stat: p => `${p.st.songRight} of ${p.st.songs} songs named` },
    { id: "sleeper", title: "Running to Stand Still", lines: ["award-sleeper-1", "award-sleeper-2"],
      val: p => p.st.none, min: 3, stat: p => `${p.st.none} questions with no answer` },
  ];
  const ordinal = n => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
  function pickAwards() {
    const ps = S.players.filter(p => p.member && p.st), winner = ps.slice().sort((a, b) => b.score - a.score)[0], got = new Map(), out = [];
    for (const a of AWARDS) {
      if (out.length >= 4) break;
      const best = ps.map(p => ({ p, v: a.val(p, ps, winner) })).filter(x => x.v >= a.min && (got.get(x.p) || 0) < 2)
        .sort((x, y) => y.v - x.v || y.p.score - x.p.score)[0];
      if (!best) continue;
      got.set(best.p, (got.get(best.p) || 0) + 1);
      out.push({ id: a.id, title: a.title, lines: a.lines, pid: best.p.pid, name: shownName(best.p), member: best.p.member, stat: a.stat(best.p, ps) });
    }
    // Records broken tonight close the ceremony
    (S.records || []).slice(0, 2).forEach(r => out.push({ id: "record", title: r.kind === "high" ? "New high score" : "New best streak", lines: ["record-1", "record-2"],
      pid: S.players.find(p => shownName(p) === r.name)?.pid, name: r.name, member: r.member, stat: r.kind === "high" ? `${r.value} points, the most ever on this TV` : `${r.value} in a row, the longest ever on this TV` }));
    return out;
  }
  // One card at a time: the card lands, he says its line, a beat, the next. awardToken cancels whatever
  // was scheduled for a card (skipping, or leaving).
  let awardToken = 0, awardTimer = null;
  function awardNext(ms) { clearTimeout(awardTimer); const t = awardToken; awardTimer = setTimeout(() => stepAward(t), ms); }
  function stepAward(t) {
    if (t !== awardToken || S.phase !== "awards") return;
    S.awardI++;
    if (S.awardI >= S.awards.length) return toLobby(true);
    sync();
    const a = S.awards[S.awardI], id = Host.ready && Host.pick(a.lines), i = S.awardI;
    awardNext(id ? Host.dur(id) * 1000 + 5000 : 4500);   // in case he can't speak
    if (id) setTimeout(() => {
      if (t !== awardToken || S.awardI !== i || S.phase !== "awards") return;
      Host.say(id).then(() => { if (t === awardToken && S.awardI === i) awardNext(1800); });
    }, 900);
  }
  // "New game" from the final scores: the awards (if anything happened worth one), then goodnight
  function endGame() {
    if (S.phase !== "final") return;
    const list = pickAwards();
    if (!list.length) return toLobby(true);
    clearTimeout(qTimer); clearTimeout(rTimer); Host.stop(); hostToken++;
    Object.assign(S, { phase: "awards", awards: list, awardI: -1 });
    awardToken++;
    sync();
    const intro = Host.ready && Host.pick(LINES.awardsIntro), t = awardToken;
    awardNext(intro ? Host.dur(intro) * 1000 + 3000 : 1800);
    if (intro) Host.say(intro).then(() => { if (t === awardToken && S.awardI < 0) awardNext(600); });
  }
  // Enter, or the VIP's phone: on to the next award now
  function skipAward() {
    if (S.phase !== "awards") return;
    awardToken++;
    Host.stop();
    stepAward(awardToken);
  }

  // goodnight: MacPhisto signs off (when "New game" ends a game from the final scores)
  function toLobby(goodnight = false) {
    clearTimeout(qTimer); clearTimeout(rTimer); clearTimeout(awardTimer); awardToken++;
    S.round = 0;
    Player.stop(); Clip.stop(); Host.stop(); Host.walls("", 0); hostToken++;
    S.phase = "lobby"; S.hostLine = null; S.inTour = false;
    S.players = S.players.filter(p => p.local || p.connected);
    seatedCount = S.players.filter(p => p.member).length;
    resetScores();
    sync();
    if (goodnight) setTimeout(() => { if (S.phase === "lobby") Host.sayNext(Host.pick(LINES.goodnight), () => S.phase === "lobby"); }, 600);
  }

  // Lobby chatter: a welcome for the first player to pick a character, a word for the next
  // (once a night each), and "the whole band is here" when all four are taken.
  let seatedCount = 0;
  function lobbyChatter() {
    const n = S.players.filter(p => p.member).length;
    if (n > seatedCount && S.phase === "lobby") {
      const id = n === MAX ? Host.pick(LINES.full, true) : Host.pick(seatedCount === 0 ? LINES.welcome : LINES.join, true);
      Host.sayNext(id, () => S.phase === "lobby");
    }
    seatedCount = n;
  }

  // Heartbeat: phones ping every few seconds. Silent phones are marked away;
  // in the lobby their seat is freed after a grace period.
  setInterval(() => {
    const now = Date.now();
    let changed = false;
    S.players.forEach(p => {
      if (!p.local && p.connected && now - p.seen > STALE_MS) { p.connected = false; p.conn = null; p.lostAt = now; changed = true; }
    });
    if (S.phase === "lobby") {
      const keep = S.players.filter(p => p.local || p.connected || now - p.lostAt < LOBBY_GRACE_MS);
      if (keep.length !== S.players.length) { S.players = keep; seatedCount = keep.filter(p => p.member).length; changed = true; }
    }
    if (changed) { sync(); maybeAllAnswered(); }
  }, 2000);

  // ---------- what each phone sees
  function viewFor(p) {
    const now = Date.now(), q = S.deck[S.i];
    const v = {
      t: "state", phase: S.phase, code: S.code, mode: S.mode, vip: p === vip(),
      me: { name: p.name, member: p.member, score: p.score },
      taken: Object.fromEntries(MEMBERS.map(m => [m.id, S.players.some(x => x !== p && x.member === m.id)])),
      canStart: canStart(),
      waiting: active().filter(x => !x.member).length,
    };
    if (S.phase === "host") v.host = { key: S.hostKey, label: S.hostLabel };
    if (S.phase === "awards") {
      const a = S.awards[S.awardI];
      v.aw = { i: S.awardI, total: S.awards.length, cur: a ? { title: a.title, name: a.name, stat: a.stat, mine: a.pid === p.pid } : null,
               mine: S.awards.slice(0, S.awardI + 1).filter(x => x.pid === p.pid).map(x => x.title) };
    }
    if (S.phase === "wager") v.wager = { category: finalCategory(), tiers: wagerTiers(p), mine: p.wager, score: p.score, left: Math.max(0, S.wagerEndsAt - now), ms: WAGER_SECS * 1000 };
    if (S.phase === "countin") Object.assign(v, { countLeft: Math.max(0, S.countEndsAt - now), countMs: S.countMs, countAt });
    if (S.phase === "question" || S.phase === "reveal") {
      v.q = { n: S.i + 1, total: S.deck.length, opts: q.opts, left: Math.max(0, S.endsAt - now), secs: S.qSecs, song: !!q.song, cover: !!q.cover,
              order: !!q.order, finale: finaleNow(), wager: p.wager };
      v.my = p.answer ? p.answer.seq ?? p.answer.k : null;
    }
    if (S.phase === "reveal") v.rv = { right: q.order ? q.right : q.opts.indexOf(q.a), years: q.years, placed: p.placed, ok: p.ok, gain: p.gain, streak: p.streak,
                                       place: placeOf(p), of: S.players.length, left: Math.max(0, S.revealEndsAt - now) };
    if (S.phase === "final") v.fin = { place: placeOf(p), of: S.players.length, score: p.score, gained: p.score - (p.roundStart || 0), correct: p.correct, total: S.deck.length, rank: rankFor(p), round: S.round,
      tour: S.inTour ? { leg: S.leg, next: S.leg < 3 ? TOUR_NAMES[TOUR[S.leg]] : null } : null,
      tie: S.players.some(x => x !== p && x.score === p.score) };
    return v;
  }

  function sync() {
    S.players.forEach(p => { if (p.conn) p.conn.send(viewFor(p)); });
    render();
    saveGame();
  }

  // ---------- surviving a reload: the TV saves the game in this tab on every change. A reload within
  // half an hour reopens the same room code and carries on from the same screen; phones reconnect by
  // themselves (they keep retrying the room) and get their own seats back.
  const SAVE = "wtshng-tv-game";
  const SAVE_KEYS = ["code", "phase", "mode", "deck", "i", "game", "round", "leg", "inTour", "finale", "endsAt", "revealEndsAt", "revealMs", "qSecs",
    "readingUntil", "qShownAt", "finalAt", "wagerEndsAt", "awards", "awardI", "gameId", "records", "revealLines", "lastHostAt", "hostNext", "hostLabel", "countMs"];
  function saveGame() {
    try {
      const snap = { at: Date.now(), roundLines: [...(S.roundLines || [])], players: S.players.map(({ conn, ...p }) => p) };
      SAVE_KEYS.forEach(k => { snap[k] = S[k]; });
      sessionStorage.setItem(SAVE, JSON.stringify(snap));
    } catch {}
  }
  function restoreGame() {
    let snap = null;
    try { snap = JSON.parse(sessionStorage.getItem(SAVE)); } catch {}
    if (!snap || !snap.code || Date.now() - snap.at > 30 * 60000) return false;
    SAVE_KEYS.forEach(k => { if (k in snap) S[k] = snap[k]; });
    S.roundLines = new Set(snap.roundLines || []);
    const now = Date.now();
    S.players = (snap.players || []).map(p => ({ ...p, conn: null, connected: !!p.local, seen: now, lostAt: now }));
    seatedCount = S.players.filter(p => p.member).length;
    return true;
  }
  function resume() {
    const now = Date.now(), ph = S.phase;
    if (ph !== "lobby" || S.players.length) toast(`Game restored. Phones are reconnecting to room ${S.code}.${navigator.userActivation?.hasBeenActive ? "" : " Click the TV once to bring the sound back."}`);
    if (ph === "host" || ph === "countin") {   // he was talking, or counting in: on to what came next
      if (ph === "host" && S.hostNext === "countin") return countIn();
      if (ph === "host" && S.hostNext === "wager") return startWager();
      return beginQuestion();
    }
    if (ph === "question") {
      if (S.endsAt <= now) return reveal();
      const q = S.deck[S.i];
      if (q?.song) Player.play(q.song.preview);   // the clip starts again; the clock carries on
      qTimer = setTimeout(reveal, S.endsAt - now + 200);
      return sync();
    }
    if (ph === "reveal") {
      S.hostLine = null;
      rTimer = setTimeout(nextQuestion, Math.max(2500, S.revealEndsAt - now));
      return sync();
    }
    if (ph === "wager") {
      if (S.wagerEndsAt <= now) return endWager();
      qTimer = setTimeout(endWager, S.wagerEndsAt - now + 200);
      return sync();
    }
    if (ph === "awards") { S.awardI = Math.max(-1, (S.awardI ?? 0) - 1); awardToken++; sync(); return awardNext(800); }   // the current award again
    sync();
  }

  // ---------- rendering
  // Screens with entrance animations are built once per key and then updated in place,
  // so a player locking in doesn't replay the question's entrance.
  let builtKey = "", seated = new Set(), lockSeen = new Set();
  const shownScore = new Map();

  function joinUrl() {
    const u = new URL("play.html", location.href);
    u.search = "";
    u.searchParams.set("room", S.code);
    if (Net.LOCAL) u.searchParams.set("net", "local");
    return u;
  }

  function render() {
    const st = $("stage");
    st.classList.toggle("couch-on", S.players.some(p => p.local));
    const key = S.phase === "lobby" ? "lobby"
      : S.phase === "host" ? `host:${S.hostKey}`
      : S.phase === "wager" ? `wager:${S.game}`
      : S.phase === "countin" ? `count:${S.game}`
      : S.phase === "final" ? `final:${S.game}`
      : S.phase === "awards" ? `awards:${S.game}:${S.awardI}`
      : `q:${S.game}:${S.i}`;
    if (S.phase === "lobby") {
      const focusId = document.activeElement?.id;
      st.innerHTML = lobbyHtml();
      drawQr();
      Host.place($("host-slot"), "overlay");
      if (focusId && $(focusId)) $(focusId).focus({ preventScroll: true });
    } else if (key !== builtKey) {
      if (S.phase === "countin") {
        st.innerHTML = countinHtml();
        const el = st.querySelector(".countin");
        setTimeout(() => el.classList.add("hold"), countAt[3] * 1000);
      }
      else if (S.phase === "host") { st.innerHTML = hostHtml(); Host.place($("host-slot"), ""); }
      else if (S.phase === "wager") { st.innerHTML = wagerHtml(); Host.place($("host-slot"), "overlay"); Host.walls(finalCategory().toUpperCase(), WAGER_SECS * 1000); }
      else if (S.phase === "awards") { st.innerHTML = awardsHtml(); Host.place($("host-slot"), ""); }
      else if (S.phase === "final") { st.innerHTML = finalHtml(); Host.place($("host-slot"), "overlay"); Touches.win(S.players.slice().sort((a, b) => b.score - a.score)[0]); }
      else { st.innerHTML = playShell(); lockSeen = new Set(); }
    }
    if (S.phase === "question" || S.phase === "reveal") updatePlay();
    if (S.phase === "wager") updateWager();
    builtKey = key;
    document.body.dataset.phase = S.phase;
    if (S.phase !== "question") document.body.classList.remove("hurry");
  }

  function lobbyHtml() {
    const modes = MODES.map(m =>
      `<button type="button" class="mode" id="mode-${m.id}" data-mode="${m.id}" aria-pressed="${S.mode === m.id}"><b>${m.name}</b><span>${m.blurb}</span></button>`).join("");
    const v = vip();
    const now = new Set();
    const slots = MEMBERS.map(m => {
      const p = S.players.find(x => x.member === m.id);
      if (p) now.add(m.id);
      const isNew = p && !seated.has(m.id);
      const cls = ["slot", p && "taken", isNew && "pop", p && p.local && "couch", p && !p.local && !p.connected && "away"].filter(Boolean).join(" ");
      const who = p ? (p.local ? "On this screen" : esc(p.name || "Phone player") + (p.connected ? "" : " · reconnecting")) : "Open";
      return `<button type="button" class="${cls}" id="slot-${m.id}" data-member="${m.id}" style="--mc:${m.color}"
        title="${p ? (p.local ? "Click to free this seat" : "") : "Click to play as " + m.name + " on this screen"}">
        ${p && p === v ? '<span class="vip">VIP</span>' : ""}
        ${avatar(m.id)}<span class="who">${m.name}</span><span class="pname">${who}</span></button>`;
    }).join("");
    seated = now;
    const unpicked = active().filter(p => !p.member).length;
    const hint = !active().length ? "Scan the code to join on your phone, or click a character to play on this screen."
      : unpicked ? `Waiting for ${unpicked} player${unpicked > 1 ? "s" : ""} to pick a character.`
      : `${active().length} of 4 on stage. ${v ? esc(displayName(v)) + " (VIP) can start from their phone." : "Press Enter to start."}`;
    const u = joinUrl();
    const net = S.net === "open" ? `<div class="netmsg">Scan the code, or open the link and type the room code.</div>`
      : S.net === "connecting" ? `<div class="netmsg">Opening the room…</div>`
      : `<div class="netmsg bad">Phones can't connect right now (${esc(S.netErr)}). You can still play on this screen. <button type="button" class="btn ghost" id="btn-retry">Try again</button></div>`;
    return `<section class="lobby${builtKey !== "lobby" ? " intro" : ""}">
      <div class="lobby-main">
        <div class="lobby-top"><h1>Where the Streets Have No <em>Game</em></h1><div id="host-slot"></div></div>
        <div><p class="label">Mode</p><div class="modes">${modes}</div></div>
        <div><p class="label">Pick a character · up to 4 players</p><div class="slots">${slots}</div></div>
        <div class="lobby-foot"><button type="button" class="btn" id="btn-start" ${canStart() ? "" : "disabled"}>Start the show</button>${
          navigator.userActivation && !navigator.userActivation.hasBeenActive ? `<span class="soundhint">Click anywhere on this screen once to switch the sound on.</span>` : `<span class="hint">${hint}</span>`}</div>
      </div>
      <aside class="joinbox framed">
        <p class="label" style="margin:0">Join on your phone</p>
        <div class="qr" id="qr" aria-label="QR code to join"></div>
        <div class="url">${esc(u.host + u.pathname.replace(/\/[^/]*$/, "/play"))}</div>
        <div><p class="label" style="margin:0">Room code</p><div class="code">${S.code || "····"}</div></div>
        ${net}
        ${hallHtml()}
      </aside>
    </section>`;
  }

  function drawQr() {
    const box = $("qr");
    if (!box || !S.code || typeof qrcode !== "function") return;
    try {
      const qr = qrcode(0, "M"); qr.addData(joinUrl().href); qr.make();
      box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    } catch {}
  }

  function wagerHtml() {
    const couch = S.players.find(p => p.local);
    const picks = couch ? `<div class="wager-picks"><span class="label" style="margin:0">On this screen (${esc(shownName(couch))}): keys 1–4</span>${
      wagerTiers(couch).map((a, k) => `<button type="button" class="pick" id="wager-${k}" data-wager="${k}">${k + 1} · ${k === 3 ? "Everything (" + a + ")" : a || "Nothing"}</button>`).join("")}</div>` : "";
    return `<section class="wager">
      <p class="label" style="margin:0">Round ${S.round} · the last question</p>
      <h1>Final <em>wager</em></h1>
      <div class="cat-wrap"><span class="label" style="margin:0">The category</span><div class="cover cat"><span class="title">${esc(finalCategory())}</span></div></div>
      <p class="how">Bet on the last question${S.players.some(p => p.local) ? " (on your phone, or keys 1–4 here)" : " from your phone"}. Get it right and win your bet. Get it wrong and lose it. Under 200 points? You can still bet 200.</p>
      <div class="wager-row"><div class="bets" id="bets"></div><div id="host-slot"></div></div>
      <div class="wager-foot" style="display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap">${picks}<span class="grow" style="flex:1"></span>
        <span class="timer"><span class="meter"><i id="wbar"></i></span><span class="num" id="wnum">${WAGER_SECS}</span></span></div>
    </section>`;
  }
  function updateWager() {
    $("bets").innerHTML = S.players.map(p => {
      const m = byId(p.member), away = !p.local && !p.connected;
      return `<div class="bet${p.wager !== null ? " in" : ""}" style="--mc:${m.color}${away ? ";opacity:.45" : ""}">${avatar(p.member)}
        <div><b>${esc(shownName(p))}</b><span>${p.wager !== null ? "Bet placed" : away ? "Away" : "Thinking…"} · ${p.score} pts</span></div></div>`;
    }).join("");
    const couch = S.players.find(p => p.local);
    document.querySelectorAll("[data-wager]").forEach(b => { b.disabled = !couch || couch.wager !== null; });
  }

  function hostHtml() {
    return `<section class="hostshow"><p class="label">${esc(S.hostLabel)}</p><div id="host-slot"></div>
      <button type="button" class="btn ghost" id="btn-skip">Skip (Enter)</button></section>`;
  }

  function countinHtml() {
    return `<section class="countin stripes moving" aria-label="Unos, dos, tres, catorce">${COUNT_WORDS.map((w, i) =>
      `<span class="w" style="animation-delay:${countAt[i]}s">${w}</span>`).join("")}</section>`;
  }

  function playShell() {
    const q = S.deck[S.i];
    const mode = modeName();
    const answers = q.opts.map((o, k) =>
      `<button type="button" class="ans ch${k + 1}" id="ans-${k}" data-k="${k}"><span class="ch">${k + 1}</span><span>${esc(o)}${q.order ? `<span class="yr"></span>` : ""}</span><span class="pickers">${q.order ? `<span class="rank"></span>` : ""}</span></button>`).join("");
    const s = q.song, c = q.cover;
    const fact = s
      ? `<div class="song"><img class="art" src="${esc(s.art)}" alt=""><p>From <b>${esc(s.album)}</b> (${s.year}).<span class="credit">Preview courtesy of Apple Music</span></p></div>`
      : c ? `<p><b>${esc(c.title)}</b> (${c.year}).${c.note ? " " + esc(c.note) : ""}<span class="credit">Artwork courtesy of Apple Music</span></p>`
      : `<p>${esc(q.f)}</p>`;
    // A cover question puts the cover beside the answers, starting zoomed in on its crop point.
    const body = c
      ? `<div class="qbody"><div class="cover-frame framed"><img id="cover-img" src="${esc(c.art)}" alt="" style="transform-origin:${c.crop.x}% ${c.crop.y}%;transform:scale(${c.crop.zoom})"><span class="worth" id="worth">Worth <b id="worth-n">${100 + COVER_BONUS}</b></span></div><div class="answers">${answers}</div></div>`
      : `<div class="answers">${answers}</div>`;
    return `<section class="play">
      <div class="hud mono"><span class="tag">${mode}</span><span>Round <b>${S.round}</b></span><span>Question <b>${S.i + 1}</b> of ${S.deck.length}</span>${
        finaleNow() ? `<span class="finale">${finaleNow() === "wager" ? `Final wager · ${esc(finalCategory())}` : "Double points"}</span>` : ""}<span class="grow"></span><span id="hud-right"></span></div>
      <p class="question">${esc(q.q)}${q.order ? `<span class="hint">${S.players.some(p => p.local) ? "Keys 1–4 in order here, or on your phone" : "Sort them on your phone"}</span>` : ""}${s ? `<span class="listening" aria-label="Playing on the TV"><i></i><i></i><i></i><i></i><i></i></span>` : ""}</p>
      ${body}
      <div class="strip" id="strip"></div>
      <div class="fact" id="fact" hidden>${fact}<div class="host-slot" id="host-slot-rv" hidden></div><div class="next"><button type="button" class="btn" id="btn-next">${S.i + 1 < S.deck.length ? "Next question" : "Final scores"}</button><div class="meter"><i id="rv-bar"></i></div></div></div>
    </section>`;
  }

  function updatePlay() {
    const q = S.deck[S.i], rev = S.phase === "reveal", right = q.order ? -1 : q.opts.indexOf(q.a);
    const couch = S.players.find(p => p.local);
    const hr = $("hud-right");
    if (hr.dataset.phase !== S.phase) {
      hr.dataset.phase = S.phase;
      hr.innerHTML = rev ? `<span class="answer-is">${q.order ? "IN ORDER" : `ANSWER ${right + 1}`}</span>`
        : `<span class="timer" id="timer"><span class="meter"><i id="bar"></i></span><span class="num" id="num">${S.qSecs}</span></span>`;
    }
    if (q.order) q.opts.forEach((o, k) => {
      // While sorting: the TV player's picks so far. At the reveal the cards line up oldest first,
      // with their years and the faces of everyone who put that one in the right place.
      const b = $("ans-" + k), pos = rev ? q.right.indexOf(k) : couchSeq.indexOf(k);
      b.classList.toggle("done", rev || !couch || !!couch.answer);
      b.classList.toggle("mine", !rev && pos >= 0);
      b.classList.toggle("right", rev);
      b.style.order = rev ? pos : "";
      b.tabIndex = rev || !couch || couch.answer ? -1 : 0;
      b.querySelector(".rank").textContent = pos >= 0 ? ["1st", "2nd", "3rd", "4th"][pos] : "";
      b.querySelector(".yr").textContent = rev ? q.years[k] : "";
      const html = rev ? S.players.filter(p => p.answer?.seq?.[pos] === k).map(p => avatar(p.member)).join("") : "";
      const pk = b.querySelector(".pickers .who") || b.querySelector(".pickers").appendChild(Object.assign(document.createElement("span"), { className: "who" }));
      if (pk.innerHTML !== html) pk.innerHTML = html;
    });
    else q.opts.forEach((o, k) => {
      const b = $("ans-" + k);
      b.classList.toggle("done", rev || !couch || !!couch.answer);
      b.classList.toggle("mine", !rev && couch?.answer?.k === k);
      b.classList.toggle("right", rev && k === right);
      b.classList.toggle("dim", rev && k !== right);
      b.tabIndex = rev || !couch || couch.answer ? -1 : 0;
      const pk = b.querySelector(".pickers");
      const html = rev ? S.players.filter(p => p.answer?.k === k).map(p => avatar(p.member)).join("") : "";
      if (pk.innerHTML !== html) pk.innerHTML = html;
    });
    $("strip").innerHTML = [0, 1, 2, 3].map(i => playerCard(S.players[i])).join("");
    if (q.cover && rev) { $("cover-img").style.transform = "scale(1)"; $("worth").hidden = true; }   // pull back to the whole cover
    $("fact").hidden = !rev;
    const hs = $("host-slot-rv");
    hs.hidden = !(rev && S.hostLine);
    hs.closest(".play").classList.toggle("hosting", !hs.hidden);
    if (!hs.hidden) Host.place(hs, "overlay");
    $("stage").classList.toggle("reveal-on", rev);
  }

  function playerCard(p) {
    if (!p) return `<div class="pl empty"></div>`;
    const m = byId(p.member);
    let st = "", cls = "pl";
    if (S.phase === "question") {
      st = p.answer ? "Locked in" : (p.local || p.connected) ? "Thinking…" : "Away";
      if (p.answer) { cls += " locked"; if (!lockSeen.has(p.pid)) { lockSeen.add(p.pid); cls += " just"; } }
    } else {
      st = p.ok ? (p.gain ? `+${p.gain}` : "Right · no bet") : p.gain < 0 ? `−${-p.gain}` : p.gain > 0 ? `+${p.gain} · ${p.placed} of 4` : p.answer ? "Missed" : "No answer";
      cls += p.ok ? " gain" : " miss";
    }
    if (!p.local && !p.connected) cls += " away";
    if (!shownScore.has(p.pid)) shownScore.set(p.pid, p.score);
    const fx = Touches.card(p);
    return `<div class="${cls}${fx.cls}" style="--mc:${m.color}${fx.style}"><span class="pav">${avatar(p.member)}${fx.av}</span>
      <div class="nm"><b>${esc(shownName(p))}</b></div>
      <div><span class="sc" data-pid="${esc(p.pid)}">${Math.round(shownScore.get(p.pid))}</span><span class="st mono">${st}</span></div>${fx.card}</div>`;
  }

  function tourTag(tie, n) {
    const who = tie ? "Tie at the top" : n > 1 ? "Tonight's headliner" : "Final score";
    if (!S.inTour) return `${S.round > 1 ? `After round ${S.round} · ` : ""}${who}`;
    if (S.leg < 3) return `Round ${S.leg} of 3 · ${tie ? "tie at the top" : n > 1 ? "in the lead" : "so far"}`;
    return tie ? "Tournament · tie at the top" : n > 1 ? "Tournament champion" : "Tournament · final score";
  }

  const signed = n => (n < 0 ? "−" + -n : "+" + n);

  function finalHtml() {
    const order = S.players.slice().sort((a, b) => b.score - a.score);
    const w = order[0];
    if (!w) return `<section class="final"></section>`;
    const tie = order.length > 1 && order[1].score === w.score;
    const board = order.map(p => {
      return `<li><span class="pos">${placeOf(p)}</span>${avatar(p.member)}
        <span class="who"><b>${esc(shownName(p))}</b><span>${S.inTour ? `Round ${S.leg}: ` : ""}${p.correct}/${S.deck.length} right · ${signed(p.score - (p.roundStart || 0))}</span></span>
        <span class="pts">${p.score}</span></li>`;
    }).join("");
    const midTour = S.inTour && S.leg < 3;
    const modes = MODES.map(m => `<button type="button" class="pick" id="next-${m.id}" data-mode="${m.id}" aria-pressed="${S.mode === m.id}">${m.name}</button>`).join("");
    return `<section class="final">
      <div class="winner">
        <span class="ring">${avatar(w.member)}</span>
        <span class="tag">${tourTag(tie, order.length)}</span>
        <h2 style="font-size:${Math.min(5, 48 / Math.max(1, shownName(w).length)).toFixed(2)}rem">${esc(shownName(w))}</h2>
        <p class="rank">Rank: <b>${rankFor(w)}</b></p>
      </div>
      <ol class="board">${board}</ol>
      <div class="host-col" id="host-slot"></div>
      <div class="final-actions">
        ${midTour ? `<div class="next-mode"><span class="label">Tournament · next up</span><b style="font-size:1.4rem">${TOUR_NAMES[TOUR[S.leg]]}</b></div>`
          : `<div class="next-mode"><span class="label">Next round</span><div class="picks">${modes}</div></div>`}
        <button type="button" class="btn" id="btn-again">${midTour ? `Start round ${S.leg + 1} of 3` : S.mode === "tournament" ? "New tournament" : `Start round ${S.round + 1}`}</button>
        <button type="button" class="btn ghost" id="btn-lobby">Awards &amp; new game</button>
      </div>
    </section>`;
  }

  // The awards: the card being given now, MacPhisto beside it, and the ones already given
  function awardsHtml() {
    const a = S.awards[S.awardI], given = S.awards.slice(0, Math.max(0, S.awardI));
    const card = a ? `<div class="award-card" style="--mc:${byId(a.member)?.color || "var(--red)"}">
        <span class="label">${a.id === "record" ? "Hall of Fame" : `Award ${S.awardI + 1}`}</span>
        <h2 class="award-title">${esc(a.title)}</h2>
        <span class="ring">${avatar(a.member)}</span>
        <b class="award-name">${esc(a.name)}</b>
        <p class="stat">${esc(a.stat)}</p></div>`
      : `<div class="award-card waiting"><h2 class="award-title">The envelopes, please…</h2></div>`;
    return `<section class="awards">
      <div class="awards-head"><p class="label" style="margin:0">End of the night</p><h1>The <em>Awards</em></h1></div>
      <div class="awards-row">${card}<div id="host-slot"></div></div>
      <div class="awards-foot">${given.length ? `<ol class="award-list">${given.map(x =>
        `<li style="--mc:${byId(x.member)?.color}">${avatar(x.member)}<span><b>${esc(x.title)}</b>${esc(x.name)}</span></li>`).join("")}</ol>` : "<span></span>"}
        <button type="button" class="btn ghost" id="btn-skip">Next (Enter)</button></div>
    </section>`;
  }

  // The Hall of Fame in the lobby (once there's a game on record)
  function hallHtml() {
    const h = Hall.summary();
    if (!h) return "";
    const row = (k, who, v) => who ? `<li><span>${k}</span><b style="--mc:${byId(who.member)?.color}">${esc(who.name)}</b>${v ? `<i>${v}</i>` : ""}</li>` : "";
    return `<div class="hall"><p class="label" style="margin:0">Hall of Fame</p><ul>
      ${row("Reigning champion", h.champ, h.champ ? h.champ.score + " pts" : "")}
      ${row("Most titles", h.most, h.most ? "× " + h.most.n : "")}
      ${row("Best streak", h.streak, h.streak ? h.streak.n + " in a row" : "")}
      ${row("High score", h.high, h.high ? h.high.score + " pts" : "")}</ul></div>`;
  }

  // ---------- animation loop: spiral, confetti, timers, score count-up
  let last = performance.now(), lastTickSec = null;
  function frame(t) {
    const dt = Math.min(.1, Math.max(0, (t - last) / 1000)); last = t;
    const now = Date.now();
    if (S.phase === "question" && $("bar")) {
      const left = Math.max(0, Math.min(S.qSecs * 1000, S.endsAt - now)), sec = Math.ceil(left / 1000), low = left < 5000;   // full while he reads
      $("bar").style.transform = `scaleX(${left / (S.qSecs * 1000)})`;
      $("num").textContent = sec;
      $("timer").classList.toggle("low", low);
      document.body.classList.toggle("hurry", low);
      if (sec !== lastTickSec && sec <= 5 && sec > 0) Sound.tick();
      lastTickSec = sec;
      // The cover pulls back to half its starting zoom as the clock runs down, at an even pace to the eye.
      const img = $("cover-img"), c = S.deck[S.i].cover;
      if (img && c && !REDUCE) img.style.transform = `scale(${c.crop.zoom * Math.pow(.5, 1 - left / (S.qSecs * 1000))})`;
      if (c && $("worth-n")) $("worth-n").textContent = 100 + Math.round(COVER_BONUS * left / (S.qSecs * 1000));   // what a right answer is worth now
    }
    if (S.phase === "wager" && $("wbar")) {
      const left = Math.max(0, S.wagerEndsAt - now);
      $("wbar").style.transform = `scaleX(${left / (WAGER_SECS * 1000)})`;
      $("wnum").textContent = Math.ceil(left / 1000);
    }
    if (S.phase === "reveal" && $("rv-bar")) $("rv-bar").style.transform = `scaleX(${Math.max(0, S.revealEndsAt - now) / (S.revealMs || REVEAL_MS)})`;
    document.querySelectorAll(".sc[data-pid]").forEach(el => {
      const p = S.players.find(x => x.pid === el.dataset.pid);
      if (!p) return;
      let v = shownScore.get(p.pid) ?? p.score;
      if (v !== p.score) {
        v = p.score - v < 1 ? p.score : v + Math.max(1, (p.score - v) * Math.min(1, dt * 4));
        shownScore.set(p.pid, v);
        el.textContent = Math.round(v);
      }
    });
    Confetti.draw(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- input
  $("stage").addEventListener("click", e => {
    const t = e.target.closest("button");
    if (!t) return;
    if (e.detail) t.blur();   // a mouse click shouldn't leave focus behind for Enter to click again
    if (t.dataset.mode) setMode(t.dataset.mode);
    else if (t.dataset.member) toggleCouch(t.dataset.member);
    else if (t.dataset.k !== undefined) couchTap(Number(t.dataset.k));
    else if (t.id === "btn-start") startGame();
    else if (t.id === "btn-next") nextQuestion();
    else if (t.id === "btn-again") nextRound();
    else if (t.id === "btn-lobby") endGame();
    else if (t.id === "btn-skip") { skipHost(); skipAward(); }
    else if (t.dataset.wager !== undefined) { const c = S.players.find(p => p.local); if (c) placeWager(c, Number(t.dataset.wager)); }
    else if (t.id === "btn-retry") openRoom();
  });
  addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    const k = e.key.toLowerCase();
    if (k === "f") return toggleFull();
    if (S.phase === "wager" && ["1", "2", "3", "4"].includes(k)) {
      const c = S.players.find(p => p.local); if (c) placeWager(c, Number(k) - 1);
    } else if (S.phase === "question" && ["1", "2", "3", "4"].includes(k)) {
      couchTap(Number(k) - 1);
    } else if (S.phase === "question" && k === "backspace" && couchSeq.length && !S.players.find(p => p.local)?.answer) {
      couchSeq.pop(); render();
    } else if (k === "enter" && document.activeElement?.tagName !== "BUTTON") {
      if (S.phase === "lobby") startGame();
      else if (S.phase === "host") skipHost();
      else if (S.phase === "awards") skipAward();
      else if (S.phase === "question") skipReading();
      else if (S.phase === "reveal") nextQuestion();
      else if (S.phase === "final" && Date.now() - S.finalAt > 4000) { if (Host.speaking) Host.stop(); else nextRound(); }   // let the winner have their moment
    }
  });
  function toggleFull() {
    const d = document;
    if (d.fullscreenElement) d.exitFullscreen?.().catch(() => {});
    else d.documentElement.requestFullscreen?.().catch(() => {});
  }
  $("btn-full").onclick = e => { e.currentTarget.blur(); toggleFull(); };
  // The album-title band doubles as a home button: back to the start screen, same players, fresh scores.
  $("btn-home").onclick = e => { e.currentTarget.blur(); toLobby(); };

  // Keep the TV awake while hosting (not all browsers allow it).
  // The lock is dropped whenever the page is hidden, and Safari wants a click, so ask again on both.
  let tvLock = null;
  const tvWake = () => { if (tvLock) return; try { navigator.wakeLock?.request("screen").then(l => { tvLock = l; l.addEventListener("release", () => tvLock = null); }).catch(() => {}); } catch {} };
  tvWake();
  addEventListener("pointerdown", tvWake);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") tvWake(); });

  window.__game = S; // handy for debugging from the console
  loadPhotos(() => { builtKey = ""; render(); });
  if (restoreGame()) { openRoom(0, S.code); resume(); }
  else openRoom();
})();
</script>
