          if (!REDUCE) piece("lemon", LEMON, [
            { transform: "translateX(-25vw) translateY(0) rotate(-160deg)" },
            { transform: "translateX(30vw) translateY(-6vh) rotate(150deg)", offset: .35 },
            { transform: "translateX(70vw) translateY(0) rotate(400deg)", offset: .7 },
            { transform: "translateX(105vw) translateY(-2vh) rotate(600deg)" },
          ], { duration: 3600, delay: 500, easing: "linear" });
        },
      },
      larry: {
        lock() { roll(); },
        win(w) {
          fill(.6);
          w?.querySelector(".ring").insertAdjacentHTML("beforeend",
            `<span class="burst" style="--mc:${byId("larry").color}">${Array.from({ length: 12 }, (_, i) => `<i style="--a:${i * 30}deg"></i>`).join("")}</span>`);
        },
      },
    };

    function mark(p, kind, ms) { marks.set(p.pid, { kind, key: moment(), at: performance.now(), ms }); }
    function lockIn(p) {
      mark(p, "lock", 1000);
      try { (T[p.member]?.lock || (() => Sound.lock()))(); } catch {}
    }
    function right(p) {
      mark(p, "right", REVEAL_MS);
      try { T[p.member]?.right?.(); } catch {}
    }
    // Winner only, once per round. Confetti is part of it: Larry gets stars instead of tape.
    function win(p) {
      if (!p || wonGame === S.game) return;
      wonGame = S.game;
      $("fx").replaceChildren();   // nothing left over from the last reveal
      const w = document.querySelector(".winner");
      w?.classList.add("t-" + p.member);
      Confetti.burst(220, p.member === "larry");
      try { T[p.member]?.win?.(w); } catch {}
    }
    // What a strip card needs: its classes, how far into its effect it is, and anything drawn over the avatar
    function card(p) {
      const m = marks.get(p.pid), t = m ? performance.now() - m.at : 0;
      const on = m && m.key === moment() && t < m.ms;
      if (m && !on) marks.delete(p.pid);
      return {
        cls: ` t-${p.member}${on ? " t" + m.kind : ""}`,
        style: on ? `;--fx-t:${-Math.round(t)}ms` : "",
        av: p.member === "bono" ? `<svg class="shades" viewBox="0 0 64 64" aria-hidden="true">${byId("bono").icon}</svg>` : "",
        card: p.member === "bono" && on && m.kind === "right" ? `<span class="stamp">Hello, hello!</span>` : "",
      };
    }
    return { lockIn, right, win, card };
  })();

  // ---------- players
  const active = () => S.players.filter(p => p.local || p.connected);
  const vip = () => S.players.find(p => !p.local && p.connected && p.member);
  const canStart = () => active().length > 0 && active().every(p => p.member);
  const placeOf = p => 1 + S.players.filter(x => x.score > p.score).length;
  const rankFor = p => RANKS.find(r => Math.round((p.correct / Math.max(1, S.deck.length)) * 10) >= r.min).name;
  const displayName = p => p.name || (byId(p.member)?.name ?? "Choosing…");
  const shownName = p => p.local ? byId(p.member).name : (p.name || byId(p.member).name);

  function newPlayer(pid, name, local = false) {
    return { pid, name, local, member: null, conn: null, connected: local, seen: Date.now(), lostAt: 0,
             score: 0, streak: 0, best: 0, correct: 0, answer: null, gain: 0, ok: false };
  }
  function resetScores() {
    S.players.forEach(p => Object.assign(p, { score: 0, streak: 0, best: 0, correct: 0, answer: null, gain: 0, ok: false }));
    shownScore.clear();
  }

  // ---------- room
  function openRoom(tries = 0) {
    if (room) room.close();
    S.code = Array.from({ length: 4 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
    S.net = "connecting"; render();
    room = Net.host(S.code, {
      onOpen() { S.net = "open"; render(); },
      onError(type) {
        if (type === "unavailable-id" && tries < 5) return openRoom(tries + 1);
        S.net = "failed"; S.netErr = type; render();
      },
      onConnection: handleConn,
    });
  }

  function handleConn(c) {
    c.on("data", m => {
      if (m.t === "join") return onJoin(c, m);
      const p = S.players.find(x => x.conn === c);
      if (!p) return;
      p.seen = Date.now();
      if (m.t === "ping") return c.send({ t: "pong" });
      if (m.t === "pick") return pick(p, m.member);
      if (m.t === "answer") return submit(p, m.k);
      if (m.t === "wager") return placeWager(p, m.k);
      if (p !== vip()) return;
      if (m.t === "mode" && (S.phase === "lobby" || S.phase === "final") && MODES.some(x => x.id === m.mode)) setMode(m.mode);
      else if (m.t === "start" && S.phase === "lobby") startGame();
      else if (m.t === "next" && S.phase === "reveal") nextQuestion();
      else if (m.t === "again" && S.phase === "final") nextRound();
      else if (m.t === "lobby" && S.phase === "final") toLobby(true);
      else if (m.t === "skip") skipHost();
    });
    c.on("close", () => {
      const p = S.players.find(x => x.conn === c);
      if (p) { p.conn = null; p.connected = false; p.lostAt = Date.now(); sync(); maybeAllAnswered(); }
    });
  }

  function onJoin(c, m) {
    const pid = String(m.pid || "").slice(0, 40);
    const name = String(m.name || "").replace(/\s+/g, " ").trim().slice(0, 14);
    // One connection, one seat
    const own = S.players.find(x => x.conn === c);
    if (own && own.pid !== pid) return;
    let p = S.players.find(x => x.pid === pid && !x.local);
    if (!p) {
      if (S.phase !== "lobby") return c.send({ t: "reject", reason: "A game is in progress. You can join when it finishes." });
      if (S.players.length >= MAX) return c.send({ t: "reject", reason: "The game is full. Four players is the limit." });
      p = newPlayer(pid, name);
      S.players.push(p);
      Sound.join();
    } else if (S.phase === "lobby" && name) p.name = name;
    if (p.conn && p.conn !== c) { try { p.conn.send({ t: "reject", reason: "Your seat was picked up on another screen." }); } catch {} }
    Object.assign(p, { conn: c, connected: true, seen: Date.now(), lostAt: 0 });
    sync();
  }

  function pick(p, memberId) {
    if (S.phase !== "lobby" || !byId(memberId)) return;
    if (S.players.some(x => x !== p && x.member === memberId)) return sync();
    p.member = memberId;
    Sound.join();
    sync();
    lobbyChatter();
  }

  // The TV can also seat one player who uses this screen (mouse, or keys 1–4).
  function toggleCouch(memberId) {
    if (S.phase !== "lobby") return;
    const couch = S.players.find(p => p.local);
    const holder = S.players.find(p => p.member === memberId);
    if (holder && holder !== couch) return;
    if (couch && couch.member === memberId) S.players.splice(S.players.indexOf(couch), 1);
    else if (couch) couch.member = memberId;
    else if (S.players.length < MAX) { const p = newPlayer("tv", "On the TV", true); p.member = memberId; S.players.push(p); }
    Sound.join();
    sync();
    lobbyChatter();
  }

  // ---------- game flow
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // ---------- name that song
  // Previews and artwork stream from Apple; nothing is hosted here.
  const SONGS = window.U2S?.SONGS || [];

  function songQuestion(song) {
    // Wrong answers: songs from around the same time, so the year alone doesn't give it away.
    // A hit only gets other hits, so a B-side never gives the answer away by being obscure.
    const near = SONGS.filter(x => x.title !== song.title && (song.tier !== "hit" || x.tier === "hit"))
      .map(x => ({ x, d: Math.abs(x.year - song.year) + Math.random() * 3 }))
      .sort((a, b) => a.d - b.d).slice(0, 8).map(o => o.x);
    return { q: "Name that song", a: song.title, w: shuffle(near).slice(0, 3).map(x => x.title), song };
  }

  // ---------- name the album
  // The TV starts zoomed in on a detail of the cover and pulls back as the clock runs down.
  const COVERS = window.U2C?.COVERS || [];

  function coverQuestion(cover) {
    // Wrong answers: studio albums from around the same time (never the Deep Cuts-only covers).
    const near = COVERS.filter(x => x.tier === "casual" && x.title !== cover.title)
      .map(x => ({ x, d: Math.abs(x.year - cover.year) + Math.random() * 3 }))
      .sort((a, b) => a.d - b.d).slice(0, 6).map(o => o.x);
    return { q: "Name the album", a: cover.title, w: shuffle(near).slice(0, 3).map(x => x.title), cover };
  }

  // Ten questions. Name That Song is all clips (mostly hits, some deep cuts);
  // the other modes are trivia with one clip and one album cover slipped in somewhere in the middle.
  // No repeats: the TV remembers every question and clip it has used (in this browser, across
  // nights) and only deals unused ones. When a pool runs low it starts over on that pool.
  const Used = {
    key: "wtshng-used",
    data: (() => { try { return JSON.parse(localStorage.getItem("wtshng-used")) || {}; } catch { return {}; } })(),
    save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch {} },
    // Take n items from list that haven't been used in this pool; reset the pool if too few remain.
    take(pool, list, n, id) {
      let seen = new Set(this.data[pool] || []);
      let fresh = list.filter(x => !seen.has(id(x)));
      if (fresh.length < n) { seen = new Set(); fresh = list.slice(); }
      const picked = shuffle(fresh).slice(0, n);
      picked.forEach(x => seen.add(id(x)));
      this.data[pool] = [...seen];
      this.save();
      return picked;
    },
  };

  function buildDeck(mode) {
    if ((mode === "songs" || mode === "deep-songs") && !SONGS.length) mode = mode === "songs" ? "casual" : "deep";   // song list didn't load
    const songId = x => x.id;
    if (mode === "deep-songs") return Used.take("song-deep", SONGS.filter(x => x.tier === "deep"), ROUND, songId).map(songQuestion);
    if (mode === "songs") {
      const hits = Used.take("song-hit", SONGS.filter(x => x.tier === "hit"), 6, songId);
      const deep = Used.take("song-deep", SONGS.filter(x => x.tier === "deep"), 4, songId);
      return shuffle([...hits, ...deep]).map(songQuestion);
    }
    const tier = mode === "deep" ? "deep" : "hit";
    const pool = SONGS.filter(x => x.tier === tier);
    // Casual gets the studio albums; Deep Cuts gets those plus the Deep Cuts-only covers.
    const covers = COVERS.filter(x => x.tier === "casual" || mode === "deep");
    const [songAt, coverAt] = shuffle([2, 3, 4, 5, 6, 7]);   // two different slots in the middle
    const extras = [];
    if (pool.length) extras.push([songAt, () => songQuestion(Used.take("song-" + tier, pool, 1, songId)[0])]);
    if (covers.length) extras.push([coverAt, () => coverQuestion(Used.take("cover-" + mode, covers, 1, x => x.id)[0])]);
    // Only deal (and mark as used) the trivia questions that will actually be asked
    const deck = Used.take(mode, Q.filter(q => q.m === mode), ROUND - extras.length, q => q.q);
    extras.sort((a, b) => a[0] - b[0]).forEach(([at, make]) => deck.splice(at, 0, make()));
    return deck;
  }

  const Player = {
    el: new Audio(), fader: null,
    play(url) {
      this.stop();
      if (!url) return;
      this.el.src = url; this.el.volume = 1;
      this.el.play().catch(() => toast("The TV couldn't play the clip. Click anywhere on the TV screen once so it can play sound."));
    },
    fade(to, ms = 800) {
      clearInterval(this.fader);
      const from = this.el.volume, t0 = performance.now();
      this.fader = setInterval(() => {
        const k = Math.min(1, (performance.now() - t0) / ms);
        this.el.volume = from + (to - from) * k;
        if (k === 1) clearInterval(this.fader);
      }, 30);
    },
    stop() { clearInterval(this.fader); this.el.pause(); this.el.removeAttribute("src"); this.el.load(); },
    unlocked: false,
    unlock() {   // call from a click or key: play a moment of silence so Safari allows the clips later
      if (this.unlocked || !this.el.paused || !window.MacPhisto) return;
      this.unlocked = true;
      this.el.src = MacPhisto.SILENCE;
      this.el.play().then(() => { if (this.el.src === MacPhisto.SILENCE) this.stop(); }, () => { this.unlocked = false; });
    },
  };

  // ---------- MacPhisto, the host (macphisto.js draws him; host-lines.js has his lines and their timings)
  // He talks between questions, never over one: at the start of a round, before the song, album and
  // last questions (once a night each), on some reveals, at the final scores, and in the lobby.
  // Anything he says can be skipped: Enter on the TV, or the VIP's phone.
  // What he can say at each moment. Lines not recorded yet (not in host-lines.js) are simply skipped,
  // so a new take starts playing as soon as its MP3 and README row are added.
  const LINES = {
    welcome: ["welcome-1", "welcome-2"],
    join: ["join-1", "join-2"],
    full: ["lobby-full-1"],
    round1: ["start-4", "round-start-1", "round-start-4", "round-start-5"],
    round2: ["next-round-4"],
    roundN: ["round-start-2", "round-start-3", "next-round-2"],
    song: ["song-1", "song-3", "song-4"],
    cover: ["cover-1", "cover-2", "cover-3"],
    lastq: ["last-question-2", "last-question-3", "last-q-3"],
    streak: m => [`streak-${m}-1`, "streak-any-1", "streak-any-2"],
    lead: ["lead-change-1", "lead-change-2", "lead-change-3", "lead-change-4", "lead-change-5"],
    broken: ["streak-broken-1", "streak-broken-2", "streak-broken-3"],
    allRight: ["all-right-3", "all-right-4", "all-right-5"],
    hurry: ["hurry-1"],
    nobody: ["nobody-right-2", "nobody-right-5", "nobody-right-6"],
    nobodyGroup: ["nobody-right-1"],   // "Not ONE of you": needs company
    close: ["close-2"],
    lastPlace: ["last-place-1", "last-place-2", "last-place-3", "last-place-4", "last-place-5"],
    phone: ["phone-1"],
    winner: ["winner-1", "winner-2", "winner-3", "winner-5", "winner-6", "winner-7"],
    tie: ["close-2", "tie-1"],
    goodnight: ["goodnight-1", "goodnight-4"],
  };

  const Host = (() => {
    const box = document.createElement("div");
    const mp = window.MacPhisto && window.HOST_LINES ? MacPhisto.mount(box) : null;
    const said = new Set();   // lines heard tonight, so he doesn't repeat himself
    let queued = null, token = 0;
    const has = id => !!(mp && HOST_LINES[id]);
    // One of ids, preferring lines not heard tonight. fresh: only lines not heard tonight.
    function pick(ids, fresh = false) {
      const ok = ids.filter(has), unheard = ok.filter(id => !said.has(id));
      const pool = unheard.length || fresh ? unheard : ok;
      return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
    }
    // Resolves when he finishes or is cut off. duck: turn the song down under him.
    function say(id, { duck = false } = {}) {
      if (!has(id)) return Promise.resolve();
      said.add(id); queued = null;
      const t = ++token;
      if (duck) Player.fade(.07, 400);
      const safety = setTimeout(() => t === token && mp.stop(), (HOST_LINES[id].dur + 4) * 1000);
      return mp.say(id).then(played => { if (!played) said.delete(id); }, () => said.delete(id)).finally(() => {   // a blocked line can be tried again
        clearTimeout(safety);
        if (t !== token) return;
        if (duck && S.phase === "reveal") Player.fade(.3, 600);
        const q = queued; queued = null;
        if (q && q.when()) say(q.id);
      });
    }
    // Say it now, or after the line he's in the middle of (if when() still holds then).
    function sayNext(id, when) { if (!id) return; if (mp?.speaking) queued = { id, when }; else say(id); }
    function stop() { queued = null; token++; mp?.stop(); }
    function place(slot, cls) {
      if (!mp || !slot) return;
      box.className = "host " + cls;
      if (box.parentNode !== slot) slot.appendChild(box);
    }
    return { ready: !!mp, pick, say, sayNext, stop, place, unlock: () => mp?.unlock(), walls: (text, ms) => mp?.walls(text, ms), dur: id => (has(id) ? HOST_LINES[id].dur : 0), get speaking() { return !!mp?.speaking; } };
  })();

  // His own spot: the screen is his until the line ends (or someone skips), then then() carries on.
  let hostToken = 0;
  function hostBeat(ids, label, then, fresh = false) {
    const id = Host.ready && Host.pick(ids, fresh);
    if (!id) return then();
    const t = ++hostToken;
    Object.assign(S, { phase: "host", hostLine: id, hostLabel: label, hostKey: `${S.game}:${S.i}:${t}` });
    clearTimeout(qTimer); clearTimeout(rTimer);
    Player.stop();
    sync();
    Host.say(id).then(() => { if (t === hostToken && S.phase === "host") then(); });
  }
  function skipHost() { if (S.phase === "host") Host.stop(); }

  // ---------- the lobby soundscape: a stadium before the show. A crowd murmuring, the PA's mains hum
  // and hiss, and a distant cheer now and then. All synthesised (nothing to license). It fades out when
  // the game starts and dips whenever MacPhisto talks.
  const Ambience = (() => {
    const VOL = .32;
    let out = null, buf = null, target = -1, cheerAt = 0;
    function noise(c) {
      const n = c.createBufferSource();
      n.buffer = buf; n.loop = true;
      n.start(c.currentTime, Math.random() * buf.duration);
      return n;
    }
    function build() {
      const c = Sound.ctx, len = c.sampleRate * 4;
      buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;   // pink-ish noise: softer, more like a room than white noise
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = .99765 * b0 + w * .099046; b1 = .963 * b1 + w * .2965164; b2 = .57 * b2 + w * 1.0526913;
        d[i] = (b0 + b1 + b2 + w * .1848) * .11;
      }
      out = c.createGain(); out.gain.value = 0; out.connect(c.destination);
      // the crowd: voices in three bands whose loudness wanders on its own slow clock
      [[380, 1.1, .07], [850, 1.4, .11], [1800, 2, .16]].forEach(([f, q, rate]) => {
        const bp = c.createBiquadFilter(), g = c.createGain(), lfo = c.createOscillator(), depth = c.createGain();
        bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
        g.gain.value = .45; lfo.frequency.value = rate; depth.gain.value = .22;
        lfo.connect(depth).connect(g.gain); lfo.start();
        noise(c).connect(bp).connect(g).connect(out);
      });
      // the PA: a 50 Hz mains hum with a couple of harmonics, and a faint hiss
      [[50, .035], [100, .018], [150, .008]].forEach(([f, v]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.frequency.value = f; g.gain.value = v; o.connect(g).connect(out); o.start();
      });
      const hp = c.createBiquadFilter(), hg = c.createGain();
      hp.type = "highpass"; hp.frequency.value = 6000; hg.gain.value = .05;
      noise(c).connect(hp).connect(hg).connect(out);
    }
    function cheer() {   // a far-off swell, as if the other side of the stadium spotted a roadie
      const c = Sound.ctx, t = c.currentTime, bp = c.createBiquadFilter(), g = c.createGain(), n = noise(c);
      bp.type = "bandpass"; bp.frequency.value = 1200 + Math.random() * 800; bp.Q.value = .7;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.35 + Math.random() * .25, t + 1.2); g.gain.linearRampToValueAtTime(0, t + 4);
      n.connect(bp).connect(g).connect(out); n.stop(t + 4.1);
    }
    function update() {
      if (!Sound.live) return;
      try {
        if (!out) build();
        const want = S.phase === "lobby" ? (Host.speaking ? .3 : 1) * VOL : 0;
        if (want !== target) { target = want; out.gain.setTargetAtTime(want, Sound.ctx.currentTime, want ? .8 : .35); }
        const now = performance.now();
        if (S.phase === "lobby" && now > cheerAt) { if (cheerAt) cheer(); cheerAt = now + 9000 + Math.random() * 14000; }
      } catch {}
    }
    return { update };
  })();

  // Preview links can change, so refresh them from Apple when the TV loads.
  (async () => {
    try {
      for (let i = 0; i < SONGS.length; i += 150) {
        const ids = SONGS.slice(i, i + 150).map(x => x.id).join(",");
        const r = await fetch(`https://itunes.apple.com/lookup?id=${ids}&country=us`);
        const fresh = new Map((await r.json()).results.map(x => [x.trackId, x.previewUrl]));
        SONGS.forEach(x => { if (fresh.get(x.id)) x.preview = fresh.get(x.id); });
      }
    } catch {}
  })();

  // A game is a run of rounds. Scores carry over from round to round; each round can be a
  // different mode. Going back to the start screen ends the game.
  // A tournament is three rounds in a set order, scores carried, ending on the final wager.
  const TOUR = ["casual", "deep-songs", "deep"];
  const TOUR_NAMES = { casual: "Casual Fan", "deep-songs": "Name That Song: Deep Cuts", deep: "Deep Cuts" };
  const roundMode = () => (S.mode === "tournament" ? TOUR[(S.leg || 1) - 1] : S.mode);
  const modeName = () => (S.mode === "tournament" ? `Tournament · ${TOUR_NAMES[roundMode()]}` : MODES.find(m => m.id === S.mode).name);

  function startGame() { startRound(true); }
  function nextRound() { startRound(false); }

  function startRound(fresh) {
    // Everyone still here must have a character.
    if (!canStart()) return sync();
    // A new game drops anyone who left. Between rounds, someone whose phone is asleep keeps their seat and score.
    if (fresh) S.players = S.players.filter(p => p.local || p.connected);
    // A tournament carries on to its next round; otherwise (new game, or after its last round) it starts over, scores and all.
    let restart = fresh;
    if (S.mode === "tournament") {
      if (!fresh && S.inTour && S.leg < 3) S.leg++;
      else { S.leg = 1; restart = true; }
      S.inTour = true;
    } else S.inTour = false;
    S.deck = buildDeck(roundMode()).map(q => ({ ...q, opts: shuffle([q.a, ...q.w]) }));
    S.deck.forEach(q => { if (q.cover) new Image().src = q.cover.art; });   // fetch the cover now so it's there when its question comes up
    if (restart || !S.round) { resetScores(); S.round = 1; }
    else {
      S.round++;
      S.players.forEach(p => Object.assign(p, { streak: 0, best: 0, correct: 0, answer: null, gain: 0, ok: false }));
    }
    S.players.forEach(p => { p.roundStart = p.score; p.wager = null; });
    // The last question is worth double, except at the end of a tournament: that's the final wager.
    S.finale = S.mode === "tournament" && S.leg === 3 ? "wager" : "double";
    S.i = 0; S.game++; S.revealLines = 0; S.lastHostAt = -2; S.roundLines = new Set();
    Host.stop();
    // MacPhisto opens the round, then the count-in
    const label = S.mode === "tournament" ? `Tournament · Round ${S.leg} of 3 · ${TOUR_NAMES[roundMode()]}` : `Round ${S.round} · ${modeName()}`;
    // Round 2 gets "count us in... in Spanish... and BADLY" (once a night), right before the Vertigo count-in
    const opener = S.round === 1 ? LINES.round1 : S.round === 2 && Host.pick(LINES.round2, true) ? LINES.round2 : LINES.roundN;
    hostBeat(opener, label, countIn);
  }

  function countIn() {
    // "Unos, dos, tres, catorce!" before the first question
    Host.stop();
    S.phase = "countin";
    Sound.countIn();   // picks the clip or the robot voice, and with it the word timing
    S.countMs = Math.round((countAt[3] + COUNT_HOLD) * 1000);
    S.countEndsAt = Date.now() + S.countMs;
    clearTimeout(qTimer);
    qTimer = setTimeout(beginQuestion, S.countMs);
    sync();
  }

  function beginQuestion() {
    clearTimeout(rTimer);
    Host.stop();   // never over a question
    S.phase = "question";
    const q = S.deck[S.i];
    if (q.song) Player.play(q.song.preview); else Player.stop();
    S.players.forEach(p => { p.answer = null; p.gain = 0; p.ok = false; });
    S.endsAt = Date.now() + SECS * 1000;
    clearTimeout(qTimer);
    qTimer = setTimeout(reveal, SECS * 1000 + 200);
    sync();
  }

  // ---------- the final wager: before the last question, everyone bets part of their score.
  // Right wins the bet, wrong loses it (never below zero). Anyone under 200 can still bet 200,
  // so whoever's behind always has a way back.
  function wagerTiers(p) {
    const max = Math.max(p.score, 200), r = x => Math.round(x / 10) * 10;
    return [0, r(max / 4), r(max / 2), max];
  }
  function startWager() {
    clearTimeout(qTimer); clearTimeout(rTimer);
    Player.stop(); Host.stop();
    S.phase = "wager";
    S.players.forEach(p => p.wager = null);
    S.wagerEndsAt = Date.now() + WAGER_SECS * 1000;
    qTimer = setTimeout(endWager, WAGER_SECS * 1000 + 200);
    sync();
  }
  function placeWager(p, k) {
    if (S.phase !== "wager" || p.wager !== null || !Number.isInteger(k) || k < 0 || k > 3 || !p.member) return;
    p.wager = wagerTiers(p)[k];
    Sound.lock();
    sync();
    maybeAllAnswered();
  }
  function endWager() {
    if (S.phase !== "wager") return;
    S.players.forEach(p => { if (p.wager === null) p.wager = 0; });
    beginQuestion();
  }
  const finaleNow = () => (S.i === S.deck.length - 1 ? S.finale : null);

  function submit(p, k) {
    if (S.phase !== "question" || p.answer || !Number.isInteger(k) || k < 0 || k > 3 || !p.member) return;
    p.answer = { k, at: Date.now() };
    Touches.lockIn(p);   // the character's own lock-in sound (and card effect)
    sync();
    maybeAllAnswered();
  }

  function maybeAllAnswered() {
    if (S.phase === "wager") {
      const live = active();
      if (live.length && live.every(p => p.wager !== null)) { clearTimeout(qTimer); qTimer = setTimeout(endWager, 900); }
      return;
    }
    if (S.phase !== "question") return;
    const live = active();
    if (live.length && live.every(p => p.answer)) { clearTimeout(qTimer); qTimer = setTimeout(reveal, 700); }
  }

  // The current leader: the one player strictly ahead (with points), or null
  function leader() {
    const o = S.players.slice().sort((a, b) => b.score - a.score);
    return o.length && o[0].score > 0 && (o.length === 1 || o[0].score > o[1].score) ? o[0] : null;
  }

  // What MacPhisto says about this reveal, if anything. Four in a row always gets a line;
  // anything else only if he didn't speak on the last reveal, at most four a round, and
  // never the same line twice in a round.
  function revealLine(was) {
    const ps = S.players, multi = ps.length > 1, n = S.deck.length;
    if (S.i === n - 1) return null;   // the last reveal leads straight to the final scores and the winner line
    const four = ps.find(p => p.ok && p.streak === 4);
    if (four) return Host.pick(LINES.streak(four.member));
    if (S.lastHostAt === S.i - 1 || S.revealLines >= 4) return null;
    const fresh = ids => ids.filter(id => !S.roundLines.has(id));
    const pick = (p, ids, tonight) => (Math.random() < p && fresh(ids).length ? Host.pick(fresh(ids), tonight) : null);
    const lead = leader(), by = ps.slice().sort((a, b) => b.score - a.score);
    if (multi && was.leader && lead && lead !== was.leader) return pick(1, LINES.lead);
    if (ps.some(p => !p.ok && (was.streak.get(p.pid) || 0) >= 3)) return pick(1, LINES.broken);
    if (multi && ps.every(p => p.ok)) return pick(.6, LINES.allRight);
    if (!ps.some(p => p.answer)) return pick(.8, LINES.hurry);
    if (!ps.some(p => p.ok)) return pick(.6, multi ? [...LINES.nobody, ...LINES.nobodyGroup] : LINES.nobody);
    if (multi && S.i >= 4 && by[0].score - by[1].score <= 75) return pick(.5, LINES.close);
    if (multi && S.i >= 5 && by[0].score - by[by.length - 1].score >= 450) return pick(.45, LINES.lastPlace);
    return pick(.15, LINES.phone, true);
  }

  function reveal() {
    if (S.phase !== "question") return;
    clearTimeout(qTimer);
    const q = S.deck[S.i], right = q.opts.indexOf(q.a);
    const was = { leader: leader(), streak: new Map(S.players.map(p => [p.pid, p.streak])) };
    const fin = finaleNow();
    S.players.forEach(p => {
      p.ok = !!p.answer && p.answer.k === right;
      if (p.ok) {
        p.streak++; p.correct++; p.best = Math.max(p.best, p.streak);
        const frac = Math.max(0, Math.min(1, (S.endsAt - p.answer.at) / (SECS * 1000)));
        p.gain = 100 + Math.round(frac * 100) + Math.min(100, (p.streak - 1) * 25);
        if (fin === "double") p.gain *= 2;
        if (fin === "wager") p.gain = p.wager || 0;
      } else {
        p.streak = 0;
        p.gain = fin === "wager" ? -Math.min(p.wager || 0, p.score) : 0;   // a lost bet, never below zero
      }
      p.score += p.gain;
    });
    S.phase = "reveal";
    // MacPhisto comes in after the reveal sounds, and the reveal waits for him to finish.
    const line = Host.ready ? revealLine(was) : null, HOST_IN = 1300;
    S.hostLine = line;
    if (line) { S.revealLines++; S.lastHostAt = S.i; S.roundLines.add(line); }
    const ms = line ? Math.max(REVEAL_MS, HOST_IN + Host.dur(line) * 1000 + 1800) : REVEAL_MS;
    S.revealMs = ms;
    S.revealEndsAt = Date.now() + ms;
    // If his line started late (a slow mp3), give him the time to finish it.
    rTimer = setTimeout(function next() { if (Host.speaking && S.phase === "reveal") rTimer = setTimeout(next, 400); else nextQuestion(); }, ms);
    Sound.reveal();
    S.players.forEach(p => p.ok && Touches.right(p));
    Player.fade(.3);   // the song keeps going quietly under the reveal
    sync();
    if (line) { const at = `${S.game}:${S.i}`; setTimeout(() => { if (S.phase === "reveal" && `${S.game}:${S.i}` === at) Host.say(line, { duck: true }); }, HOST_IN); }
  }

  function nextQuestion() {
    if (S.phase !== "reveal") return;
    clearTimeout(rTimer);
    Host.stop();
    S.hostLine = null;
    S.i++;
    if (S.i < S.deck.length) {
      // A word from MacPhisto before the song, the album cover and the last question (each once a night)
      const q = S.deck[S.i], n = S.deck.length, of = `Question ${S.i + 1} of ${n}`;
      if (S.i === n - 1) {
        if (S.finale === "wager") hostBeat(LINES.lastq, "Last question · Final wager", startWager, true);
        else hostBeat(LINES.lastq, "Last question · Double points", beginQuestion, true);
      }
      else if (q.song && !["songs", "deep-songs"].includes(roundMode())) hostBeat(LINES.song, `${of} · Name that song`, beginQuestion, true);
      else if (q.cover) hostBeat(LINES.cover, `${of} · Name the album`, beginQuestion, true);
      else beginQuestion();
    } else {
      S.phase = "final"; S.finalAt = Date.now(); Player.stop(); Sound.win(); sync();
      // MacPhisto crowns the winner once the fanfare's done (a tie gets "neck and neck")
      const o = S.players.slice().sort((a, b) => b.score - a.score), tie = o.length > 1 && o[0].score === o[1].score;
      const line = Host.pick(tie ? LINES.tie : LINES.winner), g = S.game;
      if (line) setTimeout(() => { if (S.phase === "final" && S.game === g) Host.say(line); }, 2400);
    }
  }

  // Mode can change in the lobby or between rounds; the results screen is rebuilt to show it.
  function setMode(id) {
    S.mode = id;
    if (S.phase === "final") builtKey = "";
    sync();
  }

  // goodnight: MacPhisto signs off (when "New game" ends a game from the final scores)
  function toLobby(goodnight = false) {
    clearTimeout(qTimer); clearTimeout(rTimer);
    S.round = 0;
    Player.stop(); Clip.stop(); Host.stop(); hostToken++;
    S.phase = "lobby"; S.hostLine = null; S.inTour = false;
    S.players = S.players.filter(p => p.local || p.connected);
    seatedCount = S.players.filter(p => p.member).length;
    resetScores();
    sync();
    if (goodnight) setTimeout(() => { if (S.phase === "lobby") Host.sayNext(Host.pick(LINES.goodnight), () => S.phase === "lobby"); }, 600);
  }

  // Lobby chatter: a welcome for the first player to pick a character, a word for the next
  // (once a night each), and "the whole band is here" when all four are taken.
  let seatedCount = 0;
  function lobbyChatter() {
    const n = S.players.filter(p => p.member).length;
    if (n > seatedCount && S.phase === "lobby") {
      const id = n === MAX ? Host.pick(LINES.full, true) : Host.pick(seatedCount === 0 ? LINES.welcome : LINES.join, true);
      Host.sayNext(id, () => S.phase === "lobby");
    }
    seatedCount = n;
  }

  // Heartbeat: phones ping every few seconds. Silent phones are marked away;
  // in the lobby their seat is freed after a grace period.
  setInterval(() => {
    const now = Date.now();
    let changed = false;
    S.players.forEach(p => {
      if (!p.local && p.connected && now - p.seen > STALE_MS) { p.connected = false; p.conn = null; p.lostAt = now; changed = true; }
    });
    if (S.phase === "lobby") {
      const keep = S.players.filter(p => p.local || p.connected || now - p.lostAt < LOBBY_GRACE_MS);
      if (keep.length !== S.players.length) { S.players = keep; seatedCount = keep.filter(p => p.member).length; changed = true; }
    }
    if (changed) { sync(); maybeAllAnswered(); }
  }, 2000);

  // ---------- what each phone sees
  function viewFor(p) {
    const now = Date.now(), q = S.deck[S.i];
    const v = {
      t: "state", phase: S.phase, code: S.code, mode: S.mode, vip: p === vip(),
      me: { name: p.name, member: p.member, score: p.score },
      taken: Object.fromEntries(MEMBERS.map(m => [m.id, S.players.some(x => x !== p && x.member === m.id)])),
      canStart: canStart(),
      waiting: active().filter(x => !x.member).length,
    };
    if (S.phase === "host") v.host = { key: S.hostKey, label: S.hostLabel };
    if (S.phase === "wager") v.wager = { tiers: wagerTiers(p), mine: p.wager, score: p.score, left: Math.max(0, S.wagerEndsAt - now), ms: WAGER_SECS * 1000 };
    if (S.phase === "countin") Object.assign(v, { countLeft: Math.max(0, S.countEndsAt - now), countMs: S.countMs, countAt });
    if (S.phase === "question" || S.phase === "reveal") {
      v.q = { n: S.i + 1, total: S.deck.length, opts: q.opts, left: Math.max(0, S.endsAt - now), song: !!q.song, cover: !!q.cover,
              finale: finaleNow(), wager: p.wager };
      v.my = p.answer ? p.answer.k : null;
    }
    if (S.phase === "reveal") v.rv = { right: q.opts.indexOf(q.a), ok: p.ok, gain: p.gain, streak: p.streak, place: placeOf(p), of: S.players.length, left: Math.max(0, S.revealEndsAt - now) };
    if (S.phase === "final") v.fin = { place: placeOf(p), of: S.players.length, score: p.score, gained: p.score - (p.roundStart || 0), correct: p.correct, total: S.deck.length, rank: rankFor(p), round: S.round,
      tour: S.inTour ? { leg: S.leg, next: S.leg < 3 ? TOUR_NAMES[TOUR[S.leg]] : null } : null };
    return v;
  }

  function sync() {
    S.players.forEach(p => { if (p.conn) p.conn.send(viewFor(p)); });
    render();
  }

  // ---------- rendering
  // Screens with entrance animations are built once per key and then updated in place,
  // so a player locking in doesn't replay the question's entrance.
  let builtKey = "", seated = new Set(), lockSeen = new Set();
  const shownScore = new Map();

  function joinUrl() {
    const u = new URL("play.html", location.href);
    u.search = "";
    u.searchParams.set("room", S.code);
    if (Net.LOCAL) u.searchParams.set("net", "local");
    return u;
  }

  function render() {
    const st = $("stage");
    st.classList.toggle("couch-on", S.players.some(p => p.local));
    const key = S.phase === "lobby" ? "lobby"
      : S.phase === "host" ? `host:${S.hostKey}`
      : S.phase === "wager" ? `wager:${S.game}`
      : S.phase === "countin" ? `count:${S.game}`
      : S.phase === "final" ? `final:${S.game}`
      : `q:${S.game}:${S.i}`;
    if (S.phase === "lobby") {
      const focusId = document.activeElement?.id;
      st.innerHTML = lobbyHtml();
      drawQr();
      Host.place($("host-slot"), "overlay");
      if (focusId && $(focusId)) $(focusId).focus({ preventScroll: true });
    } else if (key !== builtKey) {
      if (S.phase === "countin") {
        st.innerHTML = countinHtml();
        const el = st.querySelector(".countin");
        setTimeout(() => el.classList.add("hold"), countAt[3] * 1000);
      }
      else if (S.phase === "host") { st.innerHTML = hostHtml(); Host.place($("host-slot"), ""); }
      else if (S.phase === "wager") { st.innerHTML = wagerHtml(); Host.place($("host-slot"), "overlay"); Host.walls("PLACE YOUR BETS", WAGER_SECS * 1000); }
      else if (S.phase === "final") { st.innerHTML = finalHtml(); Host.place($("host-slot"), "overlay"); Touches.win(S.players.slice().sort((a, b) => b.score - a.score)[0]); }
      else { st.innerHTML = playShell(); lockSeen = new Set(); }
    }
    if (S.phase === "question" || S.phase === "reveal") updatePlay();
    if (S.phase === "wager") updateWager();
    builtKey = key;
    document.body.dataset.phase = S.phase;
    if (S.phase !== "question") document.body.classList.remove("hurry");
  }

  function lobbyHtml() {
    const modes = MODES.map(m =>
      `<button type="button" class="mode" id="mode-${m.id}" data-mode="${m.id}" aria-pressed="${S.mode === m.id}"><b>${m.name}</b><span>${m.blurb}</span></button>`).join("");
    const v = vip();
    const now = new Set();
    const slots = MEMBERS.map(m => {
      const p = S.players.find(x => x.member === m.id);
      if (p) now.add(m.id);
      const isNew = p && !seated.has(m.id);
      const cls = ["slot", p && "taken", isNew && "pop", p && p.local && "couch", p && !p.local && !p.connected && "away"].filter(Boolean).join(" ");
      const who = p ? (p.local ? "On this screen" : esc(p.name || "Phone player") + (p.connected ? "" : " · reconnecting")) : "Open";
      return `<button type="button" class="${cls}" id="slot-${m.id}" data-member="${m.id}" style="--mc:${m.color}"
        title="${p ? (p.local ? "Click to free this seat" : "") : "Click to play as " + m.name + " on this screen"}">
        ${p && p === v ? '<span class="vip">VIP</span>' : ""}
        ${avatar(m.id)}<span class="who">${m.name}</span><span class="pname">${who}</span></button>`;
    }).join("");
    seated = now;
    const unpicked = active().filter(p => !p.member).length;
    const hint = !active().length ? "Scan the code to join on your phone, or click a character to play on this screen."
      : unpicked ? `Waiting for ${unpicked} player${unpicked > 1 ? "s" : ""} to pick a character.`
      : `${active().length} of 4 on stage. ${v ? esc(displayName(v)) + " (VIP) can start from their phone." : "Press Enter to start."}`;
    const u = joinUrl();
    const net = S.net === "open" ? `<div class="netmsg">Scan the code, or open the link and type the room code.</div>`
      : S.net === "connecting" ? `<div class="netmsg">Opening the room…</div>`
      : `<div class="netmsg bad">Phones can't connect right now (${esc(S.netErr)}). You can still play on this screen. <button type="button" class="btn ghost" id="btn-retry">Try again</button></div>`;
    return `<section class="lobby${builtKey !== "lobby" ? " intro" : ""}">
      <div class="lobby-main">
        <div class="lobby-top"><h1>Where the Streets Have No <em>Game</em></h1><div id="host-slot"></div></div>
        <div><p class="label">Mode</p><div class="modes">${modes}</div></div>
        <div><p class="label">Pick a character · up to 4 players</p><div class="slots">${slots}</div></div>
        <div class="lobby-foot"><button type="button" class="btn" id="btn-start" ${canStart() ? "" : "disabled"}>Start the show</button>${
          navigator.userActivation && !navigator.userActivation.hasBeenActive ? `<span class="soundhint">Click anywhere on this screen once to switch the sound on.</span>` : `<span class="hint">${hint}</span>`}</div>
      </div>
      <aside class="joinbox framed">
        <p class="label" style="margin:0">Join on your phone</p>
        <div class="qr" id="qr" aria-label="QR code to join"></div>
        <div class="url">${esc(u.host + u.pathname.replace(/\/[^/]*$/, "/play"))}</div>
        <div><p class="label" style="margin:0">Room code</p><div class="code">${S.code || "····"}</div></div>
        ${net}
      </aside>
    </section>`;
  }

  function drawQr() {
    const box = $("qr");
    if (!box || !S.code || typeof qrcode !== "function") return;
    try {
      const qr = qrcode(0, "M"); qr.addData(joinUrl().href); qr.make();
      box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    } catch {}
  }

  function wagerHtml() {
    const couch = S.players.find(p => p.local);
    const picks = couch ? `<div class="wager-picks"><span class="label" style="margin:0">On this screen (${esc(shownName(couch))}): keys 1–4</span>${
      wagerTiers(couch).map((a, k) => `<button type="button" class="pick" id="wager-${k}" data-wager="${k}">${k + 1} · ${k === 3 ? "Everything (" + a + ")" : a || "Nothing"}</button>`).join("")}</div>` : "";
    return `<section class="wager">
      <p class="label" style="margin:0">Round ${S.round} · the last question</p>
      <h1>Final <em>wager</em></h1>
      <p class="how">Bet on the last question from your phone. Get it right and win your bet. Get it wrong and lose it.</p>
      <div class="wager-row"><div class="bets" id="bets"></div><div id="host-slot"></div></div>
      <div class="wager-foot" style="display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap">${picks}<span class="grow" style="flex:1"></span>
        <span class="timer"><span class="meter"><i id="wbar"></i></span><span class="num" id="wnum">${WAGER_SECS}</span></span></div>
    </section>`;
  }
  function updateWager() {
    $("bets").innerHTML = S.players.map(p => {
      const m = byId(p.member), away = !p.local && !p.connected;
      return `<div class="bet${p.wager !== null ? " in" : ""}" style="--mc:${m.color}${away ? ";opacity:.45" : ""}">${avatar(p.member)}
        <div><b>${esc(shownName(p))}</b><span>${p.wager !== null ? "Bet placed" : away ? "Away" : "Thinking…"} · ${p.score} pts</span></div></div>`;
    }).join("");
    const couch = S.players.find(p => p.local);
    document.querySelectorAll("[data-wager]").forEach(b => { b.disabled = !couch || couch.wager !== null; });
  }

  function hostHtml() {
    return `<section class="hostshow"><p class="label">${esc(S.hostLabel)}</p><div id="host-slot"></div>
      <button type="button" class="btn ghost" id="btn-skip">Skip (Enter)</button></section>`;
  }

  function countinHtml() {
    return `<section class="countin stripes moving" aria-label="Unos, dos, tres, catorce">${COUNT_WORDS.map((w, i) =>
      `<span class="w" style="animation-delay:${countAt[i]}s">${w}</span>`).join("")}</section>`;
  }

  function playShell() {
    const q = S.deck[S.i];
    const mode = modeName();
    const answers = q.opts.map((o, k) =>
      `<button type="button" class="ans ch${k + 1}" id="ans-${k}" data-k="${k}"><span class="ch">${k + 1}</span><span>${esc(o)}</span><span class="pickers"></span></button>`).join("");
    const s = q.song, c = q.cover;
    const fact = s
      ? `<div class="song"><img class="art" src="${esc(s.art)}" alt=""><p>From <b>${esc(s.album)}</b> (${s.year}).<span class="credit">Preview courtesy of Apple Music</span></p></div>`
      : c ? `<p><b>${esc(c.title)}</b> (${c.year}).${c.note ? " " + esc(c.note) : ""}<span class="credit">Artwork courtesy of Apple Music</span></p>`
      : `<p>${esc(q.f)}</p>`;
    // A cover question puts the cover beside the answers, starting zoomed in on its crop point.
    const body = c
      ? `<div class="qbody"><div class="cover-frame framed"><img id="cover-img" src="${esc(c.art)}" alt="" style="transform-origin:${c.crop.x}% ${c.crop.y}%;transform:scale(${c.crop.zoom})"></div><div class="answers">${answers}</div></div>`
      : `<div class="answers">${answers}</div>`;
    return `<section class="play">
      <div class="hud mono"><span class="tag">${mode}</span><span>Round <b>${S.round}</b></span><span>Question <b>${S.i + 1}</b> of ${S.deck.length}</span>${
        finaleNow() ? `<span class="finale">${finaleNow() === "wager" ? "Final wager" : "Double points"}</span>` : ""}<span class="grow"></span><span id="hud-right"></span></div>
      <p class="question">${esc(q.q)}${s ? `<span class="listening" aria-label="Playing on the TV"><i></i><i></i><i></i><i></i><i></i></span>` : ""}</p>
      ${body}
      <div class="strip" id="strip"></div>
      <div class="fact" id="fact" hidden>${fact}<div class="host-slot" id="host-slot-rv" hidden></div><div class="next"><button type="button" class="btn" id="btn-next">${S.i + 1 < S.deck.length ? "Next question" : "Final scores"}</button><div class="meter"><i id="rv-bar"></i></div></div></div>
    </section>`;
  }

  function updatePlay() {
    const q = S.deck[S.i], rev = S.phase === "reveal", right = q.opts.indexOf(q.a);
    const couch = S.players.find(p => p.local);
    const hr = $("hud-right");
    if (hr.dataset.phase !== S.phase) {
      hr.dataset.phase = S.phase;
      hr.innerHTML = rev ? `<span class="answer-is">ANSWER ${right + 1}</span>`
        : `<span class="timer" id="timer"><span class="meter"><i id="bar"></i></span><span class="num" id="num">${SECS}</span></span>`;
    }
    q.opts.forEach((o, k) => {
      const b = $("ans-" + k);
      b.classList.toggle("done", rev || !couch || !!couch.answer);
      b.classList.toggle("mine", !rev && couch?.answer?.k === k);
      b.classList.toggle("right", rev && k === right);
      b.classList.toggle("dim", rev && k !== right);
      b.tabIndex = rev || !couch || couch.answer ? -1 : 0;
      const pk = b.querySelector(".pickers");
      const html = rev ? S.players.filter(p => p.answer?.k === k).map(p => avatar(p.member)).join("") : "";
      if (pk.innerHTML !== html) pk.innerHTML = html;
    });
    $("strip").innerHTML = [0, 1, 2, 3].map(i => playerCard(S.players[i])).join("");
    if (q.cover && rev) $("cover-img").style.transform = "scale(1)";   // pull back to the whole cover
    $("fact").hidden = !rev;
    const hs = $("host-slot-rv");
    hs.hidden = !(rev && S.hostLine);
    hs.closest(".play").classList.toggle("hosting", !hs.hidden);
    if (!hs.hidden) Host.place(hs, "overlay");
    $("stage").classList.toggle("reveal-on", rev);
  }

  function playerCard(p) {
    if (!p) return `<div class="pl empty"></div>`;
    const m = byId(p.member);
    let st = "", cls = "pl";
    if (S.phase === "question") {
      st = p.answer ? "Locked in" : (p.local || p.connected) ? "Thinking…" : "Away";
      if (p.answer) { cls += " locked"; if (!lockSeen.has(p.pid)) { lockSeen.add(p.pid); cls += " just"; } }
    } else {
      st = p.ok ? `+${p.gain}` : p.gain < 0 ? `−${-p.gain}` : p.answer ? "Missed" : "No answer";
      cls += p.ok ? " gain" : " miss";
    }
    if (!p.local && !p.connected) cls += " away";
    if (!shownScore.has(p.pid)) shownScore.set(p.pid, p.score);
    const fx = Touches.card(p);
    return `<div class="${cls}${fx.cls}" style="--mc:${m.color}${fx.style}"><span class="pav">${avatar(p.member)}${fx.av}</span>
      <div class="nm"><b>${esc(shownName(p))}</b></div>
      <div><span class="sc" data-pid="${esc(p.pid)}">${Math.round(shownScore.get(p.pid))}</span><span class="st mono">${st}</span></div>${fx.card}</div>`;
  }

  function tourTag(tie, n) {
    const who = tie ? "Tie at the top" : n > 1 ? "Tonight's headliner" : "Final score";
    if (!S.inTour) return `${S.round > 1 ? `After round ${S.round} · ` : ""}${who}`;
    if (S.leg < 3) return `Round ${S.leg} of 3 · ${tie ? "tie at the top" : n > 1 ? "in the lead" : "so far"}`;
    return tie ? "Tournament · tie at the top" : n > 1 ? "Tournament champion" : "Tournament · final score";
  }

  function finalHtml() {
    const order = S.players.slice().sort((a, b) => b.score - a.score);
    const w = order[0];
    if (!w) return `<section class="final"></section>`;
    const tie = order.length > 1 && order[1].score === w.score;
    const board = order.map(p => {
      return `<li><span class="pos">${placeOf(p)}</span>${avatar(p.member)}
        <span class="who"><b>${esc(shownName(p))}</b><span>${p.correct}/${S.deck.length} right · +${p.score - (p.roundStart || 0)}</span></span>
        <span class="pts">${p.score}</span></li>`;
    }).join("");
    const midTour = S.inTour && S.leg < 3;
    const modes = MODES.map(m => `<button type="button" class="pick" id="next-${m.id}" data-mode="${m.id}" aria-pressed="${S.mode === m.id}">${m.name}</button>`).join("");
    return `<section class="final">
      <div class="winner">
        <span class="ring">${avatar(w.member)}</span>
        <span class="tag">${tourTag(tie, order.length)}</span>
        <h2 style="font-size:${Math.min(5, 48 / Math.max(1, shownName(w).length)).toFixed(2)}rem">${esc(shownName(w))}</h2>
        <p class="rank">Rank: <b>${rankFor(w)}</b></p>
      </div>
      <ol class="board">${board}</ol>
      <div class="host-col" id="host-slot"></div>
      <div class="final-actions">
        ${midTour ? `<div class="next-mode"><span class="label">Tournament · next up</span><b style="font-size:1.4rem">${TOUR_NAMES[TOUR[S.leg]]}</b></div>`
          : `<div class="next-mode"><span class="label">Next round</span><div class="picks">${modes}</div></div>`}
        <button type="button" class="btn" id="btn-again">${midTour ? `Start round ${S.leg + 1} of 3` : S.mode === "tournament" ? "New tournament" : `Start round ${S.round + 1}`}</button>
        <button type="button" class="btn ghost" id="btn-lobby">New game</button>
      </div>
    </section>`;
  }

  // ---------- animation loop: spiral, confetti, timers, score count-up
  let last = performance.now(), lastTickSec = null;
  function frame(t) {
    const dt = Math.min(.1, Math.max(0, (t - last) / 1000)); last = t;
    const now = Date.now();
    if (S.phase === "question" && $("bar")) {
      const left = Math.max(0, S.endsAt - now), sec = Math.ceil(left / 1000), low = left < 5000;
      $("bar").style.transform = `scaleX(${left / (SECS * 1000)})`;
      $("num").textContent = sec;
      $("timer").classList.toggle("low", low);
      document.body.classList.toggle("hurry", low);
      if (sec !== lastTickSec && sec <= 5 && sec > 0) Sound.tick();
      lastTickSec = sec;
      // The cover pulls back to half its starting zoom as the clock runs down, at an even pace to the eye.
      const img = $("cover-img"), c = S.deck[S.i].cover;
      if (img && c && !REDUCE) img.style.transform = `scale(${c.crop.zoom * Math.pow(.5, 1 - left / (SECS * 1000))})`;
    }
    if (S.phase === "wager" && $("wbar")) {
      const left = Math.max(0, S.wagerEndsAt - now);
      $("wbar").style.transform = `scaleX(${left / (WAGER_SECS * 1000)})`;
      $("wnum").textContent = Math.ceil(left / 1000);
    }
    if (S.phase === "reveal" && $("rv-bar")) $("rv-bar").style.transform = `scaleX(${Math.max(0, S.revealEndsAt - now) / (S.revealMs || REVEAL_MS)})`;
    document.querySelectorAll(".sc[data-pid]").forEach(el => {
      const p = S.players.find(x => x.pid === el.dataset.pid);
      if (!p) return;
      let v = shownScore.get(p.pid) ?? p.score;
      if (v !== p.score) {
        v = p.score - v < 1 ? p.score : v + Math.max(1, (p.score - v) * Math.min(1, dt * 4));
        shownScore.set(p.pid, v);
        el.textContent = Math.round(v);
      }
    });
    Confetti.draw(dt);
    Ambience.update();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- input
  $("stage").addEventListener("click", e => {
    const t = e.target.closest("button");
    if (!t) return;
    if (e.detail) t.blur();   // a mouse click shouldn't leave focus behind for Enter to click again
    if (t.dataset.mode) setMode(t.dataset.mode);
    else if (t.dataset.member) toggleCouch(t.dataset.member);
    else if (t.dataset.k !== undefined) { const c = S.players.find(p => p.local); if (c) submit(c, Number(t.dataset.k)); }
    else if (t.id === "btn-start") startGame();
    else if (t.id === "btn-next") nextQuestion();
    else if (t.id === "btn-again") nextRound();
    else if (t.id === "btn-lobby") toLobby(true);
    else if (t.id === "btn-skip") skipHost();
    else if (t.dataset.wager !== undefined) { const c = S.players.find(p => p.local); if (c) placeWager(c, Number(t.dataset.wager)); }
    else if (t.id === "btn-retry") openRoom();
  });
  addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    const k = e.key.toLowerCase();
    if (k === "f") return toggleFull();
    if (S.phase === "wager" && ["1", "2", "3", "4"].includes(k)) {
      const c = S.players.find(p => p.local); if (c) placeWager(c, Number(k) - 1);
    } else if (S.phase === "question" && ["1", "2", "3", "4"].includes(k)) {
      const c = S.players.find(p => p.local); if (c) submit(c, Number(k) - 1);
    } else if (k === "enter" && document.activeElement?.tagName !== "BUTTON") {
      if (S.phase === "lobby") startGame();
      else if (S.phase === "host") skipHost();
      else if (S.phase === "reveal") nextQuestion();
      else if (S.phase === "final" && Date.now() - S.finalAt > 6000 && !Host.speaking) nextRound();   // let the winner have their moment
    }
  });
  function toggleFull() {
    const d = document;
    if (d.fullscreenElement) d.exitFullscreen?.().catch(() => {});
    else d.documentElement.requestFullscreen?.().catch(() => {});
  }
  $("btn-full").onclick = e => { e.currentTarget.blur(); toggleFull(); };
  // The album-title band doubles as a home button: back to the start screen, same players, fresh scores.
  $("btn-home").onclick = e => { e.currentTarget.blur(); toLobby(); };

  // Keep the TV awake while hosting (not all browsers allow it).
  // The lock is dropped whenever the page is hidden, and Safari wants a click, so ask again on both.
  let tvLock = null;
  const tvWake = () => { if (tvLock) return; try { navigator.wakeLock?.request("screen").then(l => { tvLock = l; l.addEventListener("release", () => tvLock = null); }).catch(() => {}); } catch {} };
  tvWake();
  addEventListener("pointerdown", tvWake);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") tvWake(); });

  window.__game = S; // handy for debugging from the console
  loadPhotos(() => { builtKey = ""; render(); });
  openRoom();
})();
</script>
</body>
</html>
