<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where the Streets Have No Game</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A U2 trivia party game. Put it on the TV, join on your phones, play as Bono, Edge, Adam or Larry.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Big+Shoulders+Stencil+Display:wght@800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Tinos:wght@400;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  /* TV layout: one 16:9 screen under a thin hazard-stripe band. Everything is
     sized in rem off the viewport width so it reads from the sofa. */
  html { font-size: clamp(13px, 1.2vw, 30px); }
  body { overflow: hidden; --sw: .5rem; }
  /* stripes run faster as the pressure goes up */
  body[data-phase="countin"] { --stripe-speed: .45s; }
  body.hurry { --stripe-speed: .35s; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  body { display: flex; flex-direction: column; }
  header.cover { flex: none; height: 6.2rem; font-size: 1rem; padding-top: env(safe-area-inset-top, 0px); }
  header.cover .title { cursor: pointer; background: none; border: 0; padding: 0; }
  header.cover .title:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: .2em; }
  header.cover .title { font-size: 2.5rem; }
  .controls {
    position: fixed; z-index: 4; display: flex; gap: .4rem;
    right: max(1rem, env(safe-area-inset-right, 0px)); top: max(.4rem, env(safe-area-inset-top, 0px));
  }
  .controls button {
    background: rgba(0,0,0,.55); border: 0; border-radius: .25rem; cursor: pointer; padding: .3rem .55rem;
    font: 500 .7rem var(--font-mono); letter-spacing: .1em; color: #fff; opacity: .8;
  }
  .controls button:hover { opacity: 1; background: rgba(0,0,0,.8); }
  .toast {
    position: fixed; z-index: 6; left: 50%; top: 7rem; transform: translateX(-50%); max-width: min(40rem, 90vw);
    background: var(--fg); color: #000; font-size: 1rem; line-height: 1.4; padding: .7rem 1.1rem; border-radius: .3rem;
    animation: rise .3s backwards;
  }
  .tv {
    position: relative; z-index: 1; flex: 1; min-height: 0;
    display: grid; grid-template-rows: 1fr;
    padding-block: 1.2rem max(1.9rem, env(safe-area-inset-bottom, 0px));
    padding-left: max(1.6rem, env(safe-area-inset-left, 0px));
    padding-right: max(1.6rem, env(safe-area-inset-right, 0px));
  }

  .stage { min-height: 0; display: grid; }
  .stage > section { min-height: 0; }
  .label { font: 600 .9rem var(--font-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 0 0 .55rem; }

  /* ---------- lobby ---------- */
  .lobby { display: grid; grid-template-columns: 1fr 21rem; gap: 2rem; align-content: start; }
  .lobby-main { display: grid; gap: 1.25rem; align-content: start; min-width: 0; }
  .lobby-top { display: grid; grid-template-columns: 1fr 19rem; gap: 1.6rem; align-items: center; }
  .lobby-top h1 { font-size: 3.7rem; }
  h1 {
    font-family: var(--font-display); font-weight: 900; text-transform: uppercase;
    font-size: 4.6rem; line-height: .84; margin: 0; letter-spacing: -.005em; text-wrap: balance;
  }
  .lobby.intro h1 { animation: slam .7s cubic-bezier(.2,.9,.3,1.2) backwards; }
  h1 em {
    font-style: normal; font-family: var(--font-stencil); color: var(--ink-on-signal);
    background: var(--red); padding: 0 .16em; margin-left: .04em; display: inline-block; transform: skewX(-10deg);
  }
  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8rem; }
  .soundhint { color: var(--red); font-weight: 600; margin: 0; }

  /* name-that-song: bars that bounce while the clip plays */
  .listening { display: inline-flex; align-items: flex-end; gap: .25rem; height: 2.6rem; margin-left: 1.2rem; vertical-align: -.1em; }
  .listening i { width: .45rem; height: 100%; background: var(--red); transform-origin: bottom; animation: eq .9s ease-in-out infinite alternate; }
  .listening i:nth-child(2) { animation-delay: -.3s; } .listening i:nth-child(3) { animation-delay: -.6s; }
  .listening i:nth-child(4) { animation-delay: -.15s; } .listening i:nth-child(5) { animation-delay: -.45s; }
  .reveal-on .listening i { animation-play-state: paused; opacity: .4; }
  @keyframes eq { from { transform: scaleY(.15); } to { transform: scaleY(1); } }
  /* name-the-album: the cover sits beside the answers, as big as the row allows (up to 22rem) */
  .qbody { display: grid; grid-template-columns: auto 1fr; gap: 1.4rem; min-height: 0; container-type: size; }
  .qbody .answers { min-width: 0; }
  .cover-frame {
    --fw: .45rem; width: min(22rem, 100cqh); aspect-ratio: 1; align-self: center; overflow: hidden;
    animation: rise .45s cubic-bezier(.2,.9,.3,1.1) backwards;
  }
  .cover-frame img { display: block; width: 100%; height: 100%; object-fit: cover; will-change: transform; }
  .reveal-on .cover-frame img { transition: transform 1.4s cubic-bezier(.2,.8,.2,1); }
  .fact .art { width: 6.5rem; height: 6.5rem; object-fit: cover; flex: none; }
  .fact .song { display: flex; gap: 1.2rem; align-items: center; }
  .fact .credit { display: block; font: 500 .8rem var(--font-mono); letter-spacing: .08em; color: var(--muted); margin-top: .35rem; text-transform: uppercase; }
  .mode {
    text-align: left; cursor: pointer; background: color-mix(in srgb, var(--screen) 88%, transparent); border: 2px solid var(--line);
    border-radius: .4rem; padding: .85rem 1.1rem; display: grid; gap: .25rem; transition: border-color .2s, background .2s, transform .15s;
  }
  .mode b { font-family: var(--font-display); font-weight: 900; font-size: 1.8rem; text-transform: uppercase; line-height: 1; }
  .mode span { color: var(--muted); font-size: .9rem; line-height: 1.3; }
  .mode:hover { border-color: var(--muted); transform: translateY(-2px); }
  .mode[aria-pressed="true"] { border-color: var(--red); }

  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: .7rem; }
  .slot {
    --mc: var(--muted);
    position: relative; text-align: left; cursor: pointer; background: color-mix(in srgb, var(--screen) 88%, transparent);
    border: 2px solid transparent; border-radius: .4rem; padding: .65rem .8rem;
    display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: .8rem; align-items: center; min-width: 0;
    transition: border-color .2s, transform .15s;
  }
  .slot .av { width: 3.4rem; grid-row: 1 / 3; opacity: .3; filter: grayscale(.8); transition: opacity .3s, filter .3s; }
  .slot .who { font-family: var(--font-display); font-weight: 900; font-size: 1.55rem; text-transform: uppercase; line-height: 1; align-self: end; }
  .slot .pname { font: 500 .85rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; align-self: start; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); margin-top: .2rem; }
  .slot.taken { border-style: solid; border-color: var(--mc); background: color-mix(in srgb, var(--mc) 14%, var(--screen)); }
  .slot.taken .av { opacity: 1; filter: none; }
  .slot.taken .pname { font: 700 1.05rem var(--font-body); letter-spacing: 0; text-transform: none; color: var(--fg); }
  .slot.pop .av { animation: pop .55s cubic-bezier(.2,.9,.3,1.4) both; }
  .slot.pop { animation: flash .7s ease-out; --fx: var(--mc); }
  .slot.away { opacity: .5; }
  .slot:hover:not(.taken) { border-color: var(--muted); transform: translateY(-2px); }
  .slot.taken:not(.couch) { cursor: default; }
  .vip {
    position: absolute; top: -.6rem; right: .6rem; font: 700 .75rem var(--font-mono); letter-spacing: .12em;
    background: var(--fg); color: var(--bg); border-radius: .2rem; padding: .1rem .4rem;
  }
  .lobby-foot { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; font-size: 1.05rem; }
  .lobby-foot .btn { font-size: 1.35rem; }
  .lobby-foot .hint { color: var(--muted); }

  .joinbox {
    --fw: .6rem; border-radius: 0; box-shadow: 0 0 3rem rgba(0,0,0,.6);
    padding: 1.3rem; display: grid; gap: .9rem; justify-items: center; text-align: center; align-content: start;
  }
  .joinbox .qr { background: #fff; padding: .7rem; border-radius: .3rem; width: 12.5rem; max-width: 100%; aspect-ratio: 1; }
  .joinbox .qr svg { width: 100%; height: 100%; display: block; }
  .joinbox .url { font: 500 .9rem var(--font-mono); color: var(--muted); word-break: break-all; }
  .code { font-family: var(--font-stencil); font-weight: 900; font-size: 5.4rem; line-height: .9; letter-spacing: .08em; color: var(--red); padding-left: .08em; }
  .netmsg { font-size: .95rem; color: var(--muted); max-width: 18rem; }
  .netmsg.bad { color: var(--bad); }

  /* ---------- MacPhisto, the host (drawn by macphisto.js) ---------- */
  .host { position: relative; }
  .host .mp-svg { display: block; width: 100%; height: auto; }
  .host .mp-sub { font-family: var(--font-serif); color: #fff; text-align: center; line-height: 1.25; opacity: 0; transition: opacity .2s; text-wrap: balance; }
  .host .mp-sub.on { opacity: 1; }
  .host .mp-sub em { font-style: italic; }
  /* in a corner of a screen, the subtitle sits on the stage floor */
  .host.overlay .mp-sub { position: absolute; left: 3%; right: 3%; bottom: 2%; font-size: 1.05rem; padding: .2em .5em; background: rgba(0,0,0,.75); border-radius: .2rem; }
  .host.overlay .mp-sub:not(.on) { visibility: hidden; }
  /* his own spot: the stage as big as the screen allows, subtitles underneath */
  .hostshow { display: grid; grid-template-rows: auto 1fr auto; justify-items: center; align-items: center; gap: .6rem; min-height: 0; }
  .hostshow #host-slot { width: min(100%, calc((100dvh - 20rem) * 1.6)); }
  .hostshow .host { animation: rise .5s cubic-bezier(.2,.9,.3,1.1) backwards; }
  .hostshow .host .mp-sub { font-size: 2rem; min-height: 2.6em; margin-top: .5rem; }
  .hostshow .btn { font-size: 1rem; }
  .fact .host-slot { width: 15rem; }
  .fact .host-slot .mp-sub { font-size: 1.1rem; }
  /* while he's on, the question and answers tighten up to make room */
  .play.hosting .question { font-size: 3rem; }
  .play.hosting .ans { padding-block: .45rem; }
  .fact .host-slot:empty, .fact .host-slot[hidden] { display: none; }
  .final .host-col { width: 21rem; align-self: center; }

  /* ---------- the finale: a wager before the last question, or double points ---------- */
  .wager { display: grid; grid-template-rows: auto auto auto auto 1fr auto; gap: .9rem; min-height: 0; }
  .wager h1 { font-size: 3.2rem; animation: slam .6s cubic-bezier(.2,.9,.3,1.2) backwards; }
  /* the category, Final Jeopardy style: the album-cover band with the category as its title */
  .wager .cat { --cw: 2rem; justify-self: start; padding: 1rem 2.4rem; border-radius: .2rem; animation: rise .6s .5s cubic-bezier(.2,.9,.3,1.1) backwards; }
  .wager .cat .title { font-size: 2.4rem; white-space: normal; text-align: center; }
  .wager .cat-wrap { display: grid; gap: .3rem; }
  .wager .how { font-size: 1.15rem; color: var(--muted); margin: 0; max-width: 60ch; }
  .wager-row { display: grid; grid-template-columns: 1fr min(19rem, calc((100dvh - 31rem) * 1.6)); gap: 1.6rem; align-items: center; min-height: 0; overflow: hidden; }
  .bets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; align-content: center; }
  .bet { --mc: var(--muted); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .9rem; align-items: center; background: var(--screen);
    border: 2px solid var(--line); border-radius: .45rem; padding: .8rem 1rem; }
  .bet .av { width: 3.4rem; }
  .bet b { display: block; font-size: 1.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bet div span { font: 600 .85rem var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .bet.in { border-color: var(--mc); }
  .bet.in div span { color: var(--mc); }
  .bet.in .av { animation: pop .45s cubic-bezier(.2,.9,.3,1.4); }
  .wager-picks { display: flex; gap: .7rem; flex-wrap: wrap; align-items: center; }
  .wager-picks .pick { font-size: 1.2rem; }
  .hud .finale { font: 700 .9rem var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-on-signal);
    background: var(--red); padding: .25rem .6rem; border-radius: .2rem; animation: pop .5s cubic-bezier(.2,.9,.3,1.4) both; }

  /* ---------- count-in: the whole screen goes to racing stripes ---------- */
  .countin { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; --sw: 1.6rem; }
  .countin .w {
    grid-area: 1 / 1; font-family: var(--font-stencil); font-weight: 900; font-size: 14rem; line-height: .9; color: var(--fg);
    background: var(--bg); padding: .04em .25em 0; opacity: 0;
    animation: word .62s cubic-bezier(.2,.9,.3,1.1) both;
  }
  .countin .w:last-child { background: var(--fg); color: var(--red); font-size: 12rem; opacity: 1; animation: pop .5s cubic-bezier(.2,.9,.3,1.4) both; }
  .countin.hold { animation-play-state: paused; }   /* the stripes stop dead on CATORCE */

  /* ---------- question / reveal ---------- */
  .play { display: grid; grid-template-rows: auto auto 1fr auto auto; gap: 1rem; }
  .hud { display: flex; align-items: center; gap: 1.2rem; font-size: 1.05rem; color: var(--muted); }
  .hud b { color: var(--fg); }
  .hud .tag { color: var(--fg); }
  .hud .grow { flex: 1; }
  .timer { display: flex; align-items: center; gap: .9rem; }
  .timer .num { font-family: var(--font-stencil); font-weight: 900; font-size: 3.4rem; line-height: .8; color: var(--fg); min-width: 2ch; text-align: right; }
  .timer.low .num { color: var(--red); animation: thump .5s ease-in-out infinite; }
  .meter { width: 18rem; height: .9rem; background: var(--line); overflow: hidden; transform: skewX(-20deg); }
  .meter i { display: block; height: 100%; width: 100%; background: var(--fg); transform-origin: left; }
  .timer .meter i { --sw: .3rem; background: var(--stripes); }
  .timer.low .meter i { animation: stripe-run .35s linear infinite; }
  .answer-is { font-family: var(--font-display); font-weight: 900; font-size: 1.8rem; color: var(--good); letter-spacing: .04em; animation: pop .45s both; }
  .question {
    font-family: var(--font-display); font-weight: 900; font-size: 3.7rem; line-height: 1; margin: 0;
    text-wrap: balance; max-width: 40ch; animation: slam .55s cubic-bezier(.2,.9,.3,1.1) both;
  }
  .answers { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: .9rem; align-content: center; min-height: 0; }
  .ans {
    --c: var(--ch1);
    background: color-mix(in srgb, var(--screen) 92%, transparent); border: 2px solid var(--line); border-radius: .45rem;
    padding: .9rem 1.2rem; display: grid; grid-template-columns: auto 1fr auto; gap: 1.1rem; align-items: center;
    font-size: 1.8rem; font-weight: 600; line-height: 1.15; text-align: left; min-width: 0; cursor: default;
    animation: rise .45s cubic-bezier(.2,.9,.3,1.1) backwards;
    transition: opacity .35s, border-color .3s, background .3s, transform .3s;
  }
  .ans.ch2 { --c: var(--ch2); animation-delay: .08s; }
  .ans.ch3 { --c: var(--ch3); animation-delay: .16s; }
  .ans.ch4 { --c: var(--ch4); animation-delay: .24s; }
  .ans .ch { font-size: 2.4rem; }
  .ans .pickers { display: flex; gap: .3rem; align-items: center; }
  .ans .pickers .who { display: flex; gap: .3rem; }
  /* put-them-in-order: the place each card has been given, and its year at the reveal */
  .ans .rank { font-family: var(--font-stencil); font-weight: 900; font-size: 1.6rem; color: var(--fg); }
  .ans .yr { display: block; font: 500 1.1rem var(--font-mono); letter-spacing: .08em; color: var(--good); }
  .ans .yr:empty { display: none; }
  .reveal-on .question .hint { display: none; }
  .question .hint { display: block; font: 500 1rem var(--font-mono); letter-spacing: .08em; color: var(--muted); margin-top: .4rem; text-transform: uppercase; }
  /* a cover question: what a right answer is worth right now (it drops as the cover pulls back) */
  .cover-frame { position: relative; }
  .cover-frame .worth { position: absolute; left: .5rem; bottom: .5rem; background: rgba(0,0,0,.75); color: #fff; padding: .3rem .6rem; border-radius: .3rem;
    font: 500 .9rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
  .cover-frame .worth b { font-family: var(--font-stencil); font-size: 1.5rem; letter-spacing: .02em; color: var(--good); }
  .ans .pickers .av { width: 2.7rem; animation: pop .4s cubic-bezier(.2,.9,.3,1.4) both; }
  .couch-on .ans:not(.done) { cursor: pointer; }
  .couch-on .ans:not(.done):hover { border-color: var(--fg); transform: translateY(-2px); }
  .ans.mine { border-color: var(--fg); background: color-mix(in srgb, var(--fg) 10%, var(--screen)); }
  .ans.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 22%, var(--screen)); transform: scale(1.02); animation: flash .8s ease-out; --fx: var(--good); transition: none; }
  .ans.dim { opacity: .4; transform: scale(.98); }

  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8rem; }
  .pl {
    --mc: var(--muted);
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .8rem;
    background: var(--screen); border: 2px solid var(--line); border-radius: .45rem; padding: .55rem .8rem; min-width: 0;
    transition: border-color .25s;
  }
  .pl .av { width: 3rem; }
  .pl .nm { min-width: 0; }
  .pl .nm b { display: block; font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl .nm span { font: 500 .78rem var(--font-mono); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  .pl .sc { font-family: var(--font-stencil); font-weight: 900; font-size: 2.2rem; line-height: .9; display: block; text-align: right; }
  .pl .st { font: 600 .78rem var(--font-mono); letter-spacing: .1em; color: var(--muted); display: block; text-align: right; }
  .pl.locked { border-color: var(--mc); }
  .pl.locked .st { color: var(--mc); }
  .pl.just { animation: thump .45s ease-out; }
  .pl.just .av { animation: pop .45s cubic-bezier(.2,.9,.3,1.4); }
  .pl.gain { border-color: var(--good); }
  .pl.gain .st { color: var(--good); font-size: 1rem; animation: pop .5s .2s cubic-bezier(.2,.9,.3,1.4) both; }
  .pl.miss .st { color: var(--bad); }
  .pl.away { opacity: .45; }
  .pl.empty { visibility: hidden; }

  .fact { display: grid; grid-template-columns: 1fr auto auto; gap: 1.4rem; align-items: center; padding-top: .9rem; animation: rise .5s .3s backwards; position: relative; }
  .fact::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: .35rem; --sw: .25rem; background: var(--stripes); }
  .fact p { margin: 0; font-size: 1.35rem; line-height: 1.45; max-width: 60ch; }
  .fact .next { display: grid; gap: .5rem; justify-items: end; }
  .fact .meter { width: 12rem; }
  .fact .btn { font-size: 1.05rem; }

  /* ---------- final ---------- */
  .final { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 2.4rem; align-content: center; }
  .winner { display: grid; gap: .9rem; align-content: center; justify-items: start; }
  .winner .av { width: 11rem; animation: pop .8s cubic-bezier(.2,.9,.3,1.4) both; }
  .winner .ring { --sw: .45rem; padding: .6rem; border-radius: 50%; background: var(--stripes); display: inline-grid; }
  .winner .tag { font: 600 1.05rem var(--font-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-on-signal); background: var(--red); padding: .3rem .7rem; border-radius: .2rem; animation: rise .5s .3s backwards; }
  .winner h2 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 5rem; line-height: .85; margin: 0; text-wrap: balance; max-width: 100%; animation: slam .7s .45s backwards; }
  .winner .rank { font-size: 1.5rem; color: var(--muted); margin: 0; animation: rise .5s .7s backwards; }
  .winner .rank b { color: var(--fg); }
  .board { list-style: none; margin: 0; padding: 0; display: grid; gap: .8rem; align-content: center; }
  .board li { display: grid; grid-template-columns: 2.6rem auto minmax(0, 1fr) auto; gap: 1rem; align-items: center; background: var(--screen); border: 2px solid var(--line); border-radius: .45rem; padding: .8rem 1.1rem; animation: rise .5s backwards; }
  .board li:nth-child(2) { animation-delay: .1s; }
  .board li:nth-child(3) { animation-delay: .2s; }
  .board li:nth-child(4) { animation-delay: .3s; }
  .board .pos { font-family: var(--font-stencil); font-weight: 900; font-size: 2.6rem; color: var(--muted); line-height: 1; }
  .board li:first-child { border-color: var(--red); }
  .board li:first-child .pos { color: var(--red); }
  .board .av { width: 3.4rem; }
  .board .who { min-width: 0; }

  .final-actions { grid-column: 1 / -1; display: flex; gap: 1rem; justify-content: center; align-items: flex-end; flex-wrap: wrap; }

  /* Larry: one burst per hit of his drum fill, the crash the biggest */
  .burst i {
    position: absolute; left: 50%; top: 50%; width: 1.6rem; height: 1.6rem; margin: -.8rem; background: #fff; opacity: 0;
    clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);

  .burst.crash i { width: 2.4rem; height: 2.4rem; margin: -1.2rem; animation-duration: 2.4s; }
  @keyframes burst { 0% { transform: rotate(var(--a)) translateY(-4rem) scale(0); opacity: 1; } 50% { opacity: 1; } 100% { transform: rotate(var(--a)) translateY(calc(-1 * var(--far, 10rem))) scale(1) rotate(90deg); opacity: 0; } }
  /* The Edge: rings sent out from the winner on each repeat of the echo */
  .fx .echo-ring { position: absolute; border-radius: 50%; border: .35rem solid #ff5a3c; box-shadow: 0 0 1.2rem rgba(255,90,60,.6); }
  /* Bono: the shades settle on the winner, then a glint runs across the lenses */

  .winner .av .glint { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.85) 48%, transparent 60%); background-size: 260% 100%;
    animation: glint 1.4s ease-in-out both; }
  @keyframes glint { from { background-position: 120% 0; } to { background-position: -40% 0; } }
  /* Adam: the lemon on its cables, in two halves that come apart */
  .fx .lemon .half { position: absolute; inset: 0; }
  .fx .lemon .half.l { clip-path: inset(0 50% 0 0); transform-origin: 50% 50%; }
  .fx .lemon .half.r { clip-path: inset(0 0 0 50%); transform-origin: 50% 50%; }
  .fx .lemon .cable { position: absolute; bottom: 60%; width: 2px; height: 120vh; background: linear-gradient(#0000, #8a8a8a); }
  .fx .lemon .cable.l { left: 30%; } .fx .lemon .cable.r { right: 30%; }
  /* Screen-wide pieces, added to .fx and removed when they finish */

  .fx .flyby svg, .fx .lemon svg { display: block; width: 100%; height: auto; }
  .fx .lemon { position: absolute; left: 0; top: 0; width: 22vw; aspect-ratio: 220 / 150; filter: drop-shadow(0 .6rem 1.2rem rgba(0,0,0,.6)); }
  @media (prefers-reduced-motion: reduce) {

  .awards h1 { font-size: 3.2rem; animation: slam .6s cubic-bezier(.2,.9,.3,1.2) backwards; }
  .awards-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 2rem; align-items: center; min-height: 0; }
  .award-card { --mc: var(--red); display: grid; justify-items: center; text-align: center; gap: .7rem; padding: 1.6rem 2rem; border: 2px solid var(--mc);
    border-radius: .6rem; background: color-mix(in srgb, var(--mc) 12%, var(--screen)); animation: slam .7s cubic-bezier(.2,.9,.3,1.1) both; min-width: 0; }
  .award-card.waiting { border-color: var(--line); background: var(--screen); }
  .award-title { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 3rem; line-height: .9; margin: 0; text-wrap: balance; max-width: 100%; }
  .award-card .ring { --sw: .4rem; padding: .5rem; border-radius: 50%; background: var(--stripes); display: inline-grid; animation: pop .6s .3s cubic-bezier(.2,.9,.3,1.4) both; }
  .award-card .av { width: min(9rem, 22vh); }
  .award-name { font-size: 2.2rem; line-height: 1; overflow-wrap: anywhere; animation: rise .5s .5s backwards; }
  .award-card .stat { font: 500 1.05rem var(--font-mono); letter-spacing: .06em; color: var(--muted); margin: 0; animation: rise .5s .7s backwards; }

    border-radius: .4rem; padding: .35rem .8rem .35rem .5rem; animation: rise .4s both; font-size: .85rem; color: var(--muted); }
  .award-list .av { width: 2.2rem; }

  .joinbox:has(.hall) .code { font-size: 4.4rem; }

  .hall li { display: grid; grid-template-columns: minmax(0, 1fr); font-size: .9rem; min-width: 0; }
  .hall li span { grid-column: 1 / -1; font: 500 .65rem var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .hall li b { color: var(--mc, var(--fg)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  @media (max-aspect-ratio: 1/1) {

    body { overflow: auto; }

<body>

  <main class="stage" id="stage"></main>

<script src="vendor/peerjs.min.js"></script>

<script>
(() => {
  const { MODES, Q, RANKS, ORDER } = U2;
  const { MEMBERS, byId, avatar, loadPhotos } = U2M;
  const MAX = 4, ROUND = 10, SECS = 20, ORDER_SECS = 30, COVER_BONUS = 200, REVEAL_MS = 12000, WAGER_SECS = 15, COUNT_HOLD = 2.55, LOBBY_GRACE_MS = 60000, STALE_MS = 12000;
  const CODE_CHARS = "BCDFGHJKLMNPQRSTVWXZ";
  const COUNT_WORDS = ["UNOS", "DOS", "TRES", "¡CATORCE!"];
  // When each word lands, in seconds. The gap before CATORCE is the joke, and CATORCE then
  // holds for COUNT_HOLD. A loaded clip replaces these with the times found in the recording.
  const DEFAULT_AT = [0, .5, 1, 1.85];
  let countAt = DEFAULT_AT.slice();
  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const S = { code: "", net: "connecting", netErr: "", phase: "lobby", mode: "casual", players: [], deck: [], i: 0, game: 0, endsAt: 0, revealEndsAt: 0, countEndsAt: 0,
              hostLine: null, hostLabel: "", hostKey: "" };
  let room = null, qTimer = null, rTimer = null;

  // ---------- sound
  const Sound = {
    ctx: null,   // sound is always on
    init() {
      if (!this.ctx) try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
      if (this.ctx?.state === "suspended") this.ctx.resume().catch(() => {});
    },
    tone(f, dur = .12, type = "square", vol = .04, delay = 0) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + .02);
    },
    join() { this.tone(660, .08); this.tone(990, .12, "square", .04, .08); },
    tick() { this.tone(1200, .04, "square", .025); },
    lock() { this.tone(520, .06, "triangle", .07); },
    reveal() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .22, "triangle", .07, i * .08)); },
    win() { [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, .3, "square", .04, i * .11)); },
    countIn() {
      if (Clip.buffer) { countAt = CLIP_AT.slice(); return Clip.play(); }
      countAt = DEFAULT_AT.slice();   // robot voice: use its own timing
      countAt.slice(0, 3).forEach(d => this.tone(220, .14, "sawtooth", .06, d));
      this.tone(440, .9, "sawtooth", .07, countAt[3]);
      // Bono's count-in, if the browser can speak it, with the same pause before "catorce"
      try {
        if (!window.speechSynthesis) return;
        const say = (text, rate) => { const u = new SpeechSynthesisUtterance(text); u.lang = "es-ES"; u.rate = rate; u.pitch = .9; speechSynthesis.speak(u); };
        speechSynthesis.cancel();
        say("Unos, dos, tres", 1.3);
        Clip.robot = setTimeout(() => say("¡Catorce!", 1), countAt[3] * 1000);
      } catch {}
    },
  };
  Sound.init();   // starts suspended; any click or key on the TV lets it play
  ["pointerdown", "keydown"].forEach(ev => addEventListener(ev, () => {
    Sound.init();
    // Safari only lets MacPhisto's voice and the song clips play later if they were started once by a click or key
    Host.unlock(); Player.unlock();
    if (S.phase === "lobby" && document.querySelector(".soundhint")) setTimeout(render, 0);
  }));

  // ---------- Bono's count-in, from the top of "Vertigo"
  // Word times for audio/vertigo-intro.m4a, tapped along by ear on sync.html. Re-run that page if the clip changes.
  // If the clip can't load or play, the robot voice takes over with the default timing.
  // Timings set by ear on sync.html are saved in this browser and win over the built-in ones.
  const CLIP_AT = (() => {
    try { const t = JSON.parse(localStorage.getItem("wtshng-countin-at")); if (Array.isArray(t) && t.length === 4 && t.every(n => typeof n === "number" && n >= 0 && n < 7)) return t; } catch {}
    return [1.95, 2.97, 3.84, 4.69];   // set by ear on sync.html
  })();
  const Clip = {
    buffer: null,
    async load() {
      try {
        const r = await fetch("audio/vertigo-intro.m4a");
        this.buffer = await Sound.ctx.decodeAudioData(await r.arrayBuffer());
        countAt = CLIP_AT.slice();
      } catch {}
    },
    stop() { try { this.src?.stop(); } catch {} this.src = null; clearTimeout(this.robot); try { speechSynthesis.cancel(); } catch {} },
    // From the top: the count-in, the band kicking in, then a fade into the first question.
    // The browser may still be switching sound on (it only allows it after a click), so wait
    // for that and start the clip at the matching point to stay in step with the words.
    play() {
      const c = Sound.ctx, started = performance.now(), end = countAt[3] + COUNT_HOLD;
      const go = () => {
        const at = (performance.now() - started) / 1000;
        if (at > end) return;
        const src = c.createBufferSource(), g = c.createGain(), t = c.currentTime;
        // Fade out by the end of the question's arrival, or by the end of the clip if that's sooner.
        const dur = this.buffer.duration, fadeEnd = Math.min(end + 1, dur), fadeStart = Math.max(at, Math.min(end - .3, fadeEnd - .8));
        src.buffer = this.buffer; src.connect(g).connect(c.destination);
        g.gain.setValueAtTime(1, t); g.gain.setValueAtTime(1, t + fadeStart - at); g.gain.linearRampToValueAtTime(0, t + fadeEnd - at);
        src.start(t, at, fadeEnd - at + .05);
        this.src = src;
      };
      if (c.state === "running") go();
      else c.resume().then(go).catch(() => {});
      setTimeout(() => {
        if (c.state !== "running") toast("The browser is blocking sound on this screen. Click anywhere on the TV page, then start the next game.");
      }, 600);
    },
  };
  Clip.load();

  let toastTimer = null;
  function toast(msg) {
    const el = $("toast");
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 7000);
  }

  // ---------- Zoo Ecus for the winner: on the 1993 Zooropa tour U2 showered crowds with their own
  // banknotes. Drawn here (a note of our own, not a copy): they flutter down slowly, turning over.
  const Confetti = (() => {
    const cv = $("confetti"), cx = cv.getContext("2d");
    let W = 0, H = 0, bits = [], front = null, back = null, nw = 0, nh = 0, fade = 1;
    function size() { W = cv.width = innerWidth; H = cv.height = innerHeight; front = null; }
    addEventListener("resize", size); size();
    // One note, drawn once at the size it falls at; the back is the darker side
    function note(dark) {
      const c = document.createElement("canvas"), g = c.getContext("2d"), w = nw, h = nh, k = w / 120;
      c.width = w; c.height = h;
      g.fillStyle = dark ? "#2f6b2a" : "#dfeab0"; g.fillRect(0, 0, w, h);
      g.strokeStyle = dark ? "#9fd08a" : "#3d7d34"; g.lineWidth = 2.2 * k; g.strokeRect(3 * k, 3 * k, w - 6 * k, h - 6 * k);
      g.lineWidth = .8 * k; g.strokeRect(6 * k, 6 * k, w - 12 * k, h - 12 * k);
      g.fillStyle = dark ? "#cfe8c0" : "#3d7d34"; g.textAlign = "center"; g.textBaseline = "middle";
      g.font = `900 ${12 * k}px "IBM Plex Mono", monospace`;
      [[13, 14], [w / k - 13, 14], [13, h / k - 13], [w / k - 13, h / k - 13]].forEach(([x, y]) => g.fillText("1", x * k, y * k));
      if (dark) {   // the back: a big 1 in a rosette
        g.beginPath(); g.arc(w / 2, h / 2, 15 * k, 0, 7); g.lineWidth = 1.4 * k; g.strokeStyle = "#cfe8c0"; g.stroke();
        g.font = `900 ${20 * k}px "IBM Plex Mono", monospace`; g.fillText("1", w / 2, h / 2 + k);
      } else {
        g.font = `700 ${6 * k}px "IBM Plex Mono", monospace`; g.fillText("ZOOROPA 93", w / 2, 11 * k);
        g.font = `900 ${11 * k}px Georgia, serif`; g.fillStyle = "#3d7d34"; g.fillText("ONE", w / 2, 24 * k);
        g.font = `900 ${12 * k}px Georgia, serif`; g.fillStyle = "#c8452c"; g.fillText("ZOO ECU", w / 2, 37 * k);
        g.font = `600 ${4.6 * k}px "IBM Plex Mono", monospace`; g.fillStyle = "#3d7d34"; g.fillText("BANKNOTE OF ZOO · WATCH MORE TV", w / 2, 48 * k);
      }
      return c;
    }
    // n notes, released over a few seconds so they keep drifting down
    function burst(n = 60) {
      if (REDUCE) return;
      if (!front) { nw = Math.round(Math.max(70, Math.min(130, W * .065))); nh = Math.round(nw * .5); front = note(false); back = note(true); }
      fade = 1;
      for (let i = 0; i < n; i++) bits.push({
        x: Math.random() * W, y: -nh - Math.random() * H * .7, vy: 55 + Math.random() * 45,
        sway: 18 + Math.random() * 40, sf: .6 + Math.random() * .7, sp: Math.random() * 6,
        flip: Math.random() * 6, vf: 1.6 + Math.random() * 1.8, tilt: (Math.random() - .5) * .9, t: 0,
      });
    }
    function draw(dt) {
      if (!bits.length) return;
      if (!front) { nw = Math.round(Math.max(70, Math.min(130, W * .065))); nh = Math.round(nw * .5); front = note(false); back = note(true); }   // redrawn after a resize
      cx.clearRect(0, 0, W, H);
      // They belong to the winner's screen: once the game moves on, the rest fade out
      if (S.phase !== "final" && S.phase !== "awards") fade -= dt / .7;
      if (fade <= 0) { bits = []; fade = 1; return; }
      cx.globalAlpha = fade;
      bits = bits.filter(b => b.y < H + nh * 2);
      for (const b of bits) {
        b.t += dt; b.y += b.vy * dt; b.flip += b.vf * dt;
        const x = b.x + Math.sin(b.t * b.sf * 2 + b.sp) * b.sway, turn = Math.cos(b.flip);
        cx.save(); cx.translate(x, b.y); cx.rotate(b.tilt + Math.sin(b.t * b.sf * 2 + b.sp) * .25);
        cx.scale(1, Math.max(.06, Math.abs(turn)));   // turning over, edge-on in between
        cx.drawImage(turn >= 0 ? front : back, -nw / 2, -nh / 2);
        cx.restore();
      }
      cx.globalAlpha = 1;
      if (!bits.length) cx.clearRect(0, 0, W, H);
    }
    return { burst, draw };
  })();

  // ---------- character touches
  // Each character has its own moment when they lock in, get one right, and win the round.
  // Every sound is synthesised here; the strip-card effects are CSS (see "character touches").
  const Touches = (() => {
    const ECHO = .36;   // The Edge's dotted-eighth delay, at about 126 bpm
    const TITLE = $("btn-home").textContent;
    const marks = new Map();   // pid -> the strip-card effect in progress: { kind, key, at, ms }
    const moment = () => `${S.game}:${S.i}:${S.phase}`;
    let wonGame = -1, holaTimer = null, noiseBuf = null;

    // ---- sounds
    function note(f, { at = 0, dur = .3, type = "triangle", vol = .05, detune = 0, to } = {}) {
      if (!Sound.ctx) return;
      const c = Sound.ctx, t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.value = f; o.detune.value = detune;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(to || c.destination); o.start(t); o.stop(t + dur + .02);
    }
    // A burst of filtered white noise; freq can be [from, to] for a sweep
    function noise(at, dur, vol, freq, q = 1, type = "bandpass") {
      if (!Sound.ctx) return;
      const c = Sound.ctx, t = c.currentTime + at, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
      const [f0, f1] = [].concat(freq, freq);   // a number, or [from, to]
      s.buffer = noiseBuf; f.type = type; f.Q.value = q;
      f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      s.connect(f).connect(g).connect(c.destination); s.start(t, Math.random() * .4); s.stop(t + dur + .02);
    }
    // A drum: a sine dropping in pitch
    function drum(f0, f1, at = 0, dur = .3, vol = .3) {
      if (!Sound.ctx) return;
      const c = Sound.ctx, t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
      o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur * .7);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
    }
    // The Edge's delay: each repeat a dotted eighth later, darker and quieter, until it fades
    function echo() {
      if (!Sound.ctx) return;
      const c = Sound.ctx, inp = c.createGain(), d = c.createDelay(1), lp = c.createBiquadFilter(), fb = c.createGain(), wet = c.createGain();
      d.delayTime.value = ECHO; lp.type = "lowpass"; lp.frequency.value = 2600; fb.gain.value = .45; wet.gain.value = .6;
      inp.connect(c.destination); inp.connect(d).connect(lp);
      lp.connect(fb).connect(d); lp.connect(wet).connect(c.destination);
      return inp;
    }
    // A bright open chord, strummed, each string doubled slightly out of tune
    function chord(at, to) {
      [329.6, 493.9, 659.3, 740, 987.8].forEach((f, i) => {
        note(f, { at: at + i * .018, dur: 1.2, vol: .035, to });
        note(f, { at: at + i * .018, dur: .7, type: "sawtooth", vol: .007, detune: 8, to });
      });
    }
    function roll(at = 0) {   // snare roll: quick bursts getting louder, then an accent
      for (let i = 0; i < 7; i++) noise(at + i * .034, .06, .04 + .012 * i, 2200, .7);
      noise(at + .24, .16, .16, 1900, .6); note(190, { at: at + .24, dur: .08, vol: .06 });
    }
    function fill(at) {   // two snares, the toms down the kit, then kick and crash
      const s = .09;
      noise(at, .09, .14, 2100, .7); noise(at + s, .09, .11, 2100, .7);
      [260, 190, 140].forEach((f, k) => { drum(f, f * .6, at + (2 + 2 * k) * s, .25, .32); drum(f, f * .6, at + (3 + 2 * k) * s, .25, .26); });
      drum(120, 40, at + 8 * s, .5, .45); noise(at + 8 * s, 1.5, .08, 6500, .5, "highpass");
    }

    // ---- screen-wide pieces: added to the effects layer, removed when they finish
    function piece(cls, html, frames, opts) {
      const el = document.createElement("div");
      el.className = cls; el.innerHTML = html;
      $("fx").appendChild(el);
      const { keep, ...o } = opts;   // keep: it stays where it ends up (and removes itself later)
      el.animate(frames, { fill: "both", ...o }).onfinish = () => { if (!keep) el.remove(); };
      return el;
    }
    const SHADES = `<svg viewBox="0 22 64 24" aria-hidden="true"><defs><linearGradient id="fly-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3638"/><stop offset=".55" stop-color="#0a0909"/></linearGradient></defs>
      <g fill="url(#fly-g)" stroke="#ff5fa2" stroke-width=".5">${byId("bono").icon}</g><path d="M14 30l10-2M41 30l10-2" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".7"/></svg>`;
    const LEMON = `<svg viewBox="0 0 220 150" aria-hidden="true"><defs><radialGradient id="lemon-g" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff27a"/><stop offset=".55" stop-color="#ffd21f"/><stop offset="1" stop-color="#d99a00"/></radialGradient></defs>
      <path d="M6 75c8-6 14-12 20-22C44 24 76 12 110 12s66 12 84 41c6 10 12 16 20 22-8 6-14 12-20 22-18 29-50 41-84 41S44 126 26 97C20 87 14 81 6 75z" fill="url(#lemon-g)"/>
      <path d="M24 75h172" stroke="#b07d00" stroke-width="2" opacity=".45"/>
      <ellipse cx="86" cy="42" rx="36" ry="11" fill="#fff" opacity=".4" transform="rotate(-10 86 42)"/>
      <g fill="#b07d00" opacity=".3"><circle cx="140" cy="50" r="2"/><circle cx="160" cy="64" r="2"/><circle cx="62" cy="96" r="2"/><circle cx="120" cy="104" r="2"/><circle cx="92" cy="118" r="1.6"/><circle cx="170" cy="92" r="1.6"/></g></svg>`;
    function hola() {
      const b = $("btn-home");
      clearTimeout(holaTimer);
      b.textContent = "¡HOLA!"; b.classList.add("hola");
      holaTimer = setTimeout(() => { b.textContent = TITLE; b.classList.remove("hola"); }, 2800);
    }
    // The red stripes flash on each repeat of the echo, fainter each time: the title band
    // brightens, and the stripe ring round the winner glows red
    function pulse(at) {
      const n = 7, band = [], ring = [];
      for (let k = 0; k < n; k++) {
        const b = .6 ** k, off = { offset: k / n }, rest = { offset: (k + .85) / n };
        band.push({ ...off, filter: `brightness(${1 + 1.1 * b}) saturate(${1 + .6 * b})` }, { ...rest, filter: "brightness(1) saturate(1)" });
        ring.push({ ...off, boxShadow: `0 0 ${2.5 * b}rem ${.5 * b}rem rgba(255,90,60,${.9 * b})` }, { ...rest, boxShadow: "0 0 0 0 rgba(255,90,60,0)" });
      }
      band.push({ offset: 1, filter: "brightness(1) saturate(1)" }); ring.push({ offset: 1, boxShadow: "0 0 0 0 rgba(255,90,60,0)" });
      setTimeout(() => {
        document.querySelector("header.cover").animate(band, { duration: n * ECHO * 1000 });
        const r = document.querySelector(".winner .ring");
        if (!r) return;
        r.animate(ring, { duration: n * ECHO * 1000 });
        // and each repeat sends a ring outward from the winner, slow and fainter, like the echo itself
        const b = r.getBoundingClientRect();
        for (let k = 0; k < 6; k++) {
          const o = document.createElement("div");
          o.className = "echo-ring";
          Object.assign(o.style, { left: b.left + "px", top: b.top + "px", width: b.width + "px", height: b.height + "px" });
          $("fx").appendChild(o);
          o.animate([{ transform: "scale(1)", opacity: .85 * .7 ** k }, { transform: "scale(2.6)", opacity: 0 }],
            { duration: 1800, delay: k * ECHO * 1000, easing: "cubic-bezier(.2,.6,.3,1)", fill: "both" }).onfinish = () => o.remove();
        }
      }, at * 1000);
    }

    // ---- the four characters
    const T = {
      bono: {
        lock() { Sound.lock(); noise(0, .16, .03, [700, 4000], 1.2); },
        win(w) {
          noise(.6, 1.6, .035, [400, 3000], 1.2); hola();
          const av = w?.querySelector(".av");
          if (REDUCE || !av) return;
          // Where the shades sit on the avatar (the icon's lenses span y 22–46 of its 64), measured
          // from the ring, which isn't animating, so the avatar's pop doesn't throw it off
          const ring = w.querySelector(".ring").getBoundingClientRect(), pad = parseFloat(getComputedStyle(w.querySelector(".ring")).paddingLeft);
          const a = { x: ring.left + pad, y: ring.top + pad, s: ring.width - 2 * pad };
          const tw = a.s, tx = a.x, ty = a.y + a.s * 22 / 64, big = 2.4;
          const el = piece("flyby", SHADES, [
            { transform: `translate(${-tw * big}px, ${innerHeight * .25}px) scale(${big}) rotate(-14deg)`, opacity: 0 },
            { opacity: 1, offset: .15 },
            { transform: `translate(${tx - tw * .15}px, ${ty - tw * .12}px) scale(1.12) rotate(3deg)`, offset: .78 },
            { transform: `translate(${tx}px, ${ty}px) scale(1) rotate(0deg)`, opacity: 1 },
          ], { duration: 2600, delay: 600, easing: "cubic-bezier(.25,.1,.25,1)" });
          el.style.width = tw + "px"; el.style.top = "0"; el.style.transformOrigin = "0 0";
          // Then a slow glint across the lenses, and the shades are part of the picture
          setTimeout(() => {
            if (!av.isConnected) return;
            av.insertAdjacentHTML("beforeend", `<span class="glint"></span>`);
          }, 3150);
        },
      },
      edge: {
        lock() { const e = echo(); note(659.3, { dur: .22, vol: .06, to: e }); note(1318.5, { dur: .12, type: "sine", vol: .015, to: e }); },
        right() { chord(.45, echo()); },
        win() { chord(.7, echo()); if (!REDUCE) pulse(.7); },
      },
      adam: {
        lock() { drum(130, 42, 0, .4, .5); noise(0, .02, .05, 1500); },
        win(w) {
          drum(110, 40, .6, .5, .45); drum(90, 38, 3.5, .5, .35); noise(3.5, .9, .05, [300, 2400], .8);
          const r = w?.querySelector(".ring");
          if (REDUCE || !r) return;
          // PopMart's lemon famously jammed shut. This one comes down on its cables, stops over the
          // winner, and opens for them.
          const ring = r.getBoundingClientRect(), lw = ring.width * 1.7, lh = lw * 150 / 220;
          const x = ring.left + ring.width / 2 - lw / 2, y = ring.top + ring.height / 2 - lh / 2;
          const half = side => `<div class="half ${side}">${LEMON}</div>`;
          const el = piece("lemon", `<i class="cable l"></i><i class="cable r"></i>${half("l")}${half("r")}`, [
            { transform: `translate(${x}px, ${-lh - 40}px)` },
            { transform: `translate(${x}px, ${y + 12}px)`, offset: .85 },
            { transform: `translate(${x}px, ${y}px)` },
          ], { duration: 2600, delay: 500, easing: "cubic-bezier(.3,.6,.3,1)", keep: true });
          el.style.width = lw + "px";
          const halves = el.querySelectorAll(".half"), cables = el.querySelectorAll(".cable");
          [-1, 1].forEach((d, k) => halves[k].animate([
            { transform: "none", opacity: 1 },
            { transform: `translateX(${d * lw * .38}px) rotate(${d * 28}deg)`, opacity: 1, offset: .6 },
            { transform: `translateX(${d * lw * .55}px) translateY(${lh * .3}px) rotate(${d * 40}deg)`, opacity: 0 },
          ], { duration: 1500, delay: 3500, easing: "cubic-bezier(.3,.7,.3,1)", fill: "both" }));
          cables.forEach(c => c.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600, delay: 4200, fill: "both" }));
          setTimeout(() => el.remove(), 5300);
        },
      },
      larry: {
        lock() { roll(); },
        win(w) {
          fill(.6);
          const s = .09, hits = [[0, 5, 6], [2 * s, 5, 7], [4 * s, 6, 8], [6 * s, 6, 9], [8 * s, 12, 12]];   // when, how many, how far (rem)
          w?.querySelector(".ring").insertAdjacentHTML("beforeend", hits.map(([t, n, far], h) =>
            `<span class="burst${h === 4 ? " crash" : ""}" style="--mc:${byId("larry").color};--d:${(.6 + t).toFixed(2)}s;--far:${far}rem">${
              Array.from({ length: n }, (_, i) => `<i style="--a:${(i * 360 / n + h * 17) % 360}deg"></i>`).join("")}</span>`).join(""));
        },
      },
    };

    function mark(p, kind, ms) { marks.set(p.pid, { kind, key: moment(), at: performance.now(), ms }); }
    function lockIn(p) {
      mark(p, "lock", 1000);
      try { (T[p.member]?.lock || (() => Sound.lock()))(); } catch {}
    }
    function right(p) {
      mark(p, "right", REVEAL_MS);
      try { T[p.member]?.right?.(); } catch {}
    }
    // Winner only, once per round. Confetti is part of it: Larry gets stars instead of tape.
    function win(p) {
      if (!p || wonGame === S.game) return;
      wonGame = S.game;
      $("fx").replaceChildren();   // nothing left over from the last reveal
      const w = document.querySelector(".winner");
      w?.classList.add("t-" + p.member);
      try { T[p.member]?.win?.(w); } catch {}
      // The character's moment first; the money comes down once it has landed
      const g = S.game;
      setTimeout(() => { if (S.game === g && S.phase === "final") Confetti.burst(p.member === "adam" ? 55 : 45); }, p.member === "adam" ? 4300 : 2600);
    }
    // What a strip card needs: its classes, how far into its effect it is, and anything drawn over the avatar
    function card(p) {
      const m = marks.get(p.pid), t = m ? performance.now() - m.at : 0;
      const on = m && m.key === moment() && t < m.ms;
      if (m && !on) marks.delete(p.pid);
      return {
        cls: ` t-${p.member}${on ? " t" + m.kind : ""}`,
        style: on ? `;--fx-t:${-Math.round(t)}ms` : "",
        av: p.member === "bono" ? `<svg class="shades" viewBox="0 0 64 64" aria-hidden="true">${byId("bono").icon}</svg>` : "",
        card: p.member === "bono" && on && m.kind === "right" ? `<span class="stamp">Hello, hello!</span>` : "",
      };
    }
    return { lockIn, right, win, card };
  })();

  // ---------- players
  const active = () => S.players.filter(p => p.local || p.connected);
  const vip = () => S.players.find(p => !p.local && p.connected && p.member);
  const canStart = () => active().length > 0 && active().every(p => p.member);
  const placeOf = p => 1 + S.players.filter(x => x.score > p.score).length;
  const rankFor = p => RANKS.find(r => Math.round((p.correct / Math.max(1, S.deck.length)) * 10) >= r.min).name;
  const displayName = p => p.name || (byId(p.member)?.name ?? "Choosing…");
  const shownName = p => p.local ? byId(p.member).name : (p.name || byId(p.member).name);

  // What the awards are made of: a player's whole game, all its rounds
  const blankStats = () => ({ answered: 0, right: 0, wrong: 0, fastWrong: 0, rightMs: 0, lastSec: 0, none: 0, songs: 0, songRight: 0, bestRun: 0, worst: 1 });
  function newPlayer(pid, name, local = false) {
    return { pid, name, local, member: null, conn: null, connected: local, seen: Date.now(), lostAt: 0,
             score: 0, streak: 0, best: 0, correct: 0, answer: null, gain: 0, ok: false, st: blankStats() };
  }
  function resetScores() {
    S.players.forEach(p => Object.assign(p, { score: 0, streak: 0, best: 0, correct: 0, answer: null, gain: 0, ok: false, st: blankStats() }));
    S.gameId = Date.now().toString(36); S.records = [];
    shownScore.clear();
  }

  // ---------- room
  // keep: reopen this room code (after a reload). The old one can take a few seconds to be let go,
  // so keep asking for a while before giving up and opening a new room.
  function openRoom(tries = 0, keep = null) {
    if (room) room.close();
    S.code = keep || Array.from({ length: 4 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
    S.net = "connecting"; render();
    room = Net.host(S.code, {
      onOpen() { S.net = "open"; render(); },
      onError(type) {
        if (type === "unavailable-id" && keep && tries < 15) return setTimeout(() => openRoom(tries + 1, keep), 2000);
        if (type === "unavailable-id" && keep) toast(`Couldn't get room ${keep} back. Phones need to join the new room.`);
        if (type === "unavailable-id" && tries < 5) return openRoom(keep ? 0 : tries + 1);
        S.net = "failed"; S.netErr = type; render();
      },
      onConnection: handleConn,
    });
  }

  function handleConn(c) {
    c.on("data", m => {
      if (m.t === "join") return onJoin(c, m);
      const p = S.players.find(x => x.conn === c);
      if (!p) return;
      p.seen = Date.now();
      if (m.t === "ping") return c.send({ t: "pong" });
      if (m.t === "pick") return pick(p, m.member);
      if (m.t === "answer") return submit(p, m.k);
      if (m.t === "order") return submitOrder(p, m.seq);
      if (m.t === "wager") return placeWager(p, m.k);
      if (p !== vip()) return;
      if (m.t === "mode" && (S.phase === "lobby" || S.phase === "final") && MODES.some(x => x.id === m.mode)) setMode(m.mode);
      else if (m.t === "start" && S.phase === "lobby") startGame();
      else if (m.t === "next" && S.phase === "reveal") nextQuestion();
      else if (m.t === "again" && S.phase === "final") nextRound();
      else if (m.t === "lobby" && S.phase === "final") endGame();
      else if (m.t === "skip") { skipHost(); skipAward(); }
    });
    c.on("close", () => {
      const p = S.players.find(x => x.conn === c);
      if (p) { p.conn = null; p.connected = false; p.lostAt = Date.now(); sync(); maybeAllAnswered(); }
    });
  }

  function onJoin(c, m) {
    const pid = String(m.pid || "").slice(0, 40);
    const name = String(m.name || "").replace(/\s+/g, " ").trim().slice(0, 14);
    // One connection, one seat
    const own = S.players.find(x => x.conn === c);
    if (own && own.pid !== pid) return;
    let p = S.players.find(x => x.pid === pid && !x.local);
    if (!p) {
      if (S.phase !== "lobby") return c.send({ t: "reject", reason: "A game is in progress. You can join when it finishes." });
      if (S.players.length >= MAX) return c.send({ t: "reject", reason: "The game is full. Four players is the limit." });
      p = newPlayer(pid, name);
      S.players.push(p);
      Sound.join();
    } else if (S.phase === "lobby" && name) p.name = name;
    if (p.conn && p.conn !== c) { try { p.conn.send({ t: "reject", reason: "Your seat was picked up on another screen." }); } catch {} }
    Object.assign(p, { conn: c, connected: true, seen: Date.now(), lostAt: 0 });
    sync();
  }

  function pick(p, memberId) {
    if (S.phase !== "lobby" || !byId(memberId)) return;
    if (S.players.some(x => x !== p && x.member === memberId)) return sync();
    p.member = memberId;
    Sound.join();
    sync();
    // The last game's winner, back for more (by the name they typed): MacPhisto notices
    if (!p.greeted && Hall.isChamp(p.name)) {
      p.greeted = true;
      seatedCount = S.players.filter(x => x.member).length;
      return Host.sayNext(Host.pick(LINES.champBack), () => S.phase === "lobby");
    }
    lobbyChatter();
  }

  // The TV can also seat one player who uses this screen (mouse, or keys 1–4).
  function toggleCouch(memberId) {
    if (S.phase !== "lobby") return;
    const couch = S.players.find(p => p.local);
    const holder = S.players.find(p => p.member === memberId);
    if (holder && holder !== couch) return;
    if (couch && couch.member === memberId) S.players.splice(S.players.indexOf(couch), 1);
    else if (couch) couch.member = memberId;
    else if (S.players.length < MAX) { const p = newPlayer("tv", "On the TV", true); p.member = memberId; S.players.push(p); }
    Sound.join();
    sync();
    lobbyChatter();
  }

  // ---------- game flow
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // ---------- name that song
  // Previews and artwork stream from Apple; nothing is hosted here.
  const SONGS = window.U2S?.SONGS || [];

  function songQuestion(song) {
    // Wrong answers: songs from around the same time, so the year alone doesn't give it away.
    // A hit only gets other hits, so a B-side never gives the answer away by being obscure.
    // In the deep-cut Name That Song round, a deep cut only gets deep cuts, so a hit can't be ruled out at a glance.
    const near = SONGS.filter(x => x.title !== song.title && (song.tier === "hit" ? x.tier === "hit" : roundMode() !== "deep-songs" || x.tier === "deep"))
      .map(x => ({ x, d: Math.abs(x.year - song.year) + Math.random() * 3 }))
      .sort((a, b) => a.d - b.d).slice(0, 8).map(o => o.x);
    return { q: "Name that song", a: song.title, w: shuffle(near).slice(0, 3).map(x => x.title), song };
  }

  // ---------- name the album
  // The TV starts zoomed in on a detail of the cover and pulls back as the clock runs down.
  const COVERS = window.U2C?.COVERS || [];

  function coverQuestion(cover) {
    // Wrong answers: studio albums from around the same time (never the Deep Cuts-only covers).
    const near = COVERS.filter(x => x.tier === "casual" && x.title !== cover.title)
      .map(x => ({ x, d: Math.abs(x.year - cover.year) + Math.random() * 3 }))
      .sort((a, b) => a.d - b.d).slice(0, 6).map(o => o.x);
    return { q: "Name the album", a: cover.title, w: shuffle(near).slice(0, 3).map(x => x.title), cover };
  }

  // "Put them in order": four items from one set, all from different years. Right is oldest first.
  // right[i] is the index (into opts) of the item that belongs in place i.
  function orderQuestion(mode) {
    const set = Used.take("order-" + mode, ORDER.filter(o => o.modes.includes(mode)), 1, o => o.id)[0];
    const picked = [];
    for (const [t, y] of shuffle(set.items)) if (picked.length < 4 && !picked.some(x => x.y === y)) picked.push({ t, y });
    const right = picked.map((_, k) => k).sort((a, b) => picked[a].y - picked[b].y);
    return { q: set.q, order: true, opts: picked.map(x => x.t), years: picked.map(x => x.y), right, a: "", w: [],
             f: `From ${picked[right[0]].y} to ${picked[right[3]].y}: ${picked[right[3]].y - picked[right[0]].y} years in four cards.` };
  }

  // Ten questions. Name That Song is all clips (mostly hits, some deep cuts);
  // the other modes are trivia with one clip, one album cover and one put-them-in-order slipped in somewhere in the middle.
  // No repeats: the TV remembers every question and clip it has used (in this browser, across
  // nights) and only deals unused ones. When a pool runs low it starts over on that pool.
  const Used = {
    key: "wtshng-used",
    data: (() => { try { return JSON.parse(localStorage.getItem("wtshng-used")) || {}; } catch { return {}; } })(),
    save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch {} },
    recent: new Set(),   // everything dealt since the TV page loaded: never repeated tonight
    // Take n items from list that haven't been used in this pool. When too few are left, deal all of
    // those first, top up with ones not seen tonight, and start the pool's memory over from there.
    // Read the memory again first: another TV window may have dealt (and saved) since this one loaded.
    load() { try { this.data = JSON.parse(localStorage.getItem(this.key)) || {}; } catch {} },
    take(pool, list, n, id, kind = () => "") {
      this.load();
      const seen = new Set([...(this.data[pool] || []), ...[...this.recent].filter(k => k.startsWith(pool + ":")).map(k => k.slice(pool.length + 1))]);
      const fresh = shuffle(list.filter(x => !seen.has(id(x))));
      // Variety: no two of the same kind of question (say, two "Which album features…") in one deal while others are left
      const kinds = new Set(), varied = [];
      for (const x of fresh) if (varied.length < n && (!kind(x) || !kinds.has(kind(x)))) { varied.push(x); kinds.add(kind(x)); }
      for (const x of fresh) if (varied.length < n && !varied.includes(x)) varied.push(x);
      let picked = varied, restart = false;
      if (picked.length < n) {
        restart = true;
        const rest = shuffle(list.filter(x => seen.has(id(x))));
        const notTonight = rest.filter(x => !this.recent.has(pool + ":" + id(x)));
        picked = picked.concat(notTonight, rest.filter(x => this.recent.has(pool + ":" + id(x)))).slice(0, n);
      }
      picked.forEach(x => this.recent.add(pool + ":" + id(x)));
      this.data[pool] = restart ? picked.map(id) : [...seen, ...picked.map(id)];
      this.save();
      return picked;
    },
  };

  // The kind of question, from how it starts ("which album features", "emoji time", "odd one out"…)
  const questionKind = q => q.q.toLowerCase().replace(/[^a-z ]/g, " ").split(/\s+/).filter(Boolean).slice(0, 3).join(" ");

  function buildDeck(mode) {
    if ((mode === "songs" || mode === "deep-songs") && !SONGS.length) mode = mode === "songs" ? "casual" : "deep";   // song list didn't load
    const songId = x => x.id;
    if (mode === "deep-songs") return Used.take("song-deep", SONGS.filter(x => x.tier === "deep"), ROUND, songId).map(songQuestion);
    if (mode === "songs") {
      const hits = Used.take("song-hit", SONGS.filter(x => x.tier === "hit"), 6, songId);
      const deep = Used.take("song-deep", SONGS.filter(x => x.tier === "deep"), 4, songId);
      return shuffle([...hits, ...deep]).map(songQuestion);
    }
    const tier = mode === "deep" ? "deep" : "hit";
    const pool = SONGS.filter(x => x.tier === tier);
    // Casual gets the studio albums; Deep Cuts gets those plus the Deep Cuts-only covers.
    const covers = COVERS.filter(x => x.tier === "casual" || mode === "deep");
    const [songAt, coverAt, orderAt] = shuffle([2, 3, 4, 5, 6, 7]);   // three different slots in the middle
    const extras = [];
    if (pool.length) extras.push([songAt, () => songQuestion(Used.take("song-" + tier, pool, 1, songId)[0])]);
    if (covers.length) extras.push([coverAt, () => coverQuestion(Used.take("cover-" + mode, covers, 1, x => x.id)[0])]);
    if (ORDER?.some(o => o.modes.includes(mode))) extras.push([orderAt, () => orderQuestion(mode)]);
    // Only deal (and mark as used) the trivia questions that will actually be asked
    const deck = Used.take(mode, Q.filter(q => q.m === mode), ROUND - extras.length, q => q.q, questionKind);
    extras.sort((a, b) => a[0] - b[0]).forEach(([at, make]) => deck.splice(at, 0, make()));
    return deck;
  }

  const Player = {
    el: new Audio(), fader: null,
    play(url) {
      this.stop();
      if (!url) return;
      this.el.src = url; this.el.volume = 1;
      this.el.play().catch(() => toast("The TV couldn't play the clip. Click anywhere on the TV screen once so it can play sound."));
    },
    fade(to, ms = 800) {
      clearInterval(this.fader);
      const from = this.el.volume, t0 = performance.now();
      this.fader = setInterval(() => {
        const k = Math.min(1, (performance.now() - t0) / ms);
        this.el.volume = from + (to - from) * k;
        if (k === 1) clearInterval(this.fader);
      }, 30);
    },
    stop() { clearInterval(this.fader); this.el.pause(); this.el.removeAttribute("src"); this.el.load(); },
    unlocked: false,
    unlock() {   // call from a click or key: play a moment of silence so Safari allows the clips later
      if (this.unlocked || !this.el.paused || !window.MacPhisto) return;
      this.unlocked = true;
      this.el.src = MacPhisto.SILENCE;
      this.el.play().then(() => { if (this.el.src === MacPhisto.SILENCE) this.stop(); }, () => { this.unlocked = false; });
    },
  };

  // ---------- MacPhisto, the host (macphisto.js draws him; host-lines.js has his lines and their timings)
  // He talks between questions, never over one: at the start of a round, before the song, album and
  // last questions (once a night each), on some reveals, at the final scores, and in the lobby.
  // Anything he says can be skipped: Enter on the TV, or the VIP's phone.
  // What he can say at each moment. Lines not recorded yet (not in host-lines.js) are simply skipped,
  // so a new take starts playing as soon as its MP3 and README row are added.
  // Each list is in order of preference: the best line first. MacPhisto plays what this TV has heard
  // least (over all nights), and among those, usually the first; so a first night hears the best ones.
  const LINES = {
    welcome: ["welcome-1", "welcome-5", "welcome-2", "welcome-4", "welcome-3", "welcome-6"],
    join: ["join-1", "join-4", "join-6", "join-2", "join-9", "join-3", "join-7", "join-8", "join-5", "join-10"],
    full: ["lobby-full-1"],
    round1: ["start-4", "round-start-5", "round-start-7", "round-start-4", "round-start-6", "round-start-8", "round-start-1", "round-start-9"],
    round2: ["next-round-4", "round-two-1", "round-two-4", "round-two-2", "round-two-5", "round-two-3"],
    roundN: ["next-round-5", "next-round-7", "next-round-2", "next-round-1", "next-round-9", "next-round-6", "next-round-8", "next-round-10", "round-start-3", "next-round-3", "next-round-11", "round-start-2"],
    song: ["song-3", "song-6", "song-8", "song-4", "song-7", "song-9", "song-5", "song-10", "song-1", "song-11", "song-2", "song-12"],
    cover: ["cover-3", "cover-4", "cover-11", "cover-7", "cover-2", "cover-8", "cover-1", "cover-9", "cover-10", "cover-5", "cover-6"],
    lastq: ["last-question-3", "last-q-3", "last-question-2"],
    streak: m => ["streak-any-6", `streak-${m}-2`, "streak-any-10", "streak-any-1", "streak-any-3", "streak-any-7", `streak-${m}-1`, "streak-any-4", "streak-any-9", "streak-any-2", "streak-any-8", "streak-any-11", "streak-any-5"],
    lead: ["lead-change-9", "lead-change-3", "lead-change-14", "lead-change-2", "lead-change-7", "lead-change-11", "lead-change-5", "lead-change-12", "lead-change-4", "lead-change-1", "lead-change-10", "lead-change-13", "lead-change-6", "lead-change-8"],
    broken: ["streak-broken-2", "streak-broken-5", "streak-broken-7", "streak-broken-3", "streak-broken-10", "streak-broken-1", "streak-broken-9", "streak-broken-6", "streak-broken-8", "streak-broken-4"],
    allRight: ["all-right-4", "all-right-7", "all-right-9", "all-right-3", "all-right-11", "all-right-5", "all-right-2", "all-right-6", "all-right-1", "all-right-10", "all-right-8"],
    hurry: ["hurry-3", "hurry-6", "hurry-1", "hurry-2", "hurry-4", "hurry-5"],
    nobody: ["nobody-right-5", "nobody-right-3", "nobody-right-2", "nobody-right-8", "nobody-right-4", "nobody-right-6", "nobody-right-10", "nobody-right-11", "nobody-right-7"],
    nobodyGroup: ["nobody-right-9", "nobody-right-12", "nobody-right-1"],   // "Not ONE of you": needs company
    sameWrong: ["same-wrong-1", "same-wrong-5", "same-wrong-2", "same-wrong-3", "same-wrong-4"],   // everyone answered, all with the same wrong answer
    loneRight: ["lone-right-1", "lone-right-4", "lone-right-3", "lone-right-5", "lone-right-6", "lone-right-2", "lone-right-7"],   // only one player right
    buzzer: ["buzzer-2", "buzzer-5", "buzzer-1", "buzzer-3", "buzzer-4"],   // right in the last second
    close: ["close-3", "close-6", "close-2", "close-1", "close-4", "close-5", "close-7"],
    lastPlace: ["last-place-2", "last-place-6", "last-place-11", "last-place-5", "last-place-1", "last-place-8", "last-place-9", "last-place-3", "last-place-10", "last-place-4", "last-place-7"],
    aside: ["aside-1", "aside-2", "aside-11", "phone-1", "aside-5", "aside-14", "aside-6", "aside-8", "aside-3", "aside-15", "aside-4", "aside-10", "aside-12", "aside-7", "aside-9", "aside-13"],   // a quiet reveal
    winner: ["winner-6", "winner-1", "winner-11", "winner-8", "winner-3", "winner-12", "winner-7", "winner-15", "winner-9", "winner-16", "winner-2", "winner-14", "winner-5", "winner-4", "winner-10", "winner-13"],
    tie: ["tie-1", "tie-2", "tie-3", "tie-4", "close-2"],
    goodnight: ["goodnight-4", "goodnight-1", "goodnight-3", "goodnight-5", "goodnight-6", "goodnight-7", "goodnight-2", "goodnight-8"],
    double: ["double-3", "double-1", "double-8", "double-4", "double-10", "double-2", "double-11", "double-12", "double-5", "double-6", "double-9", "double-7"],   // never says "last": mid-tournament it isn't
    whoSaid: ["who-said-2", "who-said-7", "who-said-3", "who-said-1", "who-said-5", "who-said-8", "who-said-4", "who-said-6"],
    awardsIntro: ["awards-intro-1", "awards-intro-2"],
    champBack: ["champ-back-2", "champ-back-1", "champ-back-3"],   // the reigning champion sits down
    order: ["order-1", "order-6", "order-4", "order-2", "order-9", "order-3", "order-7", "order-10", "order-5", "order-8"],   // before a put-them-in-order question
    wager: ["wager-2", "wager-1", "wager-6", "wager-3", "wager-4", "wager-5"],
    betWon: ["bet-won-2", "bet-won-1", "bet-won-6", "bet-won-3", "bet-won-4", "bet-won-5"],
    betLost: ["bet-lost-1", "bet-lost-4", "bet-lost-3", "bet-lost-5", "bet-lost-2", "bet-lost-6"],
    tourBreak: leg => [1, 2, 3, 4].map(n => `tour-break-${leg}-${n}`),   // after round 1 or 2: what's next
    tourWinner: ["tour-winner-2", "tour-winner-1", "tour-winner-4", "tour-winner-3", "tour-winner-5"],
  };

  // MacPhisto reading the questions (question-voice.js): each becomes a host line "q-<id>" with no subtitles
  const QV = window.QUESTION_VOICE || {};
  if (window.HOST_LINES) for (const [text, v] of Object.entries(QV))
    HOST_LINES["q-" + v.id] = { moment: "Question", dur: v.dur, fps: 25, env: v.env, phrases: [], src: `audio/q/${v.id}.mp3`, text };
  const readingOf = q => (q && !q.song && QV[q.q] ? "q-" + QV[q.q].id : null);

  const Host = (() => {
    const box = document.createElement("div");
    const mp = window.MacPhisto && window.HOST_LINES ? MacPhisto.mount(box) : null;
    const said = new Set();   // lines heard tonight, so he doesn't repeat himself
    const HEARD = "wtshng-heard";   // how often this TV has played each line, over all nights
    let heard = {};
    try { heard = JSON.parse(localStorage.getItem(HEARD)) || {}; } catch {}
    let queued = null, token = 0;
    const has = id => !!(mp && HOST_LINES[id]);
    // One of ids (best first), preferring lines not heard tonight. fresh: only lines not heard tonight.
    // Of those, the ones this TV has played least; of those, usually the best, sometimes the next best.
    function pick(ids, fresh = false) {
      const ok = ids.filter(has), unheard = ok.filter(id => !said.has(id));
      const pool = unheard.length || fresh ? unheard : ok;
      if (!pool.length) return null;
      const least = Math.min(...pool.map(id => heard[id] || 0)), top = pool.filter(id => (heard[id] || 0) === least);
      return top[top.length > 1 && Math.random() < .25 ? 1 : 0];
    }
    // Resolves when he finishes or is cut off. duck: turn the song down under him.
    function say(id, { duck = false } = {}) {
      if (!has(id)) return Promise.resolve();
      said.add(id); queued = null;
      const t = ++token;
      if (duck) Player.fade(0, 400);   // nothing under his voice
      const safety = setTimeout(() => t === token && mp.stop(), (HOST_LINES[id].dur + 4) * 1000);
      return mp.say(id).then(played => {
        if (!played) return said.delete(id);   // a blocked line can be tried again
        if (id.startsWith("q-")) return;   // question readings aren't in the rotation
        heard[id] = (heard[id] || 0) + 1;
        try { localStorage.setItem(HEARD, JSON.stringify(heard)); } catch {}
      }, () => said.delete(id)).finally(() => {
        clearTimeout(safety);
        if (t !== token) return;
        const q = queued; queued = null;
        if (q && q.when()) say(q.id);
      });
    }
    // Say it now, or after the line he's in the middle of (if when() still holds then).
    function sayNext(id, when) { if (!id) return; if (mp?.speaking) queued = { id, when }; else say(id); }
    function stop() { queued = null; token++; mp?.stop(); }
    function place(slot, cls) {
      if (!mp || !slot) return;
      box.className = "host " + cls;
      if (box.parentNode !== slot) slot.appendChild(box);
    }
    return { ready: !!mp, pick, say, sayNext, stop, place, unlock: () => mp?.unlock(), walls: (text, ms) => mp?.walls(text, ms), dur: id => (has(id) ? HOST_LINES[id].dur : 0), get speaking() { return !!mp?.speaking; } };
  })();

  // His own spot: the screen is his until the line ends (or someone skips), then then() carries on.
  let hostToken = 0;
  function hostBeat(ids, label, then, fresh = false) {
    const id = Host.ready && Host.pick(ids, fresh);
    if (!id) return then();
    S.hostNext = then === countIn ? "countin" : then === startWager ? "wager" : "question";   // where a reload picks up
    const t = ++hostToken;
    Object.assign(S, { phase: "host", hostLine: id, hostLabel: label, hostKey: `${S.game}:${S.i}:${t}` });
    clearTimeout(qTimer); clearTimeout(rTimer);
    Player.stop();
    sync();
    Host.say(id).then(() => { if (t === hostToken && S.phase === "host") then(); });
  }
  function skipHost() { if (S.phase === "host") Host.stop(); }

  // Preview links can change, so refresh them from Apple when the TV loads.
  (async () => {
    try {
      for (let i = 0; i < SONGS.length; i += 150) {
        const ids = SONGS.slice(i, i + 150).map(x => x.id).join(",");
        const r = await fetch(`https://itunes.apple.com/lookup?id=${ids}&country=us`);
        const fresh = new Map((await r.json()).results.map(x => [x.trackId, x.previewUrl]));
        SONGS.forEach(x => { if (fresh.get(x.id)) x.preview = fresh.get(x.id); });
      }
    } catch {}
  })();

  // A game is a run of rounds. Scores carry over from round to round; each round can be a
  // different mode. Going back to the start screen ends the game.
  // A tournament is three rounds in a set order, scores carried, ending on the final wager.
  const TOUR = ["casual", "deep-songs", "deep"];
  const TOUR_NAMES = { casual: "Casual Fan", "deep-songs": "Name That Song: Deep Cuts", deep: "Deep Cuts" };
  const roundMode = () => (S.mode === "tournament" ? TOUR[(S.leg || 1) - 1] : S.mode);
  const modeName = () => (S.mode === "tournament" ? `Tournament · ${TOUR_NAMES[roundMode()]}` : MODES.find(m => m.id === S.mode).name);

  function startGame() { startRound(true); }
  function nextRound() { startRound(false); }

  function startRound(fresh) {
    // Everyone still here must have a character.
    if (!canStart()) return sync();
    // A new game (or a new tournament) drops anyone who left. Between rounds, someone whose phone is asleep keeps their seat and score.
    // A tournament carries on to its next round; otherwise (new game, or after its last round) it starts over, scores and all.
    let restart = fresh;
    if (S.mode === "tournament") {
      if (!fresh && S.inTour && S.leg < 3) S.leg++;
      else { S.leg = 1; restart = true; }
      S.inTour = true;
    } else S.inTour = false;
    if (restart) S.players = S.players.filter(p => p.local || p.connected);
    S.deck = buildDeck(roundMode()).map(q => (q.order ? q : { ...q, opts: shuffle([q.a, ...q.w]) }));
    S.deck.forEach(q => { if (q.cover) new Image().src = q.cover.art; });   // fetch the cover now so it's there when its question comes up
    if (restart || !S.round) { resetScores(); S.round = 1; }
    else {
      S.round++;
      S.players.forEach(p => Object.assign(p, { streak: 0, best: 0, correct: 0, answer: null, gain: 0, ok: false }));
    }
    S.players.forEach(p => { p.roundStart = p.score; p.wager = null; });
    // The last question is worth double, except at the end of a tournament: that's the final wager.
    S.finale = S.mode === "tournament" && S.leg === 3 ? "wager" : "double";
    S.i = 0; S.game++; S.revealLines = 0; S.lastHostAt = -2; S.roundLines = new Set();
    Host.stop();
    // MacPhisto opens the round, then the count-in
    const label = S.mode === "tournament" ? `Tournament · Round ${S.leg} of 3 · ${TOUR_NAMES[roundMode()]}` : `Round ${S.round} · ${modeName()}`;
    // Round 2 gets "count us in... in Spanish... and BADLY" (once a night), right before the Vertigo count-in
    const opener = S.round === 1 ? LINES.round1 : S.round === 2 && Host.pick(LINES.round2, true) ? LINES.round2 : LINES.roundN;
    hostBeat(opener, label, countIn);
  }

  function countIn() {
    // "Unos, dos, tres, catorce!" before the first question
    Host.stop();
    S.phase = "countin";
    Sound.countIn();   // picks the clip or the robot voice, and with it the word timing
    S.countMs = Math.round((countAt[3] + COUNT_HOLD) * 1000);
    S.countEndsAt = Date.now() + S.countMs;
    clearTimeout(qTimer);
    qTimer = setTimeout(beginQuestion, S.countMs);
    sync();
  }

  function beginQuestion() {
    clearTimeout(rTimer);
    Host.stop();   // never over a question
    S.phase = "question";
    const q = S.deck[S.i];
    if (q.song) Player.play(q.song.preview); else Player.stop();
    S.players.forEach(p => { p.answer = null; p.gain = 0; p.ok = false; p.placed = 0; });
    S.qSecs = q.order ? ORDER_SECS : SECS;   // sorting four things takes longer than picking one
    couchSeq = [];
    // MacPhisto reads the question out (not a song: the clip is the question); the clock starts when he's done.
    // Answers count from the start, so anyone who knows it while he's still talking gets full speed points.
    const reading = Host.ready && (navigator.userActivation?.hasBeenActive ?? true) && readingOf(q), readMs = reading ? Math.round(Host.dur(reading) * 1000) + 300 : 0;
    S.readingUntil = Date.now() + readMs;
    S.qShownAt = Date.now();
    S.endsAt = Date.now() + readMs + S.qSecs * 1000;
    clearTimeout(qTimer);
    qTimer = setTimeout(reveal, readMs + S.qSecs * 1000 + 200);
    if (reading) Host.say(reading);
    sync();
  }

  // ---------- the final wager: before the last question, everyone bets part of their score.
  // Right wins the bet, wrong loses it (never below zero). Anyone under 200 can still bet 200,
  // so whoever's behind always has a way back.
  function wagerTiers(p) {
    const max = Math.max(p.score, 200), r = x => Math.round(x / 10) * 10;
    return [0, r(max / 4), r(max / 2), max];
  }
  function startWager() {
    clearTimeout(qTimer); clearTimeout(rTimer);
    Player.stop(); Host.stop();
    S.phase = "wager";
    S.players.forEach(p => p.wager = null);
    S.wagerEndsAt = Date.now() + WAGER_SECS * 1000;
    qTimer = setTimeout(endWager, WAGER_SECS * 1000 + 200);
    sync();
  }
  function placeWager(p, k) {
    if (S.phase !== "wager" || p.wager !== null || !Number.isInteger(k) || k < 0 || k > 3 || !p.member) return;
    p.wager = wagerTiers(p)[k];
    Sound.lock();
    sync();
    maybeAllAnswered();
  }
  function endWager() {
    if (S.phase !== "wager") return;
    Host.walls("", 0);
    S.players.forEach(p => { if (p.wager === null) p.wager = 0; });
    beginQuestion();
  }
  const finaleNow = () => (S.i === S.deck.length - 1 ? S.finale : null);
  // The final question's category, shown while everyone bets (Final Jeopardy style)
  function finalCategory() {
    const q = S.deck[S.deck.length - 1] || {};
    return q.c || (q.song ? "Name That Song" : q.cover ? "Album Covers" : "Deep Cuts");
  }

  function submit(p, k) {
    if (S.phase !== "question" || S.deck[S.i].order || p.answer || !Number.isInteger(k) || k < 0 || k > 3 || !p.member) return;
    p.answer = { k, at: Date.now() };
    Touches.lockIn(p);   // the character's own lock-in sound (and card effect)
    sync();
    maybeAllAnswered();
  }

  // A put-them-in-order answer: all four, as indexes into opts, first place first
  function submitOrder(p, seq) {
    if (S.phase !== "question" || !S.deck[S.i].order || p.answer || !p.member) return;
    if (!Array.isArray(seq) || seq.length !== 4 || !seq.every(k => Number.isInteger(k) && k >= 0 && k < 4) || new Set(seq).size !== 4) return;
    p.answer = { seq: seq.slice(), at: Date.now() };
    Touches.lockIn(p);
    sync();
    maybeAllAnswered();
  }
  // The player on the TV: a click or key 1–4 answers, or in a sorting question puts the next one in place
  // (the last one goes in by itself; Backspace takes the last one back).
  let couchSeq = [];
  function couchTap(k) {
    const c = S.players.find(p => p.local);
    if (!c) return;
    if (!S.deck[S.i]?.order) return submit(c, k);
